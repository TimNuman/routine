<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ons dagritme</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dagritme">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --baloo: 'Baloo 2', ui-rounded, system-ui, sans-serif;
    --nunito: 'Nunito', ui-rounded, -apple-system, system-ui, sans-serif;
    --inkt: #2B2D42;
    --inkt-zacht: #5B5D7A;
    --oranje: #F2994A;
    --oranje-diep: #E07B2C;
    --groen: #34C759;
    --rood: #E5484D;
    --scheiding: rgba(43,45,66,.08);
    --tegel: rgba(255,255,255,.72);
    --tegelrand: rgba(255,255,255,.9);
    --veld: rgba(255,255,255,.85);
    --veldrand: rgba(43,45,66,.14);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    font-family: var(--nunito);
    color: var(--inkt);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    background:
      radial-gradient(1100px 640px at 10% -10%, #FFD7A0 0%, rgba(255,215,160,0) 60%),
      radial-gradient(820px 560px at 98% 4%, #FFC6E2 0%, rgba(255,198,226,0) 56%),
      radial-gradient(900px 760px at 62% 106%, #B7DEFF 0%, rgba(183,222,255,0) 58%),
      #FFF6E9;
    background-attachment: fixed;
    transition: background .4s ease, color .4s ease;
  }
  body.nacht{
    color:#F4F1FF;
    --inkt: #F4F1FF;
    --inkt-zacht: #A6A8D4;
    --scheiding: rgba(255,255,255,.10);
    --tegel: rgba(255,255,255,.10);
    --tegelrand: rgba(255,255,255,.16);
    --veld: rgba(255,255,255,.10);
    --veldrand: rgba(255,255,255,.16);
    background:
      radial-gradient(880px 560px at 86% -8%, #45408F 0%, rgba(69,64,143,0) 58%),
      radial-gradient(760px 660px at 4% 26%, #1D4C7C 0%, rgba(29,76,124,0) 56%),
      radial-gradient(880px 680px at 48% 108%, #5A3272 0%, rgba(90,50,114,0) 60%),
      #10122F;
    background-attachment: fixed;
  }
  button{ font-family: inherit; color: inherit; }

  /* Het glas uit de ontwerpen: melkwit, sterk vervaagd, met een lichtrandje
     aan de bovenkant. Waar backdrop-filter niet werkt houdt de vulling het
     beeld nog steeds leesbaar. */
  .glas{
    background: rgba(255,255,255,.62);
    backdrop-filter: blur(44px) saturate(200%);
    -webkit-backdrop-filter: blur(44px) saturate(200%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -1px 0 rgba(255,255,255,.4),
      0 16px 38px rgba(126,84,42,.16);
  }
  .glas-zwevend{ background: rgba(255,255,255,.82); }
  body.nacht .glas{
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 16px 38px rgba(4,6,26,.46);
  }
  body.nacht .glas-zwevend{ background: rgba(255,255,255,.13); }
  /* Kan de browser niet vervagen, dan is doorschijnend glas onleesbaar; dek de
     achtergrond dan gewoon af. */
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))){
    .glas{ background: rgba(255,255,255,.88); }
    .glas-zwevend{ background: rgba(255,255,255,.96); }
    body.nacht .glas{ background: rgba(40,42,92,.90); }
    body.nacht .glas-zwevend{ background: rgba(40,42,92,.97); }
  }

  /* ------------------------------------------------------------- kader --- */
  /* Alle tekst springt evenveel in als de inhoud van een kaart, zodat titels,
     kopjes en de eerste emoji op één lijn staan. */
  :root{ --insprong: 16px; --gootje: 22px; }
  .app{
    max-width:1280px; margin:0 auto; position:relative;
    padding: calc(env(safe-area-inset-top) + 42px) var(--gootje) 132px;
  }
  .kop{ display:block; position:relative; }
  .koptekst{ padding-left: var(--insprong); }
  .kop h1{
    font-family: var(--baloo); font-weight:800;
    font-size:36px; line-height:1.06; letter-spacing:-.5px; margin:0;
  }
  .kopdatum{ font-weight:700; font-size:15px; color: var(--inkt-zacht); margin-top:3px; }
  .pagina[hidden]{ display:none; }

  /* --------------------------------------------------------- schakelaar --- */
  .segment{
    display:flex; gap:4px; padding:4px; border-radius:19px; margin-top:16px;
  }
  .segment[hidden]{ display:none; }
  .segment button{
    flex:1; padding:9px 0; border-radius:15px; border:1px solid transparent;
    background:none; cursor:pointer;
    font-family: var(--baloo); font-weight:800; font-size:15px; color: var(--inkt-zacht);
  }
  .segment button.aan{
    background: rgba(255,255,255,.86);
    border-color: rgba(255,255,255,.95);
    box-shadow: 0 3px 10px rgba(0,0,0,.10);
    color: var(--inkt);
  }
  body.nacht .segment button.aan{
    background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.20);
  }

  /* ---------------------------------------------------------- voortgang --- */
  .voortgang{ border-radius:26px; margin-top:14px; overflow:hidden; display:flex; }
  .voortgang[hidden]{ display:none; }
  .vperson{ flex:1; display:flex; align-items:center; gap:11px; padding:13px 14px; min-width:0; }
  .vperson + .vperson{ border-left:1px solid var(--scheiding); }
  .vbol{
    width:46px; height:46px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1;
  }
  .vtekst{ flex:1; min-width:0; }
  .vregel{ display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .vnaam{ font-family: var(--baloo); font-weight:800; font-size:16px; }
  .vtelling{ font-weight:800; font-size:12.5px; color: var(--inkt-zacht); }
  .vbalk{ height:7px; border-radius:99px; background: rgba(43,45,66,.10); overflow:hidden; margin-top:6px; }
  body.nacht .vbalk{ background: rgba(255,255,255,.14); }
  .vbalk span{ display:block; height:100%; border-radius:99px; transition: width .3s ease; }

  /* ------------------------------------------------------------ groepen --- */
  /* De ritmepagina is één kolom op een telefoon en twee op een breed scherm;
     display:contents laat de blokken van het overzicht dan tussen de stappen
     zakken (Vandaag erboven, Morgen eronder). */
  .ritmelijf{ display:flex; flex-direction:column; }
  .ritmehoofd, .ritmezij{ display:contents; }
  .voortgang{ order:1; }
  .agendablok{ order:2; }
  /* Morgen zakt onder de stappen, met een streep ertussen. */
  .agendablok.later{
    order:4; margin-top:26px; padding-top:22px;
    border-top:1px dashed var(--scheiding);
  }
  #groepen{ order:3; }
  .opnieuw{ order:5; }

  .groepkop{
    display:flex; align-items:baseline; gap:12px;
    padding:0 var(--insprong) 10px; margin-top:20px;
  }
  .groepnaam{ font-family: var(--baloo); font-weight:800; font-size:17px; }
  .groeptijd{ font-weight:700; font-size:13px; color: var(--inkt-zacht); }
  .kaart{ border-radius:26px; overflow:hidden; }
  .streep{ height:1px; background: var(--scheiding); margin:0 var(--insprong); }

  /* Overal even brede kaartjes: drie op een rij op een telefoon, vijf zodra er
     ruimte is. Een groep met minder stappen laat de rij verder leeg. */
  .kaartraster{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
  .taakkaart{
    display:flex; flex-direction:column; align-items:center; gap:7px;
    padding:12px 6px 10px; border-radius:22px; min-height:142px;
  }
  .tegel{
    width:46px; height:46px; border-radius:15px; flex:none;
    background: var(--tegel); border:1px solid var(--tegelrand);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .taakkaart .taaknaam{
    font-family: var(--baloo); font-weight:700; font-size:13px; line-height:1.2;
    text-align:center; text-wrap:pretty;
  }
  .taaknaam{
    flex:1; min-width:0;
    font-family: var(--baloo); font-weight:700; font-size:16.5px; line-height:1.2;
  }
  .rondjes{
    display:flex; gap:2px; flex:none; margin-top:auto;
    --rond:34px; --gezicht:28px; --teken:16px; --vinkmaat:14px;
  }
  .rondje{
    width: var(--rond); height: var(--rond);
    flex:none; position:relative; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0;
  }
  .rondje .ring{ border-radius:50%; box-shadow: inset 0 0 0 1.5px rgba(43,45,66,.14); }
  body.nacht .rondje .ring{ box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
  .rondje .gezicht{
    width: var(--gezicht); height: var(--gezicht); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: var(--teken); line-height:1;
    filter: grayscale(1); opacity:.40;
    transition: filter .2s ease, opacity .2s ease;
  }
  .rondje[aria-pressed="true"] .ring{
    box-shadow: 0 0 0 2.5px var(--groen), 0 4px 10px rgba(0,0,0,.16);
  }
  .rondje[aria-pressed="true"] .gezicht{ filter:none; opacity:1; }
  .vink{
    position:absolute; right:0; bottom:0;
    width: var(--vinkmaat); height: var(--vinkmaat); border-radius:50%;
    background: var(--groen); border:2px solid #fff;
    display:none; align-items:center; justify-content:center;
  }
  body.nacht .vink{ border-color:#181A3A; }
  .rondje[aria-pressed="true"] .vink{ display:flex; }

  .leegkaart{
    border-radius:26px; padding:28px 20px; text-align:center;
    font-weight:700; color: var(--inkt-zacht);
  }
  .opnieuw{
    display:block; margin:22px auto 0; padding:10px 18px; border-radius:999px;
    background:none; border:1px solid var(--veldrand); cursor:pointer;
    font-weight:800; font-size:13px; color: var(--inkt-zacht);
  }

  /* ---------------------------------------------------------- overzicht --- */
  .weekstrip{ display:flex; border-radius:24px; padding:10px 6px; margin-top:16px; }
  .weekstrip button{
    flex:1; background:none; border:none; cursor:pointer; padding:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .wletter{ font-family: var(--baloo); font-weight:800; font-size:12px; color: var(--inkt-zacht); }
  .wdag{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--baloo); font-weight:800; font-size:17px;
  }
  .weekstrip button.aan .wdag{ background: var(--oranje); color:#fff; }
  .weekstrip button.vandaag:not(.aan) .wdag{ box-shadow: inset 0 0 0 2px rgba(242,153,74,.5); }

  /* De hoogte van een blokkop staat vast, zodat het kinderblok er op een breed
     scherm precies evenveel voor kan zakken en gelijk ligt met de kaart ernaast. */
  .blokkop{
    font-family: var(--baloo); font-weight:800; font-size:16px; line-height:22px;
    padding:0 var(--insprong) 9px; margin-top:22px;
  }
  .agendarij{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
    padding:12px var(--insprong); min-height:54px;
    background:none; border:none; font-family:inherit; color:inherit;
  }
  /* Iets bijzonders op één datum krijgt een eigen randje, zodat het opvalt
     tussen het vaste weekritme. */
  .agendarij.bijzonder{
    background: rgba(242,153,74,.13);
    box-shadow: inset 3px 0 0 var(--oranje);
  }
  body.nacht .agendarij.bijzonder{ background: rgba(242,153,74,.16); }
  button.agendarij{ cursor:pointer; }
  #formmelding{ margin:10px 2px 4px; }
  .verwijderknop{
    width:100%; margin-top:18px; padding:13px 0; border-radius:18px; cursor:pointer;
    border:1px solid rgba(229,72,77,.35); background: rgba(229,72,77,.10);
    font-family: var(--baloo); font-weight:800; font-size:14.5px; color:#E5484D;
  }
  input.veld.datum{ flex:1 1 150px; font-size:14px; font-family: var(--nunito); font-weight:800; }
  .agendaicoon{ font-size:24px; flex:none; width:30px; text-align:center; line-height:1.2; }
  .agendatekst{ flex:1; min-width:0; }
  .agendanaam{ font-family: var(--baloo); font-weight:700; font-size:15.5px; }
  .agendameta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:5px; }
  .agendatijd{ font-weight:800; font-size:12.5px; color: var(--inkt-zacht); }
  .merk{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 9px 3px 3px; border-radius:999px; color:#fff;
    font-family: var(--baloo); font-weight:800; font-size:12.5px;
  }
  .merk i{
    width:19px; height:19px; border-radius:50%; background: rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-style:normal;
  }

  /* ------------------------------------------------------- instellingen --- */
  .lijst{ border-radius:26px; overflow:hidden; margin-top:16px; }
  .lijstrij{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:14px; min-height:62px; background:none; border:none; cursor:pointer; text-align:left;
  }
  .lijstrij + .lijstrij{ border-top:1px solid var(--scheiding); }
  .lijstrij .tegel{ font-size:22px; }
  .lijsttekst{ flex:1; min-width:0; }
  .lijsttitel{ font-family: var(--baloo); font-weight:800; font-size:16px; }
  .lijstuitleg{ font-weight:700; font-size:12.5px; color: var(--inkt-zacht); margin-top:1px; }
  .pijl{ flex:none; color: var(--inkt-zacht); opacity:.6; }
  .gezichten{ display:flex; flex:none; }
  .gezichten span{
    width:34px; height:34px; border-radius:50%; margin-left:-8px;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.85);
  }
  body.nacht .gezichten span{ box-shadow: 0 0 0 2px rgba(24,26,58,.9); }
  .gezichten span:first-child{ margin-left:0; }
  .voetnoot{ text-align:center; font-weight:700; font-size:12px; color: var(--inkt-zacht); margin-top:20px; opacity:.75; }

  /* -------------------------------------------------------- zwevend menu --- */
  .tabbalk{
    position:fixed; left:14px; right:14px; bottom: calc(env(safe-area-inset-bottom) + 18px);
    max-width:492px; margin:0 auto;
    border-radius:34px; padding:5px; display:flex; gap:4px; z-index:40;
  }
  .tabbalk button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 0 6px; border-radius:20px; border:none; background:none; cursor:pointer;
    font-size:10.5px; font-weight:800; color: rgba(43,45,66,.52);
  }
  body.nacht .tabbalk button{ color: rgba(255,255,255,.55); }
  .tabbalk button.aan{
    background: rgba(242,153,74,.16); box-shadow: inset 0 0 0 1px rgba(242,153,74,.28);
    color: var(--oranje);
  }
  .tabbalk svg{ width:23px; height:23px; }

  /* ------------------------------------------------------------ bewerken --- */
  .scrim{ position:fixed; inset:0; background: rgba(22,15,6,.34); z-index:60; }
  /* De emojikiezer komt over het bewerkblad heen, dus zijn waas ook. */
  #kiesScrim{ z-index:70; }
  .scrim[hidden], .vel[hidden], .bodemblad[hidden]{ display:none; }
  .vel{
    position:fixed; inset:0; z-index:61; overflow-y:auto;
    padding: calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 30px);
    background:
      radial-gradient(1100px 640px at 10% -10%, #FFD7A0 0%, rgba(255,215,160,0) 60%),
      radial-gradient(820px 560px at 98% 4%, #FFC6E2 0%, rgba(255,198,226,0) 56%),
      radial-gradient(900px 760px at 62% 106%, #B7DEFF 0%, rgba(183,222,255,0) 58%),
      #FFF6E9;
  }
  body.nacht .vel{
    background:
      radial-gradient(880px 560px at 86% -8%, #45408F 0%, rgba(69,64,143,0) 58%),
      radial-gradient(760px 660px at 4% 26%, #1D4C7C 0%, rgba(29,76,124,0) 56%),
      radial-gradient(880px 680px at 48% 108%, #5A3272 0%, rgba(90,50,114,0) 60%),
      #10122F;
  }
  .velkop{
    position:sticky; top:0; z-index:2;
    max-width:496px; margin:0 auto 18px; border-radius:28px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 18px;
  }
  .velkop h2{ font-family: var(--baloo); font-weight:800; font-size:18px; margin:0; }
  .tekstknop{
    background:none; border:none; cursor:pointer; padding:4px 2px;
    font-weight:800; font-size:16px; color: var(--oranje);
  }
  .velinhoud{ max-width:520px; margin:0 auto; padding:0 22px; }
  .melding{
    max-width:496px; margin:0 auto 14px; padding:11px 14px; border-radius:16px;
    background: rgba(229,72,77,.14); border:1px solid rgba(229,72,77,.32);
    font-weight:700; font-size:13px; color:#B0272C;
  }
  body.nacht .melding{ color:#FFB3B5; }
  .melding[hidden]{ display:none; }

  .bewerkkaart{ border-radius:26px; overflow:hidden; margin-top:18px; }
  .groepregel{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--scheiding); }
  .bewerkrij{
    display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:58px;
    background: transparent; transition: background .2s ease;
  }
  /* De hele regel opent het formulier; alleen de knoppen aan de randen niet. */
  .rijknopvlak{
    flex:1; min-width:0; display:flex; align-items:center; gap:10px;
    background:none; border:none; padding:6px 2px; cursor:pointer; text-align:left;
    font-family: inherit; color: inherit;
  }
  .rijlabel{
    flex:1; min-width:0;
    font-family: var(--baloo); font-weight:700; font-size:15.5px; color: var(--inkt);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rijlabel.leeg{ color: var(--inkt-zacht); font-weight:600; }
  .rijmeta{ display:flex; align-items:center; gap:8px; flex:none; }
  .rijdagen{
    font-weight:800; font-size:11.5px; color: var(--inkt-zacht);
    white-space:nowrap; letter-spacing:.2px;
  }
  .rijwie{ display:flex; flex:none; }
  .rijwie span{
    width:24px; height:24px; border-radius:50%; margin-left:-7px;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.85);
  }
  body.nacht .rijwie span{ box-shadow: 0 0 0 2px rgba(24,26,58,.9); }
  .rijwie span:first-child{ margin-left:0; }
  .rijkleur{ width:16px; height:16px; border-radius:50%; flex:none; }
  .bewerkrij + .bewerkrij{ border-top:1px solid var(--scheiding); }
  .bewerkrij.sleept{ position:relative; z-index:3; box-shadow: 0 12px 26px rgba(0,0,0,.16); background: rgba(255,255,255,.7); }
  body.nacht .bewerkrij.sleept{ background: rgba(60,62,110,.9); }

  .minknop, .plusknop{
    width:28px; height:28px; border-radius:50%; flex:none; cursor:pointer;
    border:none; color:#fff; font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .minknop{ background: var(--rood); }
  .plusknop{ background:#34C759; }
  .emojiknop{
    width:42px; height:42px; border-radius:14px; flex:none; cursor:pointer;
    background: var(--tegel); border:1px solid var(--tegelrand);
    display:flex; align-items:center; justify-content:center; font-size:23px;
  }
  .greep{
    width:34px; height:38px; flex:none; cursor:grab; touch-action:none;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; color: var(--inkt-zacht); opacity:.5;
  }
  input.veld{
    flex:1 1 90px; min-width:0;
    font-family: var(--baloo); font-weight:700; font-size:16px; color: var(--inkt);
    padding:9px 12px; border-radius:13px;
    border:1px solid var(--veldrand); background: var(--veld);
  }
  input.veld::placeholder{ color: var(--inkt-zacht); opacity:.7; }
  input.veld.tijd{ flex:0 0 126px; padding:9px 6px; font-size:13px; text-align:center; font-family: var(--nunito); font-weight:800; }
  input.veld.getal{ flex:0 0 84px; text-align:center; }
  .toevoegrij{

<script>
'use strict';
// Ons dagritme — een enkele pagina, met de inhoud in een Firebase Realtime
// Database. routine.json is alleen het zaadje voor een lege database; daarna
// bewerk je alles in de app zelf, onder Instellingen.
const VERSIE = '__VERSIE__';                     // gestempeld door de workflow

const KLEUREN = ['#2FA37C','#7C6BD6','#D9724F','#3B82C4','#C2417E','#E0A33E'];
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const DAGNAMEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const WEEKDAGEN = ['ma','di','wo','do','vr','za','zo'];
const DAGLETTERS = { ma:'M', di:'D', wo:'W', do:'D', vr:'V', za:'Z', zo:'Z' };
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli',
                 'augustus','september','oktober','november','december'];

const EMOJI = {
  'Dagritme': ['🛏️','⏰','🌅','🪥','🚿','🛁','🧼','🧴','🪮','💇','🚽','🧻','👕','👖','🧦','👟','🧥','🧢','🎒','🚪','🚗','🚲','🛴','🌙','😴','📖','🤗','🧸','🎧','🪟'],
  'Eten': ['🍽️','🥣','🍞','🥐','🧀','🥚','🍎','🍌','🍓','🥕','🥪','🍕','🍝','🥗','🧃','🥛','🍪','🍫','🍇','🥦','🍚','🍲','🥞','🧁'],
  'Spelen': ['🧸','⚽','🏀','🎾','🏊','🚴','🤸','🎨','🖍️','🧩','🎲','🎮','🎹','🎸','🪁','🛝','🏐','🥋','⛸️','🏓','🎯','🪀','🤾','🩰'],
  'Huis': ['🧹','🧺','🪣','🧽','🛋️','🪴','🗑️','🍳','🧊','📦','🔑','💡','🧷','🪥','🔌','🧴'],
  'Dieren': ['🦄','🦖','🐶','🐱','🦊','🐼','🐸','🐙','🦋','🐝','🦉','🐢','🐳','🦁','🐰','🐥','🦔','🐧','🐨','🐷','🐮','🐒','🐴','🐬'],
  'Mensen': ['😀','😊','🥳','🤗','🧒','👦','👧','👶','👩','👨','👩🏻','👨🏻','🧑','👵','👴','🦸','🧚','🧜','🤖','👻','🧑‍🤝‍🧑','👨‍👩‍👧‍👦','🏋️','🧘'],
  'Dingen': ['⭐','❤️','📅','🏫','🏠','🎁','🎈','🎉','📷','🎵','☀️','🌈','❄️','🌸','🔔','⏳','📌','✅','🏆','💧','🔥','🌟','🚌','✏️'],
};

const STANDAARD = {
  titel: 'Ons dagritme',
  avondVanaf: 15,
  mensen: [
    { id:'emma', naam:'Emma', emoji:'🦄', kleur:'#2FA37C' },
    { id:'mads', naam:'Mads', emoji:'🦖', kleur:'#7C6BD6' },
  ],
  dag: [
    { groep:'Boven', tijd:'6:00 – 6:30', stappen:[
      { icoon:'🛏️', label:'Wakker worden' },
      { icoon:'🪥', label:'Tanden poetsen' },
      { icoon:'👕', label:'Aankleden' },
    ]},
    { groep:'Beneden', tijd:'6:30 – 7:30', stappen:[
      { icoon:'💇', label:'Haren kammen' },
      { icoon:'🥣', label:'Ontbijt' },
      { icoon:'🧸', label:'Spelen' },
    ]},
    { groep:'Weggaan', tijd:'8:00 – 8:15', stappen:[
      { icoon:'🎒', label:'Tas & jas' },
      { icoon:'⚽', label:'Voetbaltas', dagen:['wo'] },
      { icoon:'👟', label:'Schoenen aan' },
      { icoon:'🐈', label:'Kat knuffelen' },
      { icoon:'🚪', label:'Naar school!' },
    ]},
  ],
  nacht: [
    { groep:'Beneden', tijd:'18:00 – 18:45', stappen:[
      { icoon:'🍽️', label:'Avondeten' },
      { icoon:'🧸', label:'Even spelen' },
    ]},
    { groep:'Boven', tijd:'18:45 – 19:15', stappen:[
      { icoon:'🛁', label:'Bad' },
      { icoon:'👕', label:'Pyjama aan' },
      { icoon:'🪥', label:'Tanden poetsen' },
      { icoon:'🚽', label:'Plassen' },
    ]},
    { groep:'Naar bed', tijd:'19:15 – 19:30', stappen:[
      { icoon:'📖', label:'Voorlezen' },
      { icoon:'🤗', label:'Knuffel' },
      { icoon:'🌙', label:'Licht uit' },
    ]},
  ],
  overzicht: [],
  events: [],
};

// Firebase levert een lijst soms terug als object met nummers als sleutel; hier
// wordt allebei op dezelfde manier gelezen.
function lijstVan(waarde){
  if(Array.isArray(waarde)) return waarde.filter(x => x != null);
  if(waarde && typeof waarde === 'object'){
    return Object.keys(waarde).sort((a, b) => Number(a) - Number(b))
      .map(k => waarde[k]).filter(x => x != null);
  }
  return [];
}

function tekst(waarde, terugval = ''){
  const s = typeof waarde === 'string' ? waarde.trim() : '';
  return s || terugval;
}

function uurOf(waarde, terugval){
  const n = Number(waarde);
  return Number.isFinite(n) && n >= 0 && n <= 23 ? Math.floor(n) : terugval;
}

// De sleutel waaronder een vinkje in de database staat. Hangt aan de tekst van
// de stap, niet aan het volgnummer, zodat er een stap tussen kan zonder dat de
// vinkjes verschuiven.
function stapSleutel(step){
  return String((step && step.label) || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'stap';
}

function nieuwId(){ return 'p' + Math.random().toString(36).slice(2, 8); }

function dagenVan(waarde){
  return lijstVan(waarde).map(d => String(d).trim().slice(0, 2).toLowerCase())
    .filter(d => DAGEN.includes(d));
}

// 'wie' is de lijst kinderen waar iets voor geldt. Leeg betekent: iedereen.
// Oudere gegevens gebruikten één 'persoon'; die wordt hier meegelezen.
function wieVan(item){
  const uit = lijstVan(item && item.wie).map(x => String(x));
  const enkel = tekst(item && item.persoon);
  if(!uit.length && enkel) uit.push(enkel);
  return uit;
}

function maakGroepen(waarde){
  const lijst = lijstVan(waarde);
  if(!lijst.length) return [];
  const gegroepeerd = lijst.some(item => item && (item.stappen !== undefined || item.groep !== undefined));
  const rauw = gegroepeerd ? lijst : [{ groep:'', tijd:'', stappen: lijst }];
  return rauw.map(item => ({
    groep: tekst(item && item.groep),
    tijd: tekst(item && item.tijd),
    stappen: lijstVan(item && item.stappen).map(s => ({
      icoon: tekst(s && s.icoon, '⭐'),
      label: tekst(s && s.label),
      dagen: dagenVan(s && s.dagen),
      wie: wieVan(s),
    })),
  }));
}

function aantalStappen(groepen){
  return groepen.reduce((n, g) => n + g.stappen.length, 0);
}

function routine(waarde, terugval){
  const groepen = maakGroepen(waarde);
  return aantalStappen(groepen) ? groepen : maakGroepen(terugval);
}

function overzichtItem(ruw){
  return {
    icoon: tekst(ruw && ruw.icoon, '📅'),
    tekst: tekst(ruw && ruw.tekst),
    tijd: tekst(ruw && ruw.tijd),
    dagen: dagenVan(ruw && ruw.dagen),
    wie: wieVan(ruw),
    avond: Boolean(ruw && ruw.avond),
  };
}

// Het overzicht was eerst per dag ingevuld, waardoor school vijf keer in de
// database stond. Het is nu één lijst waarin elk item zelf zijn dagen kent;
// een oude, per dag ingevulde tak wordt hier samengevoegd.
function overzichtLijst(waarde){
  if(Array.isArray(waarde) || !waarde || typeof waarde !== 'object'){
    return lijstVan(waarde).map(overzichtItem).filter(i => i.tekst);
  }
  const sleutels = Object.keys(waarde);
  const perDag = sleutels.length && sleutels.every(k => DAGEN.includes(String(k).trim().slice(0, 2).toLowerCase()));
  if(!perDag) return lijstVan(waarde).map(overzichtItem).filter(i => i.tekst);

  const uit = [];
  const gezien = new Map();
  DAGEN.forEach(() => {});
  WEEKDAGEN.forEach(dag => {
    lijstVan(waarde[dag]).forEach(ruw => {
      const item = overzichtItem(ruw);
      if(!item.tekst) return;
      const sleutel = [item.icoon, item.tekst, item.tijd, item.wie.join('+'), item.avond].join('|');
      if(gezien.has(sleutel)){
        gezien.get(sleutel).dagen.push(dag);
        return;
      }
      item.dagen = [dag];
      gezien.set(sleutel, item);
      uit.push(item);
    });
  });
  // Staat iets op alle zeven dagen, dan is 'elke dag' hetzelfde en korter.
  uit.forEach(item => { if(item.dagen.length === 7) item.dagen = []; });
  return uit;
}

// Een bijzonderheid staat op één datum in plaats van op weekdagen: een
// verjaardag, een uitje, een dokter.
function eventItem(ruw){
  return {
    id: tekst(ruw && ruw.id) || nieuwId(),
    icoon: tekst(ruw && ruw.icoon, '🎉'),
    tekst: tekst(ruw && ruw.tekst),
    tijd: tekst(ruw && ruw.tijd),
    datum: /^\d{4}-\d{2}-\d{2}$/.test(tekst(ruw && ruw.datum)) ? tekst(ruw.datum) : '',
    wie: wieVan(ruw),
  };
}

function eventLijst(waarde){
  return lijstVan(waarde).map(eventItem).filter(e => e.tekst && e.datum)
    .sort((a, b) => a.datum.localeCompare(b.datum) || a.tijd.localeCompare(b.tijd));
}

function normaliseer(ruw){
  const bron = ruw || {};
  const mensen = lijstVan(bron.mensen).map((p, i) => ({
    id: tekst(p && p.id, 'p' + i),
    naam: tekst(p && p.naam, 'Naamloos'),
    emoji: tekst(p && p.emoji, '🙂'),
    kleur: tekst(p && p.kleur, KLEUREN[i % KLEUREN.length]),
  }));
  const uit = {
    titel: tekst(bron.titel, STANDAARD.titel),
    avondVanaf: uurOf(bron.avondVanaf, STANDAARD.avondVanaf),
    mensen: mensen.length ? mensen : STANDAARD.mensen.map(p => ({ ...p })),
    dag: routine(bron.dag, STANDAARD.dag),
    nacht: routine(bron.nacht, STANDAARD.nacht),
    overzicht: overzichtLijst(bron.overzicht),
    events: eventLijst(bron.events),
  };
  // Een verwijzing naar een kind dat er niet meer is telt niet mee; blijft er
  // niemand over, dan geldt het weer voor iedereen.
  const bestaat = new Set(uit.mensen.map(p => p.id));
  const schoon = w => w.filter(id => bestaat.has(id));
  ['dag','nacht'].forEach(r => uit[r].forEach(g => g.stappen.forEach(s => { s.wie = schoon(s.wie); })));
  uit.overzicht.forEach(i => { i.wie = schoon(i.wie); });
  uit.events.forEach(i => { i.wie = schoon(i.wie); });
  return uit;
}

let config = normaliseer(STANDAARD);

let gekozenDag = null;          // gekozen datum op de weekpagina; null = vandaag
// done[ritme] is een kaart van stapsleutel naar de verzameling mensen die klaar zijn.
let done = { dag: new Map(), nacht: new Map() };

const paginadatumEl = $('paginadatum');

const voetnootEl = $('voetnoot');

const meldingEl = $('melding');

function persoonById(id){ return config.mensen.find(p => p.id === id) || null; }

// Voor wie geldt deze stap? Leeg betekent iedereen.
function wieDoetMee(item){
  const gekozen = lijstVan(item && item.wie).map(id => persoonById(id)).filter(Boolean);
  return gekozen.length ? gekozen : config.mensen;
}

function heeftVink(r, stap, persoon){
  const set = done[r].get(stap);
  return Boolean(set && set.has(persoon));
}
function zetVink(r, stap, persoon, aan){
  const kaart = done[r];
  if(!kaart.has(stap)) kaart.set(stap, new Set());
  const set = kaart.get(stap);
  if(aan) set.add(persoon); else set.delete(persoon);
  if(!set.size) kaart.delete(stap);
}

function datumTekst(d){
  return `${DAGNAMEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]}`;
}

// ---------------------------------------------------------------- opslag ---
// Twee takken onder <gezin>: 'config' is de inhoud die je in de app bewerkt, en
// per datum staat wie welke stap heeft afgevinkt. Een eigen tak per dag betekent
// dat het ritme 's ochtends vanzelf leeg begint.
const opslag = { basis:'', datum:'', datumStroom:null, configStroom:null };

function datumVan(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function vandaag(){ return datumVan(new Date()); }

function padConfig(){ return `${opslag.basis}/config.json`; }
function padVink(r, stap, persoon){
  const delen = [opslag.basis, opslag.datum];
  if(r) delen.push(r);
  if(stap) delen.push(stap);
  if(persoon) delen.push(persoon);
  return delen.join('/') + '.json';
}

function alsPlat(){
  const uit = { datum: opslag.datum, dag:{}, nacht:{} };
  ['dag','nacht'].forEach(r => done[r].forEach((set, stap) => { uit[r][stap] = [...set]; }));
  return uit;
}

function bewaarLokaal(){
  try{ localStorage.setItem('dagritme-vinkjes', JSON.stringify(alsPlat())); }
  catch(err){ /* privémodus of vol: dan alleen deze sessie */ }
}

function laadLokaal(){
  try{
    const r = JSON.parse(localStorage.getItem('dagritme-vinkjes') || 'null');
    if(!r || r.datum !== opslag.datum) return;
    ['dag','nacht'].forEach(naam => {
      const kaart = new Map();
      Object.entries(r[naam] || {}).forEach(([stap, personen]) => {
        const set = new Set(lijstVan(personen));
        if(set.size) kaart.set(stap, set);
      });
      done[naam] = kaart;
    });
  }catch(err){ /* onleesbaar: begin leeg */ }
}

function bewaarLokaalConfig(ruw){
  try{ localStorage.setItem('dagritme-config', JSON.stringify(ruw)); }catch(err){}
}
function laadLokaalConfig(){
  try{ return JSON.parse(localStorage.getItem('dagritme-config') || 'null'); }
  catch(err){ return null; }
}

async function schrijfVink(r, stap, persoon, aan){
  bewaarLokaal();
  if(!opslag.basis) return;
  try{
    await fetch(padVink(r, stap, persoon), aan
      ? { method:'PUT', body:'true' }
      : { method:'DELETE' });
  }catch(err){ console.warn('opslaan mislukt:', err); }
}

async function wisRitme(r){
  bewaarLokaal();
  if(!opslag.basis) return;
  try{ await fetch(padVink(r), { method:'DELETE' }); }
  catch(err){ console.warn('wissen mislukt:', err); }
}

async function bewaarConfigOpAfstand(ruw){
  const res = await fetch(padConfig(), { method:'PUT', body: JSON.stringify(ruw) });
  if(!res.ok) throw new Error('HTTP ' + res.status);
}

function vulRitme(r, obj){
  const kaart = new Map();
  Object.entries(obj || {}).forEach(([stap, personen]) => {
    const set = new Set(Object.keys(personen || {}).filter(p => personen[p]));
    if(set.size) kaart.set(stap, set);
  });
  done[r] = kaart;
}

// Firebase stuurt bij het openen de hele tak, en daarna per wijziging het pad
// dat veranderd is. Alle vier de dieptes komen hier binnen.
function verwerkDatum(padTekst, data){
  const delen = String(padTekst || '/').split('/').filter(Boolean);
  if(delen.length === 0){
    ['dag','nacht'].forEach(r => vulRitme(r, (data || {})[r]));
  }else if(delen.length === 1){
    if(done[delen[0]]) vulRitme(delen[0], data);
  }else if(delen.length === 2){
    const [r, stap] = delen;
    if(!done[r]) return;
    const set = new Set(Object.keys(data || {}).filter(p => data[p]));
    if(set.size) done[r].set(stap, set); else done[r].delete(stap);
  }else{
    const [r, stap, persoon] = delen;
    if(!done[r]) return;
    zetVink(r, stap, persoon, Boolean(data));
  }
  bewaarLokaal();
  render();
}

function pasConfigToe(ruw){
  if(!ruw) return false;
  config = normaliseer(ruw);
  bewaarLokaalConfig(ruw);
  toepassen();
  return true;
}

function luister(url, opPut, opPatch){
  if(!opslag.basis || typeof EventSource === 'undefined') return null;
  try{
    const bron = new EventSource(url);
    const lees = handler => e => {
      try{
        const bericht = JSON.parse(e.data);
        if(bericht && bericht.path !== undefined) handler(bericht.path, bericht.data);
      }catch(err){ /* keep-alive-regels bevatten geen json */ }
    };
    bron.addEventListener('put', lees(opPut));
    if(opPatch) bron.addEventListener('patch', lees(opPatch));
    bron.onerror = () => console.warn('verbinding met de opslag hapert');
    return bron;
  }catch(err){ console.warn('luisteren mislukt:', err); return null; }
}

function luisterDatum(){
  if(opslag.datumStroom) opslag.datumStroom.close();
  opslag.datumStroom = luister(padVink(), verwerkDatum, (pad, data) => {
    Object.entries(data || {}).forEach(([k, v]) =>
      verwerkDatum((pad === '/' ? '' : pad) + '/' + k, v));
  });
}

function luisterConfig(){
  if(opslag.configStroom) opslag.configStroom.close();
  opslag.configStroom = luister(padConfig(), (pad, data) => {
    // Alleen de hele tak is meteen bruikbaar; bij een deelwijziging even
    // helemaal ophalen — bewerken gebeurt zelden genoeg.
    if(pad === '/') pasConfigToe(data);
    else haalConfig().then(ruw => { if(ruw) pasConfigToe(ruw); });
  });
}

async function haalConfig(){
  if(!opslag.basis) return null;
  try{
    const res = await fetch(padConfig(), { cache:'no-store' });
    if(!res.ok) return null;
    return await res.json();
  }catch(err){ return null; }
}

// Oude dagen blijven anders voor altijd staan. Alles ouder dan een week weg —
// 'config' valt buiten dat patroon en blijft dus staan.
async function ruimOp(){
  if(!opslag.basis) return;
  try{
    const grens = new Date();
    grens.setDate(grens.getDate() - 7);
    const oudste = datumVan(grens);
    const res = await fetch(`${opslag.basis}.json?shallow=true`);
    if(!res.ok) return;
    Object.keys(await res.json() || {})
      .filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d) && d < oudste)
      .forEach(d => fetch(`${opslag.basis}/${d}.json`, { method:'DELETE' }).catch(() => {}));
  }catch(err){ /* opruimen is nooit belangrijk genoeg om iets te laten mislukken */ }
}

function bewaakDatum(){
  setInterval(() => {
    if(vandaag() === opslag.datum) return;
    opslag.datum = vandaag();
    done = { dag: new Map(), nacht: new Map() };
    bewaarLokaal();
    toepassen();
    luisterDatum();
    ruimOp();
  }, 30000);
}

async function startOpslag(){
  opslag.datum = vandaag();
  const url = tekst(instelling && instelling.url).replace(/\/+$/, '');
  const gezin = tekst(instelling && instelling.gezin, 'gezin');
  if(url) opslag.basis = `${url}/${encodeURIComponent(gezin)}`;

  laadLokaal();
  render();
  if(!opslag.basis) return;

  const ruw = await haalConfig();
  if(ruw) pasConfigToe(ruw);
  else {
    // Nog niets in de database: het huidige ritme wordt het zaadje.
    try{ await bewaarConfigOpAfstand(opgeschoond(alsRuweConfig())); }
    catch(err){ console.warn('kon de inhoud niet in de database zetten:', err); }
  }
  luisterConfig();
  luisterDatum();
  ruimOp();
  bewaakDatum();
}

function alsRuweConfig(){
  return JSON.parse(JSON.stringify({
    titel: config.titel,
    avondVanaf: config.avondVanaf,
    mensen: config.mensen,
    dag: config.dag,
    nacht: config.nacht,
    overzicht: config.overzicht,
    events: config.events,
  }));
}

// Een kleur als 'rgba(r,g,b,a)' — voor de zachte vulling achter een gezicht.
function zacht(hex, alpha){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return `rgba(43,45,66,${alpha})`;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

// ---------------------------------------------------------------- ritme ----
function opDeze(item, d){
  if(!item.dagen || !item.dagen.length) return true;
  return item.dagen.includes(DAGEN[d.getDay()]);
}

function zichtbareGroepen(){
  const nu = new Date();
  return config[ritme]
    .map(g => ({ groep:g.groep, tijd:g.tijd, stappen: g.stappen.filter(s => s.label && opDeze(s, nu)) }))
    .filter(g => g.stappen.length);
}

function maakRondje(stap, persoon){
  const sleutel = stapSleutel(stap);
  const b = knop('rondje');
  b.setAttribute('aria-label', `${stap.label} — ${persoon.naam}`);
  const aan = heeftVink(ritme, sleutel, persoon.id);
  b.setAttribute('aria-pressed', aan ? 'true' : 'false');

  const ring = el('div', 'ring');
  const gezicht = el('div', 'gezicht', persoon.emoji);
  gezicht.style.background = zacht(persoon.kleur, .16);
  ring.appendChild(gezicht);

  const vink = el('div', 'vink');
  vink.appendChild(svgVink());

  b.append(ring, vink);
  b.addEventListener('click', () => {
    const nieuw = b.getAttribute('aria-pressed') !== 'true';
    zetVink(ritme, sleutel, persoon.id, nieuw);
    render();
    schrijfVink(ritme, sleutel, persoon.id, nieuw);
  });
  return b;
}

function tekenVoortgang(groepen){
  voortgangEl.innerHTML = '';
  const stappen = groepen.flatMap(g => g.stappen);
  if(!stappen.length || !config.mensen.length){ voortgangEl.hidden = true; return; }
  voortgangEl.hidden = false;

  config.mensen.forEach(persoon => {
    const van = stappen.filter(s => wieDoetMee(s).some(p => p.id === persoon.id));
    const klaar = van.filter(s => heeftVink(ritme, stapSleutel(s), persoon.id)).length;

    const vak = el('div', 'vperson');
    const bol = el('div', 'vbol', persoon.emoji);
    bol.style.background = zacht(persoon.kleur, .16);

    const tekstvak = el('div', 'vtekst');
    const regel = el('div', 'vregel');
    regel.append(el('span', 'vnaam', persoon.naam),
                 el('span', 'vtelling', `${klaar}/${van.length}`));
    const balk = el('div', 'vbalk');
    const vul = el('span');
    vul.style.width = van.length ? Math.round(klaar / van.length * 100) + '%' : '0%';
    vul.style.background = persoon.kleur;
    balk.appendChild(vul);
    tekstvak.append(regel, balk);

    vak.append(bol, tekstvak);
    voortgangEl.appendChild(vak);
  });
}

function tekenRitme(){
  const groepen = zichtbareGroepen();
  tekenVoortgang(groepen);
  groepenEl.innerHTML = '';

  if(!groepen.length){
    const leeg = el('div', 'leegkaart glas', 'Nog geen stappen. Voeg ze toe bij Instellingen.');
    groepenEl.appendChild(leeg);
    return;
  }

  groepen.forEach(groep => {
    if(groep.groep || groep.tijd){
      const kop = el('div', 'groepkop');
      kop.append(el('div', 'groepnaam', groep.groep), el('div', 'groeptijd', groep.tijd));
      groepenEl.appendChild(kop);
    }
    const raster = el('div', 'kaartraster');
    groep.stappen.forEach(stap => {
      const kaart = el('div', 'taakkaart glas');
      kaart.append(el('div', 'tegel', stap.icoon), el('div', 'taaknaam', stap.label));
      const rondjes = el('div', 'rondjes');
      wieDoetMee(stap).forEach(p => rondjes.appendChild(maakRondje(stap, p)));
      kaart.appendChild(rondjes);
      raster.appendChild(kaart);
    });
    groepenEl.appendChild(raster);
  });
  tekenRitmeAgenda();
}

// Naast de stappen (of eronder op een telefoon) staat wat er die dag verder is:
// 's ochtends vandaag, 's avonds wat er vanavond nog komt en wat morgen wacht.
function ritmeBlokken(){
  const nu = new Date();
  const van = d => itemsVan(d).filter(i => !i.avond);
  if(ritme !== 'nacht'){
    return [{ kop:'Vandaag', items: van(nu) }];
  }
  const morgen = new Date(nu);
  morgen.setDate(morgen.getDate() + 1);
  return [
    { kop:'Vanavond', items: itemsVan(nu).filter(i => i.avond) },
    { kop:'Morgen', items: van(morgen), later:true },
  ];
}

function tekenRitmeAgenda(){
  const blokken = ritmeBlokken().filter(b => b.items.length);
  ritmeagendaEl.innerHTML = '';
  blokken.forEach(b => ritmeagendaEl.appendChild(maakAgendaBlok(b)));
  ritmelijfEl.classList.toggle('met-zij', blokken.length > 0);
}

// ------------------------------------------------------------- overzicht ---
function weekVan(d){
  const begin = new Date(d);
  const verschuiving = (begin.getDay() + 6) % 7;      // maandag als eerste dag
  begin.setDate(begin.getDate() - verschuiving);
  begin.setHours(0, 0, 0, 0);
  return Array.from({ length: 7 }, (_, i) => {
    const dag = new Date(begin);
    dag.setDate(begin.getDate() + i);
    return dag;
  });
}

function overzichtDatum(){
  const nu = new Date();
  if(!gekozenDag) return nu;
  const gevonden = weekVan(nu).find(d => datumVan(d) === gekozenDag);
  return gevonden || nu;
}

function tekenWeekstrip(){
  const nu = new Date();
  const gekozen = overzichtDatum();
  weekstripEl.innerHTML = '';
  weekVan(nu).forEach(d => {
    const sleutel = DAGEN[d.getDay()];
    const b = knop('');
    if(datumVan(d) === datumVan(nu)) b.classList.add('vandaag');
    if(datumVan(d) === datumVan(gekozen)) b.classList.add('aan');
    b.append(el('span', 'wletter', DAGLETTERS[sleutel]),
             el('span', 'wdag', String(d.getDate())));
    b.setAttribute('aria-label', datumTekst(d));
    b.addEventListener('click', () => { gekozenDag = datumVan(d); toepassen(); });
    weekstripEl.appendChild(b);
  });
}

function itemsVan(d){
  const dag = DAGEN[d.getDay()];
  const datum = datumVan(d);
  // Wat er die dag bijzonder is staat bovenaan; daaronder het vaste weekritme.
  const bijzonder = lijstVan(config.events).filter(e => e.datum === datum)
    .map(e => ({ ...e, dagen:[], avond:false, bijzonder:true }));
  const week = lijstVan(config.overzicht).filter(i => !i.dagen.length || i.dagen.includes(dag));
  return bijzonder.concat(week);
}

function agendaBlokken(){
  const nu = new Date();
  const gekozen = overzichtDatum();
  const isVandaag = datumVan(gekozen) === datumVan(nu);
  const blokken = [
    { kop:'Overdag', items: itemsVan(gekozen).filter(i => !i.avond) },
    { kop: isVandaag ? 'Vanavond' : "'s Avonds", items: itemsVan(gekozen).filter(i => i.avond) },
  ];
  if(isVandaag){
    const morgen = new Date(nu);
    morgen.setDate(morgen.getDate() + 1);
    blokken.push({ kop:'Morgen', items: itemsVan(morgen).filter(i => !i.avond) });
  }
  return blokken.filter(b => b.items.length);
}

function maakAgendaRij(item, opOpenen){
  const rij = opOpenen ? knop('agendarij') : el('div', 'agendarij');
  if(item.bijzonder) rij.classList.add('bijzonder');
  if(opOpenen) rij.addEventListener('click', () => opOpenen(item));
  const tekstvak = el('div', 'agendatekst');
  tekstvak.appendChild(el('div', 'agendanaam', item.tekst));

  const meta = el('div', 'agendameta');
  const gekozen = lijstVan(item.wie).map(id => persoonById(id)).filter(Boolean);
  if(gekozen.length && gekozen.length < config.mensen.length){
    gekozen.forEach(p => {
      const merk = el('span', 'merk');
      merk.style.background = p.kleur;
      merk.append(el('i', '', p.emoji), document.createTextNode(p.naam));
      meta.appendChild(merk);
    });

  if(item.tijd) meta.appendChild(el('div', 'agendatijd', item.tijd));

// ------------------------------------------------------------- verslepen ---
// De greep verplaatst een regel binnen zijn eigen kaart. Tijdens het slepen
// schuiven de andere regels mee, zodat je ziet waar hij terechtkomt.
function maakSleepbaar(vak, lijst, klaar){
  vak.querySelectorAll('.greep').forEach(greep => {
    greep.addEventListener('pointerdown', e => {
      const rij = greep.closest('.bewerkrij');
      const rijen = [...vak.querySelectorAll('.bewerkrij')];
      const van = rijen.indexOf(rij);
      if(van < 0) return;
      e.preventDefault();
      const hoogtes = rijen.map(r => r.offsetHeight);
      const startY = e.clientY;
      let naar = van;
      rij.classList.add('sleept');

      const beweeg = ev => {
        const dy = ev.clientY - startY;
        rij.style.transform = `translateY(${dy}px)`;
        let n = van;
        if(dy > 0){
          let op = 0;
          for(let i = van + 1; i < rijen.length; i++){
            op += hoogtes[i];
            if(dy > op - hoogtes[i] / 2) n = i;
          }
        }else{
          let op = 0;
          for(let i = van - 1; i >= 0; i--){
            op += hoogtes[i];
            if(-dy > op - hoogtes[i] / 2) n = i;
          }
        }
        if(n === naar) return;
        naar = n;
        rijen.forEach((r, i) => {
          if(i === van) return;
          let ver = 0;
          if(naar > van && i > van && i <= naar) ver = -hoogtes[van];
          if(naar < van && i >= naar && i < van) ver = hoogtes[van];
          r.style.transform = ver ? `translateY(${ver}px)` : '';
        });
      };
      const stop = () => {
        document.removeEventListener('pointermove', beweeg);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        rijen.forEach(r => { r.style.transform = ''; r.classList.remove('sleept'); });
        if(naar !== van) lijst.splice(naar, 0, lijst.splice(van, 1)[0]);
        klaar();
      };
      document.addEventListener('pointermove', beweeg);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
    });
  });
}

// Een bijzonderheid hoort bij één dag en wordt vanaf de weekpagina bewerkt, dus
// buiten het bewerkscherm om: hier gaat de hele inhoud in één keer weg.
function bewerkEvent(item){
  const gegevens = item
    ? { id:item.id, icoon:item.icoon, tekst:item.tekst, tijd:item.tijd,
        datum:item.datum, wie:lijstVan(item.wie) }
    : { id:'', icoon:'🎉', tekst:'', tijd:'', datum: datumVan(overzichtDatum()), wie:[] };
  openFormulier(item ? (item.tekst || 'Iets bijzonders') : 'Iets bijzonders', gegevens,
    g => eventFormulier(g, item ? () => verwijderEvent(item.id) : null),
    g => bewaarEvent(g));
}

async function bewaarEvent(g){
  if(!tekst(g.tekst) || !/^\d{4}-\d{2}-\d{2}$/.test(tekst(g.datum))){
    toonFormMelding('Vul een naam en een datum in.');
    return false;
  }
  const ruw = alsRuweConfig();
  const rij = {
    id: tekst(g.id) || nieuwId(),
    icoon: tekst(g.icoon, '🎉'),
    tekst: tekst(g.tekst),
    tijd: tekst(g.tijd),
    datum: tekst(g.datum),
    wie: lijstVan(g.wie),
  };
  const lijst = lijstVan(ruw.events);
  const i = lijst.findIndex(e => e.id === rij.id);
  if(i >= 0) lijst[i] = rij; else lijst.push(rij);
  ruw.events = lijst;
  return await bewaarInhoud(ruw);
}

async function verwijderEvent(id){
  const ruw = alsRuweConfig();
  ruw.events = lijstVan(ruw.events).filter(e => e.id !== id);
  if(await bewaarInhoud(ruw) !== false) sluitFormulier(false);
}

async function bewaarInhoud(ruw){
  const nieuw = opgeschoond(ruw);
  if(opslag.basis){
    try{
      await bewaarConfigOpAfstand(nieuw);
    }catch(err){
      toonFormMelding('Opslaan in de database lukte niet (' + err.message + ').');
      return false;
    }
  }
  config = normaliseer(nieuw);
  bewaarLokaalConfig(nieuw);
  toepassen();
  return true;
}

function dagenTekst(dagen){
  const d = lijstVan(dagen);
  if(!d.length || d.length >= WEEKDAGEN.length) return '';
  return WEEKDAGEN.filter(x => d.includes(x)).join(', ');
}

function wieVoorRij(wie){
  const mensen = bewerkMensen();
  const gekozen = lijstVan(wie).map(id => mensen.find(p => p.id === id)).filter(Boolean);
  return gekozen.length && gekozen.length < mensen.length ? gekozen : [];
}

  segment.style.marginTop = '0';
  [['dag','Ochtend'], ['nacht','Avond']].forEach(([waarde, label]) => {
    const b = knop(waarde === soort ? 'aan' : '', label);
    b.addEventListener('click', () => { velSoort = waarde; tekenVel(); });
    segment.appendChild(b);
  });
  stuk.appendChild(segment);

  concept[soort].forEach((groep, gi) => {
    const kaart = el('div', 'bewerkkaart glas');
    const regel = el('div', 'groepregel');
    regel.append(
      minKnop('Groep verwijderen', () => { concept[soort].splice(gi, 1); tekenVel(); }),
      veld(groep.groep, 'Groep', '', v => { groep.groep = v; }),
      veld(groep.tijd, 'tijd', 'tijd', v => { groep.tijd = v; }),
    );
    kaart.appendChild(regel);

    const rijenvak = el('div');
    groep.stappen.forEach((stap, si) => {
      rijenvak.appendChild(maakBewerkRij({
        icoon: stap.icoon,
        label: stap.label,
        leeg: 'Naamloze stap',
        dagen: stap.dagen,
        wie: stap.wie,
        wegTitel: 'Stap verwijderen',
        opWeg: () => { groep.stappen.splice(si, 1); tekenVel(); },
        opOpenen: () => openFormulier('Stap', stap, taakFormulier, nieuw => {
          groep.stappen[si] = {
            icoon: tekst(nieuw.icoon, '⭐'),
            label: nieuw.label,
            dagen: dagenVan(nieuw.dagen),
            wie: lijstVan(nieuw.wie),
          };
          tekenVel();
        }),
      }));
    });
    kaart.appendChild(rijenvak);
    maakSleepbaar(rijenvak, groep.stappen, tekenVel);

    kaart.appendChild(toevoegRij('Stap toevoegen', () => {
      const stap = { icoon:'⭐', label:'', dagen:[], wie:[] };
      openFormulier('Nieuwe stap', stap, taakFormulier, nieuw => {
        if(!tekst(nieuw.label)) return;
        groep.stappen.push({
          icoon: tekst(nieuw.icoon, '⭐'),
          label: nieuw.label,
          dagen: dagenVan(nieuw.dagen),
          wie: lijstVan(nieuw.wie),
        });
        tekenVel();
      });
    }));
    stuk.appendChild(kaart);
  });

  const erbij = knop('kaartknop glas');
  erbij.append(el('span', 'plusknop', '+'), document.createTextNode('Groep toevoegen'));
  erbij.addEventListener('click', () => {
    concept[soort].push({ groep:'Nieuwe groep', tijd:'', stappen:[] });
    tekenVel();
  });
  stuk.appendChild(erbij);
  return stuk;
}

function velKinderen(){
  const stuk = document.createDocumentFragment();
  const kaart = el('div', 'bewerkkaart glas');
  const rijenvak = el('div');

  concept.mensen.forEach((persoon, i) => {
    rijenvak.appendChild(maakBewerkRij({
      icoon: persoon.emoji,
      label: persoon.naam,
      leeg: 'Naamloos',
      kleur: persoon.kleur,
      wegTitel: 'Kind verwijderen',
      opWeg: () => {
        if(concept.mensen.length <= 1) return toonMelding('Er moet minstens één kind overblijven.');
        // Anders wijst een stap naar iemand die er niet meer is.
        losmaken(persoon.id);
        concept.mensen.splice(i, 1);
        toonMelding('');
        tekenVel();
      },
      opOpenen: () => openFormulier(persoon.naam || 'Kind', persoon, kindFormulier, nieuw => {
        Object.assign(persoon, {
          naam: nieuw.naam, emoji: tekst(nieuw.emoji, '🙂'),
          kleur: tekst(nieuw.kleur, persoon.kleur),
        });
        tekenVel();
      }),
    }));
  });

  kaart.appendChild(rijenvak);
  maakSleepbaar(rijenvak, concept.mensen, tekenVel);
  kaart.appendChild(toevoegRij('Kind toevoegen', () => {
    const kind = {
      id: nieuwId(), naam:'', emoji:'🙂',
      kleur: KLEUREN[concept.mensen.length % KLEUREN.length],
    };
    openFormulier('Nieuw kind', kind, kindFormulier, nieuw => {
      if(!tekst(nieuw.naam)) return;
      concept.mensen.push({ ...kind, naam: nieuw.naam, emoji: nieuw.emoji, kleur: nieuw.kleur });
      tekenVel();
    });
  }));
  stuk.appendChild(kaart);

  stuk.appendChild(el('div', 'notitie',
    'Iedereen hier krijgt een eigen rondje bij elke stap. Namen wijzigen mag: '
    + 'de vinkjes blijven bij de juiste persoon.'));
  return stuk;
}

function losmaken(id){
  ['dag','nacht'].forEach(r => lijstVan(concept[r]).forEach(g =>
    lijstVan(g.stappen).forEach(s => { s.wie = lijstVan(s.wie).filter(x => x !== id); })));
  [concept.overzicht, concept.events].forEach(lijst => lijstVan(lijst).forEach(item => {
    item.wie = lijstVan(item.wie).filter(x => x !== id);
  }));
}

function velOverzicht(){
  const stuk = document.createDocumentFragment();
  const items = concept.overzicht = lijstVan(concept.overzicht);

  const kaart = el('div', 'bewerkkaart glas');
  const rijenvak = el('div');
  items.forEach((item, i) => {
    rijenvak.appendChild(maakBewerkRij({
      icoon: item.icoon,
      label: item.tekst,
      leeg: 'Naamloos',
      tijd: (item.avond ? '🌙 ' : '') + tekst(item.tijd),
      dagen: item.dagen,
      wie: item.wie,
      wegTitel: 'Verwijderen',
      opWeg: () => { items.splice(i, 1); tekenVel(); },
      opOpenen: () => openFormulier(item.tekst || 'Item', item, itemFormulier, nieuw => {
        items[i] = schoonItem(nieuw);
        tekenVel();
      }),
    }));
  });
  kaart.appendChild(rijenvak);
  maakSleepbaar(rijenvak, items, tekenVel);

  kaart.appendChild(toevoegRij('Item toevoegen', () => {
    const item = { icoon:'📅', tekst:'', tijd:'', dagen:[], wie:[], avond:false };
    openFormulier('Nieuw item', item, itemFormulier, nieuw => {
      if(!tekst(nieuw.tekst)) return;
      items.push(schoonItem(nieuw));
      tekenVel();
    });
  }));
  stuk.appendChild(kaart);
  return stuk;
}

function schoonItem(ruw){
  return {
    icoon: tekst(ruw.icoon, '📅'),
    tekst: tekst(ruw.tekst),
    tijd: tekst(ruw.tijd),
    dagen: dagenVan(ruw.dagen),
    wie: lijstVan(ruw.wie),
    avond: Boolean(ruw.avond),
  };
}

function velAlgemeen(){
  const stuk = document.createDocumentFragment();
  const kaart = el('div', 'bewerkkaart glas');

  const rij1 = el('div', 'bewerkrij');
  rij1.append(el('div', 'tegel', '🏡'), veld(concept.titel, 'Naam van de app', '', v => { concept.titel = v; }));
  kaart.appendChild(rij1);

  const rij2 = el('div', 'bewerkrij');
  const uur = veld(String(concept.avondVanaf), '15', 'getal', v => { concept.avondVanaf = v; });
  uur.type = 'number'; uur.min = '0'; uur.max = '23';
  rij2.append(el('div', 'tegel', '🌙'), el('div', 'taaknaam', 'Avond begint om'), uur);
  kaart.appendChild(rij2);

  stuk.appendChild(kaart);
  stuk.appendChild(el('div', 'notitie',
    'Open je de app na dit uur, dan staat het avondritme meteen klaar.'));
  return stuk;
}

function tekenVel(){
  const hoogte = velEl.scrollTop;
  veltitelEl.textContent = VELTITELS[velSoort] || 'Bewerken';
  velinhoudEl.innerHTML = '';
  if(velSoort === 'kinderen') velinhoudEl.appendChild(velKinderen());
  else if(velSoort === 'overzicht') velinhoudEl.appendChild(velOverzicht());
  else if(velSoort === 'algemeen') velinhoudEl.appendChild(velAlgemeen());
  else velinhoudEl.appendChild(velRitme(velSoort));
  velEl.scrollTop = hoogte;
}

function openVel(soort){
  concept = alsRuweConfig();
  ['dag','nacht'].forEach(r => concept[r].forEach(g => g.stappen.forEach(s => {
    s.dagen = lijstVan(s.dagen); s.wie = lijstVan(s.wie);
  })));
  concept.overzicht = lijstVan(concept.overzicht).map(schoonItem);
  velSoort = soort;
  toonMelding('');
  scrimEl.hidden = false;
  velEl.hidden = false;
  document.body.style.overflow = 'hidden';
  tekenVel();
  velEl.scrollTop = 0;
}

function sluitVel(){
  sluitFormulier(false);
  scrimEl.hidden = true;
  velEl.hidden = true;
  document.body.style.overflow = '';
  concept = null;
}

function schoneGroepen(lijst){
  return lijstVan(lijst).map(g => ({
    groep: tekst(g.groep),
    tijd: tekst(g.tijd),
    stappen: lijstVan(g.stappen).filter(s => tekst(s.label)).map(s => {
      const uit = { icoon: tekst(s.icoon, '⭐'), label: tekst(s.label) };
      const dagen = dagenVan(s.dagen);
      if(dagen.length) uit.dagen = dagen;
      const wie = lijstVan(s.wie);
      if(wie.length) uit.wie = wie;
      return uit;
    }),
  })).filter(g => g.stappen.length || tekst(g.groep));
}

// Eén lijst met items die zelf hun dagen kennen; lege regels vallen weg.
function schoonOverzicht(bron){
  return lijstVan(bron).filter(item => tekst(item && item.tekst)).map(item => {
    const uit = { icoon: tekst(item.icoon, '📅'), tekst: tekst(item.tekst) };
    if(tekst(item.tijd)) uit.tijd = tekst(item.tijd);
    const dagen = dagenVan(item.dagen);
    if(dagen.length && dagen.length < WEEKDAGEN.length) uit.dagen = dagen;
    const wie = lijstVan(item.wie);
    if(wie.length) uit.wie = wie;
    if(item.avond) uit.avond = true;
    return uit;
  });
}

// Wat geweest is ruimt zichzelf op: een bijzonderheid van gisteren gaat er bij
// het eerstvolgende bewaren uit.
function schoonEvents(bron){
  const grens = vandaag();
  return lijstVan(bron)
    .filter(e => tekst(e && e.tekst) && /^\d{4}-\d{2}-\d{2}$/.test(tekst(e && e.datum)))
    .filter(e => tekst(e.datum) >= grens)
    .map(e => {
      const uit = {
        id: tekst(e.id) || nieuwId(),
        icoon: tekst(e.icoon, '🎉'),
        tekst: tekst(e.tekst),
        datum: tekst(e.datum),
      };
      if(tekst(e.tijd)) uit.tijd = tekst(e.tijd);
      const wie = lijstVan(e.wie);
      if(wie.length) uit.wie = wie;
      return uit;
    });
}

function opgeschoond(c){
  return {
    titel: tekst(c.titel, STANDAARD.titel),
    avondVanaf: uurOf(c.avondVanaf, STANDAARD.avondVanaf),
    mensen: lijstVan(c.mensen).map((p, i) => ({
      id: tekst(p.id, nieuwId()),
      naam: tekst(p.naam, 'Naamloos'),
      emoji: tekst(p.emoji, '🙂'),
      kleur: tekst(p.kleur, KLEUREN[i % KLEUREN.length]),
    })),
    dag: schoneGroepen(c.dag),
    nacht: schoneGroepen(c.nacht),
    overzicht: schoonOverzicht(c.overzicht),
    events: schoonEvents(c.events),
  };
}

async function bewaarVel(){
  const nieuw = opgeschoond(concept);
  if(!nieuw.mensen.length) return toonMelding('Er moet minstens één kind zijn.');
  if(!aantalStappen(maakGroepen(nieuw.dag)) && !aantalStappen(maakGroepen(nieuw.nacht))){
    return toonMelding('Er moet minstens één stap overblijven.');
  }
  if(opslag.basis){
    try{
      await bewaarConfigOpAfstand(nieuw);
    }catch(err){
      return toonMelding('Opslaan in de database lukte niet (' + err.message
        + '). Controleer de regels in Firebase — schrijven onder "config" moet toegestaan zijn.');
    }
  }
  config = normaliseer(nieuw);
  bewaarLokaalConfig(nieuw);
  sluitVel();
  toepassen();
}

// ------------------------------------------------------------- bijwerken ---
// iOS bewaart index.html hardnekkig zodra de pagina op het beginscherm staat;
// een gewone herlaad krijgt dan opnieuw dezelfde bewaarde versie. Daarom draagt
// elke uitgave zijn commit-nummer bij zich en staat datzelfde nummer in
// versie.txt ernaast.
function herlaad(){
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now().toString(36));
  location.replace(url);
}

async function nieuwerBeschikbaar(){
  if(VERSIE.startsWith('__')) return null;
  try{
    const res = await fetch('versie.txt', { cache:'no-store' });
    if(!res.ok) return null;
    const daar = (await res.text()).trim();
    return daar && daar !== VERSIE ? daar : null;
  }catch(err){ return null; }
}

async function haalNieuwsteBinnen(){
  if(!velEl.hidden) return;          // niet herladen terwijl iemand zit te bewerken
  const nieuw = await nieuwerBeschikbaar();
  if(!nieuw) return;
  try{
    if(sessionStorage.getItem('geprobeerd') === nieuw) return;
    sessionStorage.setItem('geprobeerd', nieuw);
  }catch(err){}
  herlaad();
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') haalNieuwsteBinnen();
});

// In de app-weergave op iOS is er geen browserbalk en dus ook geen
// trek-om-te-verversen. Daarom hier zelf, en alleen als de pagina echt als app
// draait — in een tabblad doet de browser dit al.
const alsApp = window.navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;

if(alsApp){
  const trekEl = $('trek');
  const DREMPEL = 70;
  let begin = null, afstand = 0, bezig = false;

  const toon = y => {
    afstand = y;
    trekEl.style.transform = `translateY(${y - 48}px) rotate(${Math.round(y * 4)}deg)`;
    trekEl.style.opacity = Math.min(y / DREMPEL, 1);
  };
  const terug = () => {
    trekEl.classList.add('terug');
    toon(0);
    setTimeout(() => trekEl.classList.remove('terug'), 300);
  };

  document.addEventListener('touchstart', e => {
    begin = (!bezig && velEl.hidden && kiezerEl.hidden && window.scrollY <= 0 && e.touches.length === 1)
      ? e.touches[0].clientY : null;
    afstand = 0;
  }, { passive:true });

  document.addEventListener('touchmove', e => {
    if(begin === null) return;
    const gesleept = e.touches[0].clientY - begin;
    toon(gesleept > 0 ? Math.min(gesleept * 0.5, 95) : 0);
  }, { passive:true });

  document.addEventListener('touchend', () => {
    if(begin === null) return;
    begin = null;
    if(afstand < DREMPEL) return terug();
    bezig = true;
    trekEl.classList.add('bezig');
    toon(DREMPEL);
    herlaad();
  }, { passive:true });
}

// ------------------------------------------------------------- aansluiten ---
segmentEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) zetRitme(b.dataset.ritme);
});

tabbalkEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) zetPagina(b.dataset.pagina);
});

$('opnieuwKnop').addEventListener('click', () => {
  done[ritme] = new Map();
  render();
  wisRitme(ritme);
});

$('velAf').addEventListener('click', sluitVel);
$('velGereed').addEventListener('click', bewaarVel);
$('formAf').addEventListener('click', () => sluitFormulier(false));
$('formGereed').addEventListener('click', () => sluitFormulier(true));
formScrimEl.addEventListener('click', () => sluitFormulier(false));
$('kiezerGereed').addEventListener('click', () => sluitKiezer(true));
kiesScrimEl.addEventListener('click', () => sluitKiezer(false));

async function laden(){
  let ruw = null;
  try{
    const res = await fetch('routine.json', { cache:'no-cache' });
    if(res.ok) ruw = await res.json();
  }catch(err){ console.warn('routine.json niet geladen:', err); }
  instelling = (ruw && ruw.opslag) || null;
  // De laatst bekende inhoud staat lokaal en schildert meteen; de database
  // corrigeert zodra die antwoordt.
  config = normaliseer(laadLokaalConfig() || ruw || STANDAARD);
}

ritme = beginRitme();
toepassen();
laden().then(() => {
  ritme = beginRitme();
  toepassen();
  return startOpslag();
}).then(haalNieuwsteBinnen);
</script>
