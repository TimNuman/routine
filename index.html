<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Ons Dagritme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sun: #FFB84D;
    --sun-deep: #F2994A;
    --sky: #8FD3F4;
    --sky-deep: #5CB8E0;
    --night: #232752;
    --night-deep: #14163A;
    --star: #FFD966;
    --cream: #FFF9EF;
    --ink: #2B2D42;
    --ink-soft: #5B5D7A;
    --done: #6FCF97;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px 12px;
  }
  .card{
    width:100%;
    max-width: 780px;
    border-radius: 32px;
    overflow:hidden;
    box-shadow: 0 20px 50px rgba(35,39,82,0.15);
    background: var(--cream);
    transition: background 0.6s ease;
  }
  .card.night-mode{
    background: var(--night-deep);
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 22px 28px 10px;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    margin:0;
    color: var(--ink);
    transition: color 0.6s ease;
  }
  .night-mode h1{ color: var(--cream); }
  .kids{
    font-weight:700;
    font-size: 14px;
    color: var(--ink-soft);
    margin-top:2px;
  }
  .night-mode .kids{ color: #B7BAE0; }

  .toggle{
    display:flex;
    background: rgba(0,0,0,0.06);
    border-radius: 999px;
    padding: 4px;
    position:relative;
    cursor:pointer;
    user-select:none;
    flex-shrink:0;
  }
  .night-mode .toggle{ background: rgba(255,255,255,0.08); }
  .toggle button{
    border:none;
    background:transparent;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 999px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    color: var(--ink-soft);
    position:relative;
    z-index:2;
    transition: color 0.3s ease;
  }
  .night-mode .toggle button{ color:#9294c4; }
  .toggle button.active{ color: #fff; }
  .toggle .thumb{
    position:absolute;
    top:4px; bottom:4px; left:4px;
    width: calc(50% - 4px);
    border-radius: 999px;
    background: linear-gradient(135deg, var(--sun), var(--sun-deep));
    transition: transform 0.35s cubic-bezier(.4,1.6,.4,1), background 0.35s ease;
    z-index:1;
  }
  .night-mode .thumb{
    background: linear-gradient(135deg, #4A4E8C, var(--night));
  }
  .toggle.is-night .thumb{ transform: translateX(100%); }

  .scene{
    position:relative;
    height: 90px;
    overflow:hidden;
  }
  .scene .sky{
    position:absolute; inset:0;
    background: linear-gradient(180deg, var(--sky), var(--sky-deep));
    transition: opacity 0.6s ease;
  }
  .night-mode .scene .sky{
    background: linear-gradient(180deg, var(--night-deep), var(--night));
  }
  .sun-moon{
    position:absolute;
    top: 18px; left: 40px;
    font-size: 38px;
    transition: transform 0.6s ease, left 0.6s ease;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
  .night-mode .sun-moon{ left: calc(100% - 78px); }
  .stars{ position:absolute; inset:0; opacity:0; transition:opacity 0.6s ease; }
  .night-mode .stars{ opacity:1; }
  .stars span{
    position:absolute; color:var(--star); font-size:12px;
  }

  .path{
    padding: 20px 28px 32px;
    display:flex;
    flex-direction:column;
    gap: 18px;
  }
  .group{
    display:flex;
    align-items:center;
    gap: 16px;
  }
  .group + .group{
    border-top: 2px dashed rgba(43,45,66,0.10);
    padding-top: 18px;
  }
  .night-mode .group + .group{ border-top-color: rgba(255,255,255,0.10); }
  .group-label{
    flex: 0 0 92px;
    text-align:right;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 15px;
    line-height:1.15;
    color: var(--ink-soft);
  }
  .night-mode .group-label{ color:#9294c4; }
  .group-steps{
    flex:1;
    display:flex;
    flex-wrap:wrap;
    gap: 14px;
  }
  .group.no-label .group-steps{ justify-content:center; }
  .step{
    width: 118px;
    text-align:center;
    cursor:pointer;
    user-select:none;
  }
  .stone{
    width: 76px; height: 76px;
    margin: 0 auto 8px;
    border-radius: 24px;
    background: #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 34px;
    box-shadow: 0 6px 14px rgba(35,39,82,0.12);
    border: 3px solid transparent;
    position:relative;
    transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .night-mode .stone{ background: #2E3163; }
  .step:hover .stone{ transform: translateY(-3px); }
  .step.done .stone{
    border-color: var(--done);
    background: #EAFBF1;
  }
  .night-mode .step.done .stone{ background: #1E4A38; }
  .checkmark{
    position:absolute;
    top:-8px; right:-8px;
    width:26px; height:26px;
    border-radius:50%;
    background: var(--done);
    color:#fff;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform: scale(0.5);
    transition: opacity 0.2s ease, transform 0.2s ease;
    font-weight:800;
  }
  .step.done .checkmark{ opacity:1; transform: scale(1); }
  .num{
    font-family:'Baloo 2', sans-serif;
    font-size:12px;
    font-weight:700;
    color: var(--ink-soft);
    margin-bottom:2px;
  }
  .night-mode .num{ color:#8386bd; }
  .label{
    font-family:'Baloo 2', sans-serif;
    font-size: 14px;
    font-weight:600;
    color: var(--ink);
    line-height:1.15;
  }
  .night-mode .label{ color: var(--cream); }

  .footer{
    padding: 6px 28px 26px;
    text-align:center;
  }
  .reset{
    font-family:'Nunito', sans-serif;
    font-weight:700;
    font-size: 13px;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor:pointer;
    text-decoration: underline;
  }
  .night-mode .reset{ color:#9294c4; }

  @media (max-width:480px){
    .step{ width: 92px; }
    .stone{ width:64px; height:64px; font-size:28px; }
    .path{ padding: 18px 16px 28px; }
    .group{ flex-direction:column; align-items:stretch; gap:8px; }
    .group-label{ flex:none; text-align:left; }
    .group-steps{ justify-content:center; }
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="topbar">
      <div>
        <h1 id="titel">Ons dagritme</h1>
        <div class="kids" id="kids">voor Emma &amp; Mads</div>
      </div>
      <div class="toggle" id="toggle">
        <div class="thumb"></div>
        <button class="active" id="btnDag">☀️ Dag</button>
        <button id="btnNacht">🌙 Avond</button>
      </div>
    </div>

    <div class="scene">
      <div class="sky"></div>
      <div class="sun-moon" id="sunMoon">☀️</div>
      <div class="stars" id="stars"></div>
    </div>

    <div class="path" id="path"></div>

    <div class="footer">
      <button class="reset" id="resetBtn">opnieuw beginnen</button>
    </div>
  </div>

<script>
// De namen en stappen komen uit routine.json. Lukt dat niet (bijvoorbeeld bij
// openen via file://), dan valt de pagina terug op dit standaardritme.
//
// Een routine is óf een platte lijst stappen, óf een lijst groepen die elk een
// eigen rij met kopje krijgen. Beide vormen mogen door elkaar gebruikt worden.
const STANDAARD = {
  titel: 'Ons dagritme',
  kinderen: 'voor Emma & Mads',
  dag: [
    {groep:'Boven', stappen:[
      {icoon:'🛏️', label:'Wakker worden'},
      {icoon:'🪥', label:'Tanden poetsen'},
      {icoon:'👕', label:'Aankleden'},
    ]},
    {groep:'Beneden', stappen:[
      {icoon:'⬇️', label:'Naar beneden'},
      {icoon:'💇', label:'Haren kammen'},
      {icoon:'🥣', label:'Ontbijt'},
      {icoon:'🧸', label:'Spelen'},
    ]},
    {groep:'Weggaan', stappen:[
      {icoon:'🎒', label:'Tas & jas'},
      {icoon:'👟', label:'Schoenen aan'},
      {icoon:'🚪', label:'Naar school!'},
    ]},
  ],
  nacht: [
    {icoon:'🍽️', label:'Avondeten'},
    {icoon:'🧸', label:'Even spelen'},
    {icoon:'🛁', label:'Bad & pyjama'},
    {icoon:'🪥', label:'Tanden poetsen'},
    {icoon:'📖', label:'Voorlezen'},
    {icoon:'🤗', label:'Knuffel'},
    {icoon:'🌙', label:'Licht uit'},
  ]
};

let config = { titel: STANDAARD.titel, kinderen: STANDAARD.kinderen };
let mode = 'dag';
let done = { dag: new Set(), nacht: new Set() };

const card = document.getElementById('card');
const titelEl = document.getElementById('titel');
const kidsEl = document.getElementById('kids');
const pathEl = document.getElementById('path');
const toggle = document.getElementById('toggle');
const btnDag = document.getElementById('btnDag');
const btnNacht = document.getElementById('btnNacht');
const sunMoon = document.getElementById('sunMoon');
const starsEl = document.getElementById('stars');
const resetBtn = document.getElementById('resetBtn');

function renderStars(){
  starsEl.innerHTML = '';
  const positions = [
    [10,20],[25,10],[70,15],[85,30],[45,8],[92,12],[15,35],[60,25]
  ];
  positions.forEach(([left,top])=>{
    const s = document.createElement('span');
    s.textContent = '✦';
    s.style.left = left+'%';
    s.style.top = top+'px';
    starsEl.appendChild(s);
  });
}

// Beide JSON-vormen worden hier naar dezelfde structuur getrokken: een lijst
// groepen met een (eventueel lege) naam. Een platte lijst wordt één naamloze
// groep, die dan gewoon als één gecentreerde rij verschijnt.
function maakGroepen(lijst){
  if(!Array.isArray(lijst) || !lijst.length) return [];
  const gegroepeerd = lijst.some(item => item && Array.isArray(item.stappen));
  if(!gegroepeerd) return [{ groep:'', stappen: lijst }];
  return lijst
    .filter(item => item && Array.isArray(item.stappen) && item.stappen.length)
    .map(item => ({ groep: item.groep || '', stappen: item.stappen }));
}

function aantalStappen(groepen){
  return groepen.reduce((n, g)=> n + g.stappen.length, 0);
}

// Een routine wordt alleen overgenomen als er stappen in zitten; anders blijft
// het standaardritme staan, zodat een typefout in routine.json niets leegtrekt.
function routine(waarde, terugval){
  const groepen = maakGroepen(waarde);
  return aantalStappen(groepen) ? groepen : maakGroepen(terugval);
}

function maakStap(step, i){
  const el = document.createElement('div');
  el.className = 'step' + (done[mode].has(i) ? ' done' : '');

  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = 'stap ' + (i+1);

  const stone = document.createElement('div');
  stone.className = 'stone';
  const icon = document.createElement('span');
  icon.textContent = step.icoon || '•';
  const check = document.createElement('div');
  check.className = 'checkmark';
  check.textContent = '✓';
  stone.append(icon, check);

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = step.label || '';

  el.append(num, stone, label);
  el.addEventListener('click', ()=>{
    if(done[mode].has(i)) done[mode].delete(i);
    else done[mode].add(i);
    render();
  });
  return el;
}

function render(){
  pathEl.innerHTML = '';
  // De stapnummers lopen door over de groepen heen, zodat 'stap 5' hetzelfde
  // betekent als je de rijen anders indeelt.
  let nummer = 0;
  config[mode].forEach(groep => {
    const rij = document.createElement('div');
    rij.className = 'group' + (groep.groep ? '' : ' no-label');

    if(groep.groep){
      const naam = document.createElement('div');
      naam.className = 'group-label';
      naam.textContent = groep.groep;
      rij.appendChild(naam);
    }

    const stappen = document.createElement('div');
    stappen.className = 'group-steps';
    groep.stappen.forEach(step => stappen.appendChild(maakStap(step, nummer++)));

    rij.appendChild(stappen);
    pathEl.appendChild(rij);
  });
}

function toepassen(){
  document.title = config.titel;
  titelEl.textContent = config.titel;
  kidsEl.textContent = config.kinderen;
  render();
}

function setMode(newMode){
  mode = newMode;
  const isNight = mode === 'nacht';
  card.classList.toggle('night-mode', isNight);
  toggle.classList.toggle('is-night', isNight);
  btnDag.classList.toggle('active', !isNight);
  btnNacht.classList.toggle('active', isNight);
  sunMoon.textContent = isNight ? '🌙' : '☀️';
  render();
}

function overnemen(data){
  config = {
    titel: data.titel || STANDAARD.titel,
    kinderen: data.kinderen || STANDAARD.kinderen,
    dag: routine(data.dag, STANDAARD.dag),
    nacht: routine(data.nacht, STANDAARD.nacht),
  };
}

async function laden(){
  try{
    const res = await fetch('routine.json', {cache: 'no-cache'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    overnemen(await res.json());
  }catch(err){
    console.warn('routine.json niet geladen — standaardritme gebruikt:', err);
    overnemen(STANDAARD);
  }
  toepassen();
}

btnDag.addEventListener('click', ()=> setMode('dag'));
btnNacht.addEventListener('click', ()=> setMode('nacht'));
resetBtn.addEventListener('click', ()=>{
  done[mode].clear();
  render();
});

renderStars();
overnemen(STANDAARD);
toepassen();
laden();
</script>
</body>
</html>
