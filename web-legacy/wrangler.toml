name = "routine-web"
main = "worker.js"
compatibility_date = "2026-08-01"

# De bevroren webversie, op een eigen adres. Hij serveert dezelfde bestanden
# als vroeger en geeft /api/* door aan de echte Worker, zodat de pagina vanuit
# de browser gezien nog steeds met zichzelf praat — er hoeft dus nergens CORS
# open.
[assets]
directory = "../public"
binding = "ASSETS"

# Met een service binding en niet over https://…workers.dev: een Worker die
# een andere Worker op hetzelfde account over zijn publieke adres aanroept komt
# bij zichzelf terug uit. Dit gaat intern, scheelt een ronde over het net, en
# een WebSocket komt er ongeschonden doorheen — het verzoek wordt onaangeroerd
# doorgegeven, dus de Upgrade-kop blijft staan.
[[services]]
binding = "UPSTREAM"
service = "routine"
