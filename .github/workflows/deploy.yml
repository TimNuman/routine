name: Uitrollen

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uitrollen
  cancel-in-progress: false

jobs:
  # Cloudflare serveert de app én /api. Dit is waar het heen gaat.
  cloudflare:
    runs-on: ubuntu-latest
    # De secrets-context bestaat niet in een step-if; via env wel.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versie stempelen
        run: node stempel.mjs

      # Overslaan zolang het token er nog niet is, in plaats van rood worden.
      - name: Uitrollen naar Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm ci && npx wrangler deploy

      - name: Nog geen token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN staat nog niet bij de secrets; overgeslagen."

  # De oude plek. Blijft draaien tot Cloudflare staat; daarna mag dit hele blok
  # weg, samen met de pages-rechten hierboven.
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Versie stempelen
        run: node stempel.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4
