name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Het commit-nummer komt zowel in de pagina als in een los bestandje te
      # staan. De pagina vergelijkt die twee en weet zo of er iets nieuwers is.
      - name: Versie stempelen
        run: |
          printf '%s' "$GITHUB_SHA" > versie.txt
          sed -i "s/__VERSIE__/$GITHUB_SHA/" index.html
          grep -q "$GITHUB_SHA" index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
