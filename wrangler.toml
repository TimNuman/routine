name = "routine"
main = "worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Secrets, not vars:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SLEUTEL      (optional: then every /api request
#                                         must send it as X-Routine-Key)

# The house: everything one household shares, plus the phones watching it. A
# Durable Object is the only place that can both keep state and know who is
# connected, so nobody has to poll.
[[durable_objects.bindings]]
name = "HOUSE"
class_name = "House"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Huis"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "Huis", to = "House" }]

[vars]
# Hoeveel moeite de uitlezer doet. Een gezin opzetten is meer werk dan een
# schoolmail lezen, en op "low" laat hij de helft van de velden leeg.
EFFORT = "low"
# Which house. One name, here on the server, so the app never needs to know it.
HOUSEHOLD = "huis-9f3k2a"
# Which app may sign in. The bundle id is the audience of Apple's id token; the
# Google one is the iOS client id from console.cloud.google.com. Leave the
# Google one empty and that provider says "not configured".
APPLE_BUNDLE_ID = "app.dagritme"
# For the universal-link file at /.well-known/apple-app-site-association.
APPLE_TEAM_ID = "B78S7QYAZC"
# Where an invite page sends someone without the app. Empty until it is listed.
APP_STORE_URL = ""
GOOGLE_CLIENT_ID = "166041020343-iiueet9rmmun867tno2v6vnmfhc6gvq0.apps.googleusercontent.com"

# The directory: users, homes, who belongs where. The houses themselves are
# Durable Objects; this only says which ones exist.
#   npx wrangler d1 migrations apply routine --remote
[[d1_databases]]
binding = "DB"
database_name = "routine"
database_id = "cbe220ba-82d4-4709-883b-5bb07eb98b5d"
migrations_dir = "migrations"
