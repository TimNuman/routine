<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ons dagritme</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dagritme">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --baloo: 'Baloo 2', ui-rounded, system-ui, sans-serif;
    --nunito: 'Nunito', ui-rounded, -apple-system, system-ui, sans-serif;
    --inkt: #2B2D42;
    --inkt-zacht: #5B5D7A;
    --oranje: #F2994A;
    --oranje-diep: #E07B2C;
    --groen: #34C759;
    --rood: #E5484D;
    --scheiding: rgba(43,45,66,.08);
    --tegel: rgba(255,255,255,.72);
    --tegelrand: rgba(255,255,255,.9);
    --veld: rgba(255,255,255,.85);
    --veldrand: rgba(43,45,66,.14);
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    font-family: var(--nunito);
    color: var(--inkt);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    background:
      radial-gradient(1100px 640px at 10% -10%, #FFD7A0 0%, rgba(255,215,160,0) 60%),
      radial-gradient(820px 560px at 98% 4%, #FFC6E2 0%, rgba(255,198,226,0) 56%),
      radial-gradient(900px 760px at 62% 106%, #B7DEFF 0%, rgba(183,222,255,0) 58%),
      #FFF6E9;
    background-attachment: fixed;
    transition: background .4s ease, color .4s ease;
  }
  body.nacht{
    color:#F4F1FF;
    --inkt: #F4F1FF;
    --inkt-zacht: #A6A8D4;
    --scheiding: rgba(255,255,255,.10);
    --tegel: rgba(255,255,255,.10);
    --tegelrand: rgba(255,255,255,.16);
    --veld: rgba(255,255,255,.10);
    --veldrand: rgba(255,255,255,.16);
    background:
      radial-gradient(880px 560px at 86% -8%, #45408F 0%, rgba(69,64,143,0) 58%),
      radial-gradient(760px 660px at 4% 26%, #1D4C7C 0%, rgba(29,76,124,0) 56%),
      radial-gradient(880px 680px at 48% 108%, #5A3272 0%, rgba(90,50,114,0) 60%),
      #10122F;
    background-attachment: fixed;
  }
  button{ font-family: inherit; color: inherit; }

  /* Het glas uit de ontwerpen: melkwit, sterk vervaagd, met een lichtrandje
     aan de bovenkant. Waar backdrop-filter niet werkt houdt de vulling het
     beeld nog steeds leesbaar. */
  .glas{
    background: rgba(255,255,255,.62);
    backdrop-filter: blur(44px) saturate(200%);
    -webkit-backdrop-filter: blur(44px) saturate(200%);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      inset 0 -1px 0 rgba(255,255,255,.4),
      0 16px 38px rgba(126,84,42,.16);
  }
  .glas-zwevend{ background: rgba(255,255,255,.82); }
  body.nacht .glas{
    background: rgba(255,255,255,.09);
    border-color: rgba(255,255,255,.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.06),
      0 16px 38px rgba(4,6,26,.46);
  }
  body.nacht .glas-zwevend{ background: rgba(255,255,255,.13); }
  /* Kan de browser niet vervagen, dan is doorschijnend glas onleesbaar; dek de
     achtergrond dan gewoon af. */
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))){
    .glas{ background: rgba(255,255,255,.88); }
    .glas-zwevend{ background: rgba(255,255,255,.96); }
    body.nacht .glas{ background: rgba(40,42,92,.90); }
    body.nacht .glas-zwevend{ background: rgba(40,42,92,.97); }
  }

  /* ------------------------------------------------------------- kader --- */
  /* Alle tekst springt evenveel in als de inhoud van een kaart, zodat titels,
     kopjes en de eerste emoji op één lijn staan. */
  :root{ --insprong: 16px; --gootje: 22px; }
  .app{
    max-width:1280px; margin:0 auto; position:relative;
    padding: calc(env(safe-area-inset-top) + 42px) var(--gootje) 132px;
  }
  .kop{ display:block; position:relative; }
  .koptekst{ padding-left: var(--insprong); }
  .kop h1{
    font-family: var(--baloo); font-weight:800;
    font-size:36px; line-height:1.06; letter-spacing:-.5px; margin:0;
  }
  .kopdatum{ font-weight:700; font-size:15px; color: var(--inkt-zacht); margin-top:3px; }
  .pagina[hidden]{ display:none; }

  /* --------------------------------------------------------- schakelaar --- */
  .segment{
    display:flex; gap:4px; padding:4px; border-radius:19px; margin-top:16px;
  }
  .segment[hidden]{ display:none; }
  .segment button{
    flex:1; padding:9px 0; border-radius:15px; border:1px solid transparent;
    background:none; cursor:pointer;
    font-family: var(--baloo); font-weight:800; font-size:15px; color: var(--inkt-zacht);
  }
  .segment button.aan{
    background: rgba(255,255,255,.86);
    border-color: rgba(255,255,255,.95);
    box-shadow: 0 3px 10px rgba(0,0,0,.10);
    color: var(--inkt);
  }
  body.nacht .segment button.aan{
    background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.20);
  }

  /* ---------------------------------------------------------- voortgang --- */
  .voortgang{ border-radius:26px; margin-top:14px; overflow:hidden; display:flex; }
  .voortgang[hidden]{ display:none; }
  .vperson{ flex:1; display:flex; align-items:center; gap:11px; padding:13px 14px; min-width:0; }
  .vperson + .vperson{ border-left:1px solid var(--scheiding); }
  /* Vanaf drie kinderen naast elkaar wordt het te smal: dan twee per regel. */
  .voortgang.velen{ display:grid; grid-template-columns:1fr 1fr; }
  .voortgang.velen .vperson{ border-left:none; }
  .voortgang.velen .vperson:nth-child(even){ border-left:1px solid var(--scheiding); }
  .voortgang.velen .vperson:nth-child(n+3){ border-top:1px solid var(--scheiding); }
  .vbol{
    width:46px; height:46px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center; font-size:26px; line-height:1;
  }
  .vtekst{ flex:1; min-width:0; }
  .vregel{ display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .vnaam{
    font-family: var(--baloo); font-weight:800; font-size:16px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .vtelling{ font-weight:800; font-size:12.5px; color: var(--inkt-zacht); }
  .vbalk{ height:7px; border-radius:99px; background: rgba(43,45,66,.10); overflow:hidden; margin-top:6px; }
  body.nacht .vbalk{ background: rgba(255,255,255,.14); }
  .vbalk span{ display:block; height:100%; border-radius:99px; transition: width .3s ease; }

  /* ------------------------------------------------------------ groepen --- */
  /* De ritmepagina is één kolom op een telefoon en twee op een breed scherm;
     display:contents laat de blokken van het overzicht dan tussen de stappen
     zakken (Vandaag erboven, Morgen eronder). */
  .ritmelijf{ display:flex; flex-direction:column; }
  .ritmehoofd, .ritmezij{ display:contents; }
  .voortgang{ order:1; }
  .agendablok{ order:2; }
  /* Morgen zakt onder de stappen, met een streep ertussen. */
  .agendablok.later{
    order:4; margin-top:26px; padding-top:22px;
    border-top:1px dashed var(--scheiding);
  }
  #groepen{ order:3; }
  .opnieuw{ order:5; }

  .groepkop{
    display:flex; align-items:baseline; gap:12px;
    padding:0 var(--insprong) 10px; margin-top:20px;
  }
  .groepnaam{ font-family: var(--baloo); font-weight:800; font-size:17px; }
  .groeptijd{ font-weight:700; font-size:13px; color: var(--inkt-zacht); }
  .kaart{ border-radius:26px; overflow:hidden; }
  .streep{ height:1px; background: var(--scheiding); margin:0 var(--insprong); }

  /* Overal even brede kaartjes: drie op een rij op een telefoon, vijf zodra er
     ruimte is. Een groep met minder stappen laat de rij verder leeg. */
  .kaartraster{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; }
  .taakkaart{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:8px 6px 8px; border-radius:22px; min-height:142px;
  }
  /* De emoji staat los op de kaart: geen vlakje eromheen, wel groter. Met de
     rondjes onderaan verdeelt de overgebleven ruimte zich boven en onder de
     emoji, zodat emoji en naam samen midden in de kaart staan. */
  .taakkaart .tegel{
    width:auto; height:auto; border-radius:0; margin-top:auto;
    background:none; border:none; font-size:36px; line-height:1.15;
  }
  .tegel{
    width:46px; height:46px; border-radius:15px; flex:none;
    background: var(--tegel); border:1px solid var(--tegelrand);
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .taakkaart .taaknaam{
    /* Niet meegroeien: anders slokt de naam de vrije ruimte op en blijft er
       niets over om emoji en naam mee te centreren. */
    flex:none;
    font-family: var(--baloo); font-weight:700; font-size:13px; line-height:1.2;
    text-align:center; text-wrap:pretty;
  }
  .taaknaam{
    flex:1; min-width:0;
    font-family: var(--baloo); font-weight:700; font-size:16.5px; line-height:1.2;
  }
  /* Meer kinderen dan er naast elkaar passen zakken naar een volgende regel;
     een oneven laatste regel staat gecentreerd. */
  .rondjes{
    display:flex; flex-wrap:wrap; justify-content:center;
    column-gap:2px; row-gap:2px;
    flex:none; align-self:stretch; margin-top:auto;
    --rond:40px; --gezicht:34px; --teken:21px;
  }
  .rondje{
    width: var(--rond); height: var(--rond);
    flex:none; position:relative; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none; padding:0;
  }
  .rondje .ring{ border-radius:50%; box-shadow: inset 0 0 0 1.5px rgba(43,45,66,.14); }
  body.nacht .rondje .ring{ box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.18); }
  .rondje .gezicht{
    width: var(--gezicht); height: var(--gezicht); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size: var(--teken); line-height:1;
    filter: grayscale(1); opacity:.40;
    transition: filter .2s ease, opacity .2s ease;
  }
  .rondje[aria-pressed="true"] .ring{
    box-shadow: 0 0 0 2.5px var(--groen), 0 4px 10px rgba(0,0,0,.16);
  }
  .rondje[aria-pressed="true"] .gezicht{ filter:none; opacity:1; }

  .leegkaart{
    border-radius:26px; padding:28px 20px; text-align:center;
    font-weight:700; color: var(--inkt-zacht);
  }
  .opnieuw{
    display:block; margin:22px auto 0; padding:10px 18px; border-radius:999px;
    background:none; border:1px solid var(--veldrand); cursor:pointer;
    font-weight:800; font-size:13px; color: var(--inkt-zacht);
  }

  /* ---------------------------------------------------------- overzicht --- */
  .weekstrip{ display:flex; align-items:stretch; border-radius:24px; padding:10px 4px; margin-top:16px; }
  .weekstrip button{
    flex:1; background:none; border:none; cursor:pointer; padding:0;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .weekstrip button.weekpijl{
    flex:0 0 26px; align-items:center; justify-content:center;
    color: var(--inkt-zacht); opacity:.65;
  }
  .wletter{ font-family: var(--baloo); font-weight:800; font-size:12px; color: var(--inkt-zacht); }
  .wdag{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--baloo); font-weight:800; font-size:17px;
  }
  .weekstrip button.aan .wdag{ background: var(--oranje); color:#fff; }
  .weekstrip button.vandaag:not(.aan) .wdag{ box-shadow: inset 0 0 0 2px rgba(242,153,74,.5); }

  /* De hoogte van een blokkop staat vast, zodat het kinderblok er op een breed
     scherm precies evenveel voor kan zakken en gelijk ligt met de kaart ernaast. */
  .blokkop{
    font-family: var(--baloo); font-weight:800; font-size:16px; line-height:22px;
    padding:0 var(--insprong) 9px; margin-top:22px;
  }
  .agendarij{
    display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
    padding:12px var(--insprong); min-height:54px;
    background:none; border:none; font-family:inherit; color:inherit;
  }
  /* Iets bijzonders op één datum krijgt een eigen randje, zodat het opvalt
     tussen het vaste weekritme. */
  .agendarij.bijzonder{
    background: rgba(242,153,74,.13);
    box-shadow: inset 3px 0 0 var(--oranje);
  }
  body.nacht .agendarij.bijzonder{ background: rgba(242,153,74,.16); }
  button.agendarij{ cursor:pointer; }
  #formmelding{ margin:10px 2px 4px; }
  .verwijderknop{
    width:100%; margin-top:18px; padding:13px 0; border-radius:18px; cursor:pointer;
    border:1px solid rgba(229,72,77,.35); background: rgba(229,72,77,.10);
    font-family: var(--baloo); font-weight:800; font-size:14.5px; color:#E5484D;
  }
  input.veld.datum{ flex:1 1 150px; font-size:14px; font-family: var(--nunito); font-weight:800; }
  .agendaicoon{ font-size:24px; flex:none; width:30px; text-align:center; line-height:1.2; }
  .agendatekst{ flex:1; min-width:0; }
  .agendanaam{ font-family: var(--baloo); font-weight:700; font-size:15.5px; }
  .agendameta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-top:5px; }
  .agendatijd{ font-weight:800; font-size:12.5px; color: var(--inkt-zacht); }
  .merk{
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 9px 3px 3px; border-radius:999px; color:#fff;
    font-family: var(--baloo); font-weight:800; font-size:12.5px;
  }
  .merk i{
    width:19px; height:19px; border-radius:50%; background: rgba(255,255,255,.28);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-style:normal;
  }

  /* ------------------------------------------------------- instellingen --- */
  .lijst{ border-radius:26px; overflow:hidden; margin-top:16px; }
  .lijstrij{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:14px; min-height:62px; background:none; border:none; cursor:pointer; text-align:left;
  }
  .lijstrij + .lijstrij{ border-top:1px solid var(--scheiding); }
  .lijstrij .tegel{ font-size:22px; }
  .lijsttekst{ flex:1; min-width:0; }
  .lijsttitel{ font-family: var(--baloo); font-weight:800; font-size:16px; }
  .lijstuitleg{ font-weight:700; font-size:12.5px; color: var(--inkt-zacht); margin-top:1px; }
  .pijl{ flex:none; color: var(--inkt-zacht); opacity:.6; }
  .gezichten{ display:flex; flex:none; }
  .gezichten span{
    width:34px; height:34px; border-radius:50%; margin-left:-8px;
    display:flex; align-items:center; justify-content:center; font-size:19px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.85);
  }
  body.nacht .gezichten span{ box-shadow: 0 0 0 2px rgba(24,26,58,.9); }
  .gezichten span:first-child{ margin-left:0; }
  .voetnoot{ text-align:center; font-weight:700; font-size:12px; color: var(--inkt-zacht); margin-top:20px; opacity:.75; }

  /* -------------------------------------------------------- zwevend menu --- */
  .tabbalk{
    position:fixed; left:14px; right:14px; bottom: calc(env(safe-area-inset-bottom) + 18px);
    max-width:492px; margin:0 auto;
    border-radius:34px; padding:5px; display:flex; gap:4px; z-index:40;
  }
  .tabbalk button{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:7px 0 6px; border-radius:20px; border:none; background:none; cursor:pointer;
    font-size:10.5px; font-weight:800; color: rgba(43,45,66,.52);
  }
  body.nacht .tabbalk button{ color: rgba(255,255,255,.55); }
  .tabbalk button.aan{
    background: rgba(242,153,74,.16); box-shadow: inset 0 0 0 1px rgba(242,153,74,.28);
    color: var(--oranje);
  }
  .tabbalk svg{ width:23px; height:23px; }

  /* ------------------------------------------------------------ bewerken --- */
  .scrim{ position:fixed; inset:0; background: rgba(22,15,6,.34); z-index:60; }
  /* De emojikiezer komt over het bewerkblad heen, dus zijn waas ook. */
  #kiesScrim{ z-index:70; }
  .scrim[hidden], .vel[hidden], .bodemblad[hidden]{ display:none; }
  .vel{
    position:fixed; inset:0; z-index:61; overflow-y:auto;
    padding: calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 30px);
    background:
      radial-gradient(1100px 640px at 10% -10%, #FFD7A0 0%, rgba(255,215,160,0) 60%),
      radial-gradient(820px 560px at 98% 4%, #FFC6E2 0%, rgba(255,198,226,0) 56%),
      radial-gradient(900px 760px at 62% 106%, #B7DEFF 0%, rgba(183,222,255,0) 58%),
      #FFF6E9;
  }
  body.nacht .vel{
    background:
      radial-gradient(880px 560px at 86% -8%, #45408F 0%, rgba(69,64,143,0) 58%),
      radial-gradient(760px 660px at 4% 26%, #1D4C7C 0%, rgba(29,76,124,0) 56%),
      radial-gradient(880px 680px at 48% 108%, #5A3272 0%, rgba(90,50,114,0) 60%),
      #10122F;
  }
  .velkop{
    position:sticky; top:0; z-index:2;
    max-width:496px; margin:0 auto 18px; border-radius:28px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 18px;
  }
  .velkop h2{ font-family: var(--baloo); font-weight:800; font-size:18px; margin:0; }
  .tekstknop{
    background:none; border:none; cursor:pointer; padding:4px 2px;
    font-weight:800; font-size:16px; color: var(--oranje);
  }
  .velinhoud{ max-width:520px; margin:0 auto; padding:0 22px; }
  .melding{
    max-width:496px; margin:0 auto 14px; padding:11px 14px; border-radius:16px;
    background: rgba(229,72,77,.14); border:1px solid rgba(229,72,77,.32);
    font-weight:700; font-size:13px; color:#B0272C;
  }
  body.nacht .melding{ color:#FFB3B5; }
  .melding[hidden]{ display:none; }

  .bewerkkaart{ border-radius:26px; overflow:hidden; margin-top:18px; }
  .groepregel{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--scheiding); }
  .bewerkrij{
    display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:58px;
    background: transparent; transition: background .2s ease;
  }
  /* De hele regel opent het formulier; alleen de knoppen aan de randen niet. */
  .rijknopvlak{
    flex:1; min-width:0; display:flex; align-items:center; gap:10px;
    background:none; border:none; padding:6px 2px; cursor:pointer; text-align:left;
    font-family: inherit; color: inherit;
  }
  .rijlabel{
    flex:1; min-width:0;
    font-family: var(--baloo); font-weight:700; font-size:15.5px; color: var(--inkt);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .rijlabel.leeg{ color: var(--inkt-zacht); font-weight:600; }
  .rijmeta{ display:flex; align-items:center; gap:8px; flex:none; }
  .rijdagen{
    font-weight:800; font-size:11.5px; color: var(--inkt-zacht);
    white-space:nowrap; letter-spacing:.2px;
  }
  .rijwie{ display:flex; flex:none; }
  .rijwie span{
    width:24px; height:24px; border-radius:50%; margin-left:-7px;
    display:flex; align-items:center; justify-content:center; font-size:13px;
    box-shadow: 0 0 0 2px rgba(255,255,255,.85);
  }
  body.nacht .rijwie span{ box-shadow: 0 0 0 2px rgba(24,26,58,.9); }
  .rijwie span:first-child{ margin-left:0; }
  .rijkleur{ width:16px; height:16px; border-radius:50%; flex:none; }
  /* Staat er veel naast de naam — een datum, een groep, wie het betreft — dan
     wint de naam en zakt de rest naar een tweede regel, uitgelijnd op de tekst. */
  .bewerkrij.tweeregels .rijknopvlak{ flex-wrap:wrap; align-content:center; row-gap:3px; }
  .bewerkrij.tweeregels .rijlabel{ flex:1 1 100px; }
  .bewerkrij.tweeregels .rijmeta{ flex:1 1 100%; padding-left:52px; }
  .bewerkrij + .bewerkrij{ border-top:1px solid var(--scheiding); }
  .bewerkrij.sleept{ position:relative; z-index:3; box-shadow: 0 12px 26px rgba(0,0,0,.16); background: rgba(255,255,255,.7); }

    font-weight:800; font-size:11.5px; letter-spacing:.6px; text-transform:uppercase;

  /* ------------------------------------------------------------ assistent --- */

  .bezigvak{
    text-align:center; padding:34px 12px; line-height:1.4;
    font-family: var(--baloo); font-weight:800; color: var(--inkt-zacht);

  /* ------------------------------------------------------------ verversen --- */
  .trek{
    position:fixed; top:calc(env(safe-area-inset-top) + 6px); left:50%; margin-left:-18px;
    width:36px; height:36px; border-radius:50%; z-index:50;
    background: rgba(255,255,255,.85); box-shadow:0 6px 18px rgba(0,0,0,.14);
    display:flex; align-items:center; justify-content:center;
    color: var(--oranje-diep); font-size:19px; opacity:0; pointer-events:none;
  }
  .trek.terug{ transition: transform .28s ease, opacity .28s ease; }
  .trek.bezig .trekicoon{ animation: draai .8s linear infinite; }
  @keyframes draai{ to{ transform: rotate(360deg); } }

  @media (max-width:360px){
    :root{ --gootje: 16px; }
    .rondjes{ --rond:34px; --gezicht:30px; --teken:19px; }

  /* Zodra er ruimte is: vijf kaartjes op een rij, en alles een maatje groter. */
  @media (min-width:700px){

    .taakkaart{ gap:6px; padding:10px 10px 10px; min-height:172px; }

    .rondjes{ --rond:50px; --gezicht:44px; --teken:27px; }
  }

  /* Breed: de titel, de schakelaar en het menu op één regel, en het weekritme
     als kolom ernaast — even breed als het menu en er precies onder. */
  @media (min-width:1000px){
    :root{ --gootje: 26px; }
    .app{ padding-top: calc(env(safe-area-inset-top) + 22px); padding-bottom:40px; }

    .kop .segment{

      width:250px; margin:0;
    }
    .pagina{ max-width:640px; }
    #pg-ritme{ max-width:none; }
    .ritmelijf{ flex-direction:row; align-items:flex-start; gap:26px; }
    .ritmehoofd{ display:block; flex:1; min-width:0; }
    .ritmezij{ display:block; width:372px; flex:none; }
    /* Staat er niets in de agenda, dan verdwijnt de kolom en krijgen de
       kaartjes de volle breedte. */
    .ritmelijf:not(.met-zij) .ritmezij{ display:none; }
    .ritmelijf.met-zij .ritmehoofd{ padding-top:31px; }
    .ritmezij .blokkop{ margin-top:0; }
    /* In de kolom staan de blokken gewoon onder elkaar: de eerste ligt gelijk
       met de kaartjes ernaast, wat erna komt krijgt er ruimte boven. Morgen
       heeft daar geen streep nodig, die scheidt op een telefoon de stappen. */
    .ritmezij .agendablok.later{ padding-top:0; border-top:none; }
    .ritmezij .agendablok + .agendablok{ margin-top:22px; }
    .voortgang{ margin-top:0; }
    .tabbalk{
      position:static; width:372px; flex:none; max-width:none; margin:0;
      border-radius:26px; padding:4px;
    }
    .tabbalk button{ flex-direction:row; gap:7px; padding:8px 0; font-size:13.5px; }
    .tabbalk svg{ width:19px; height:19px; }
  }
</style>
</head>
<body>

<script>

// Firebase levert een lijst soms terug als object met nummers als sleutel; hier
// wordt allebei op dezelfde manier gelezen.
function lijstVan(waarde){
  if(Array.isArray(waarde)) return waarde.filter(x => x != null);
  if(waarde && typeof waarde === 'object'){
    return Object.keys(waarde).sort((a, b) => Number(a) - Number(b))
      .map(k => waarde[k]).filter(x => x != null);
  }
  return [];
}

function tekst(waarde, terugval = ''){
  const s = typeof waarde === 'string' ? waarde.trim() : '';
  return s || terugval;
}

function uurOf(waarde, terugval){
  const n = Number(waarde);
  return Number.isFinite(n) && n >= 0 && n <= 23 ? Math.floor(n) : terugval;
}

// De sleutel waaronder een vinkje in de database staat. Hangt aan de tekst van
// de stap, niet aan het volgnummer, zodat er een stap tussen kan zonder dat de
// vinkjes verschuiven.
function stapSleutel(step){
  return String((step && step.label) || '')
    .toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '') || 'stap';
}

function nieuwId(){ return 'p' + Math.random().toString(36).slice(2, 8); }

// Wat de app over een kind weet buiten naam en gezicht om: schoolgroep,
// voetbalteam, wat er verder nodig blijkt om een bericht te kunnen plaatsen.
function kenmerkenVan(waarde){
  const uit = {};
  Object.entries(waarde || {}).forEach(([k, v]) => {
    const sleutel = tekst(k), inhoud = tekst(v);
    if(sleutel && inhoud) uit[sleutel] = inhoud;
  });
  return uit;
}

function isDatum(waarde){ return /^\d{4}-\d{2}-\d{2}$/.test(tekst(waarde)); }

// Het uur uit een tijd zoals je hem opschrijft: '19:30', '8.00 – 8.15', '15u',
// of gewoon '19'. Het eerste uur telt; staat er niets bruikbaars, dan null.
function uurUitTijd(waarde){
  const t = tekst(waarde);
  const m = /(\d{1,2})\s*[:.uh]\s*(\d{2})?/i.exec(t) || /^\s*(\d{1,2})\s*$/.exec(t);
  if(!m) return null;
  const uur = Number(m[1]);
  return uur >= 0 && uur <= 23 ? uur : null;
}

// Hoort dit bij de avond? De tijd beslist; heeft het er geen, dan telt nog wat
// er vroeger met de hand is aangevinkt.
function naAvond(item, vanaf){
  // Staat alleen de eindtijd er, dan is dat het enige wat we weten.
  const uur = uurUitTijd(item && item.tijd) ?? uurUitTijd(item && item.tot);
  return uur === null || uur === undefined ? Boolean(item && item.avond) : uur >= vanaf;
}

function isAvond(item){ return naAvond(item, config.avondVanaf); }

// Een begintijd en een eindtijd, allebei optioneel. Stond er vroeger één veld
// met '8:00 – 8:15' in, dan gaat dat hier alsnog uit elkaar — maar alleen als
// beide helften ook echt een tijd zijn.
function tijden(ruw){
  let tijd = tekst(ruw && ruw.tijd);
  let tot = tekst(ruw && ruw.tot);
  if(!tot){
    const m = /^(.*?)\s*(?:–|—|-|tot|t\/m)\s*(.+)$/i.exec(tijd);
    if(m && uurUitTijd(m[1]) !== null && uurUitTijd(m[2]) !== null){
      tijd = m[1].trim();
      tot = m[2].trim();
    }
  }
  return { tijd, tot };
}

function tijdTekst(item){
  const van = tekst(item && item.tijd), tot = tekst(item && item.tot);
  if(van && tot) return `${van} – ${tot}`;
  return tot ? 'tot ' + tot : van;
}

function alsDatum(waarde){
  const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(tekst(waarde));
  return p ? new Date(Number(p[1]), Number(p[2]) - 1, Number(p[3])) : null;
}

// 'vr 4 sep' voor in een regel, 'vrijdag 4 september' als er ruimte is.
function kortDatum(waarde){
  const d = alsDatum(waarde);
  return d ? `${WEEKDAGEN[(d.getDay() + 6) % 7]} ${d.getDate()} ${MAANDEN[d.getMonth()].slice(0, 3)}` : '';
}

function langeDatum(waarde){
  const d = alsDatum(waarde);
  return d ? `${DAGNAMEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]}` : '';
}

function dagenVan(waarde){
  return lijstVan(waarde).map(d => String(d).trim().slice(0, 2).toLowerCase())
    .filter(d => DAGEN.includes(d));
}

// 'wie' is de lijst kinderen waar iets voor geldt. Leeg betekent: iedereen.
// Oudere gegevens gebruikten één 'persoon'; die wordt hier meegelezen.
function wieVan(item){
  const uit = lijstVan(item && item.wie).map(x => String(x));
  const enkel = tekst(item && item.persoon);
  if(!uit.length && enkel) uit.push(enkel);
  return uit;
}

function maakGroepen(waarde){
  const lijst = lijstVan(waarde);
  if(!lijst.length) return [];
  const gegroepeerd = lijst.some(item => item && (item.stappen !== undefined || item.groep !== undefined));
  const rauw = gegroepeerd ? lijst : [{ groep:'', tijd:'', stappen: lijst }];
  return rauw.map(item => ({
    groep: tekst(item && item.groep),
    tijd: tekst(item && item.tijd),
    stappen: lijstVan(item && item.stappen).map(s => ({
      icoon: tekst(s && s.icoon, '⭐'),
      label: tekst(s && s.label),
      dagen: dagenVan(s && s.dagen),
      // Een stap kan ook eenmalig zijn: dan telt alleen die datum.
      datum: isDatum(s && s.datum) ? tekst(s.datum) : '',
      wie: wieVan(s),
    })),
  }));
}

function aantalStappen(groepen){
  return groepen.reduce((n, g) => n + g.stappen.length, 0);
}

function routine(waarde, terugval){
  const groepen = maakGroepen(waarde);
  return aantalStappen(groepen) ? groepen : maakGroepen(terugval);
}

function overzichtItem(ruw){
  return {
    icoon: tekst(ruw && ruw.icoon, '📅'),
    tekst: tekst(ruw && ruw.tekst),
    ...tijden(ruw),
    dagen: dagenVan(ruw && ruw.dagen),
    wie: wieVan(ruw),
    avond: Boolean(ruw && ruw.avond),
  };
}

// Het overzicht was eerst per dag ingevuld, waardoor school vijf keer in de
// database stond. Het is nu één lijst waarin elk item zelf zijn dagen kent;
// een oude, per dag ingevulde tak wordt hier samengevoegd.
function overzichtLijst(waarde){
  if(Array.isArray(waarde) || !waarde || typeof waarde !== 'object'){
    return lijstVan(waarde).map(overzichtItem).filter(i => i.tekst);
  }
  const sleutels = Object.keys(waarde);
  const perDag = sleutels.length && sleutels.every(k => DAGEN.includes(String(k).trim().slice(0, 2).toLowerCase()));
  if(!perDag) return lijstVan(waarde).map(overzichtItem).filter(i => i.tekst);

  const uit = [];
  const gezien = new Map();
  DAGEN.forEach(() => {});
  WEEKDAGEN.forEach(dag => {
    lijstVan(waarde[dag]).forEach(ruw => {
      const item = overzichtItem(ruw);
      if(!item.tekst) return;
      const sleutel = [item.icoon, item.tekst, item.tijd, item.tot, item.wie.join('+'), item.avond].join('|');
      if(gezien.has(sleutel)){
        gezien.get(sleutel).dagen.push(dag);
        return;
      }
      item.dagen = [dag];
      gezien.set(sleutel, item);
      uit.push(item);
    });
  });
  // Staat iets op alle zeven dagen, dan is 'elke dag' hetzelfde en korter.
  uit.forEach(item => { if(item.dagen.length === 7) item.dagen = []; });
  return uit;
}

// Een bijzonderheid staat op één datum in plaats van op weekdagen: een
// verjaardag, een uitje, een dokter.
function eventItem(ruw){
  return {
    id: tekst(ruw && ruw.id) || nieuwId(),
    icoon: tekst(ruw && ruw.icoon, '🎉'),
    tekst: tekst(ruw && ruw.tekst),
    ...tijden(ruw),
    datum: /^\d{4}-\d{2}-\d{2}$/.test(tekst(ruw && ruw.datum)) ? tekst(ruw.datum) : '',
    wie: wieVan(ruw),
  };
}

function eventLijst(waarde){
  return lijstVan(waarde).map(eventItem).filter(e => e.tekst && e.datum)
    .sort((a, b) => a.datum.localeCompare(b.datum) || a.tijd.localeCompare(b.tijd));
}

function normaliseer(ruw){
  const bron = ruw || {};
  const mensen = lijstVan(bron.mensen).map((p, i) => ({
    id: tekst(p && p.id, 'p' + i),
    naam: tekst(p && p.naam, 'Naamloos'),
    emoji: tekst(p && p.emoji, '🙂'),
    kleur: tekst(p && p.kleur, KLEUREN[i % KLEUREN.length]),
    kenmerken: kenmerkenVan(p && p.kenmerken),
  }));
  const uit = {
    titel: tekst(bron.titel, STANDAARD.titel),
    avondVanaf: uurOf(bron.avondVanaf, STANDAARD.avondVanaf),
    mensen: mensen.length ? mensen : STANDAARD.mensen.map(p => ({ ...p })),
    dag: routine(bron.dag, STANDAARD.dag),
    nacht: routine(bron.nacht, STANDAARD.nacht),
    overzicht: overzichtLijst(bron.overzicht),
    events: eventLijst(bron.events),
  };
  // Een verwijzing naar een kind dat er niet meer is telt niet mee; blijft er
  // niemand over, dan geldt het weer voor iedereen.
  const bestaat = new Set(uit.mensen.map(p => p.id));
  const schoon = w => w.filter(id => bestaat.has(id));
  ['dag','nacht'].forEach(r => uit[r].forEach(g => g.stappen.forEach(s => { s.wie = schoon(s.wie); })));
  uit.overzicht.forEach(i => { i.wie = schoon(i.wie); });
  uit.events.forEach(i => { i.wie = schoon(i.wie); });
  return uit;
}

// Voor wie geldt deze stap? Leeg betekent iedereen.
function wieDoetMee(item){
  const gekozen = lijstVan(item && item.wie).map(id => persoonById(id)).filter(Boolean);
  return gekozen.length ? gekozen : config.mensen;
}

function heeftVink(r, stap, persoon){
  const set = done[r].get(stap);
  return Boolean(set && set.has(persoon));
}
function zetVink(r, stap, persoon, aan){
  const kaart = done[r];
  if(!kaart.has(stap)) kaart.set(stap, new Set());
  const set = kaart.get(stap);
  if(aan) set.add(persoon); else set.delete(persoon);
  if(!set.size) kaart.delete(stap);
}

function datumTekst(d){

// ---------------------------------------------------------------- opslag ---
// Alles loopt via /api/opslag op dezelfde Worker die deze pagina uitserveert.
// Daar staat één huis met twee soorten gegevens: 'inhoud' is wat je in de app
// bewerkt, en per datum staat wie welke stap heeft afgevinkt. Een eigen sleutel
// per dag betekent dat het ritme 's ochtends vanzelf leeg begint.
//
// En er blijft een WebSocket open. Wie iets afvinkt schrijft het naar het huis,
// en iedereen die openstaat hoort het meteen — geen gepoll, en geen verschil
// meer tussen de browser en de app op een telefoon.
const API = '/api/opslag';
const opslag = { datum:'', stroom:null, pogingen:0, wachten:null };

function datumVan(d){
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function vandaag(){ return datumVan(new Date()); }

// De sleutel waaronder een vinkje staat: '<ritme>/<stap>/<persoon>'.
function vinkSleutel(r, stap, persoon){ return `${r}/${stap}/${persoon}`; }

async function apiHaal(pad, vragen){
  const u = new URL(API + pad, location.href);
  Object.entries(vragen || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  const res = await fetch(u, { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

async function apiStuur(pad, wijze, lijf){
  const res = await fetch(API + pad, {
    method: wijze,
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(lijf),
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json().catch(() => null);
}

function alsPlat(){
  const uit = { datum: opslag.datum, dag:{}, nacht:{} };
  ['dag','nacht'].forEach(r => done[r].forEach((set, stap) => { uit[r][stap] = [...set]; }));
  return uit;
}

function bewaarLokaal(){

}

function laadLokaal(){
  try{
    const r = JSON.parse(localStorage.getItem('dagritme-vinkjes') || 'null');
    if(!r || r.datum !== opslag.datum) return;
    ['dag','nacht'].forEach(naam => {
      const kaart = new Map();
      Object.entries(r[naam] || {}).forEach(([stap, personen]) => {
        const set = new Set(lijstVan(personen));
        if(set.size) kaart.set(stap, set);
      });
      done[naam] = kaart;
    });
  }catch(err){ /* onleesbaar: begin leeg */ }
}

function bewaarLokaalConfig(ruw){

}
function laadLokaalConfig(){
  try{ return JSON.parse(localStorage.getItem('dagritme-config') || 'null'); }
  catch(err){ return null; }
}

async function schrijfVink(r, stap, persoon, aan){
  bewaarLokaal();

async function wisRitme(r){

async function bewaarConfigOpAfstand(ruw){

}

// De vinkjes komen als platte sleutels binnen; hier worden het weer de kaarten
// waar de rest van de app mee werkt.
function vulVinkjes(vinkjes){
  done = { dag: new Map(), nacht: new Map() };
  Object.keys(vinkjes || {}).forEach(sleutel => {
    const [r, stap, persoon] = String(sleutel).split('/');
    if(done[r] && stap && persoon) zetVink(r, stap, persoon, true);
  });
  bewaarLokaal();
}

function pasConfigToe(ruw){
  if(!ruw) return false;
  config = normaliseer(ruw);
  bewaarLokaalConfig(ruw);
  toepassen();
  return true;
}

async function haalConfig(){
  try{
    const uit = await apiHaal('/inhoud');
    return (uit && uit.inhoud) || null;
  }catch(err){ return null; }
}

async function haalVinkjes(){

// ----------------------------------------------------------------- stroom ---
function stroomAdres(){
  const u = new URL(API + '/stroom', location.href);
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  u.searchParams.set('datum', opslag.datum);
  return u.toString();
}

function verwerkBericht(b){
  if(!b || typeof b !== 'object') return;
  if(b.soort === 'begin'){
    if(b.inhoud) pasConfigToe(b.inhoud);
    vulVinkjes(b.vinkjes);
    render();
    return;
  }
  if(b.soort === 'inhoud'){
    if(b.inhoud) pasConfigToe(b.inhoud);
    return;
  }
  if(b.soort === 'vink'){
    const [r, stap, persoon] = String(b.sleutel || '').split('/');
    if(!done[r] || !stap || !persoon) return;
    zetVink(r, stap, persoon, Boolean(b.aan));
    bewaarLokaal();
    render();
    return;
  }
  if(b.soort === 'ritme'){
    if(!done[b.ritme]) return;
    done[b.ritme] = new Map();
    bewaarLokaal();
    render();
  }
}

// Blijft zichzelf opnieuw verbinden zolang de pagina openstaat: een telefoon die
// uit zijn slaap komt heeft geen verbinding meer, en dat merk je pas als je het
// probeert.
function luister(){
  if(typeof WebSocket === 'undefined') return;
  let ws;
  try{ ws = new WebSocket(stroomAdres()); }
  catch(err){ return opnieuwVerbinden(); }
  opslag.stroom = ws;
  ws.onopen = () => { opslag.pogingen = 0; };
  ws.onmessage = e => {
    try{ verwerkBericht(JSON.parse(e.data)); }
    catch(err){ /* geen json */ }
  };
  ws.onclose = () => { if(opslag.stroom === ws) opslag.stroom = null; opnieuwVerbinden(); };
  ws.onerror = () => { /* onclose komt erachteraan */ };
}

function opnieuwVerbinden(){
  if(opslag.wachten) return;
  // Rustig aan als het blijft mislukken, maar nooit langer dan een halve minuut.
  const pauze = Math.min(1000 * 2 ** opslag.pogingen, 30000);
  opslag.pogingen += 1;
  opslag.wachten = setTimeout(() => { opslag.wachten = null; luister(); }, pauze);
}

function bewaakDatum(){
  setInterval(() => {
    if(vandaag() === opslag.datum) return;
    opslag.datum = vandaag();
    done = { dag: new Map(), nacht: new Map() };
    bewaarLokaal();
    toepassen();
    // De stroom kijkt mee naar de nieuwe dag.
    if(opslag.stroom && opslag.stroom.readyState === 1){
      opslag.stroom.send(JSON.stringify({ soort:'dag', datum: opslag.datum }));
    }
  }, 30000);
}

async function startOpslag(){
  opslag.datum = vandaag();
  laadLokaal();
  render();

  const ruw = await haalConfig();
  if(ruw) pasConfigToe(ruw);
  else {
    // Nog niets in het huis: het huidige ritme wordt het zaadje.
    try{ await bewaarConfigOpAfstand(opgeschoond(alsRuweConfig())); }
    catch(err){ console.warn('kon de inhoud niet bewaren:', err); }
  }
  const vinkjes = await haalVinkjes();
  if(vinkjes) { vulVinkjes(vinkjes); render(); }

  luister();
  bewaakDatum();
}

function alsRuweConfig(){
  return JSON.parse(JSON.stringify({
    titel: config.titel,
    avondVanaf: config.avondVanaf,
    mensen: config.mensen,
    dag: config.dag,
    nacht: config.nacht,
    overzicht: config.overzicht,
    events: config.events,
  }));
}

function el(tag, klasse, inhoud){

}

function svgPijl(){

  s.setAttribute('width', '9'); s.setAttribute('height', '15'); s.setAttribute('viewBox', '0 0 9 15');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M1.5 1.5 7 7.5l-5.5 6');
  s.appendChild(p);
  return s;
}

function svgGreep(){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('width', '18'); s.setAttribute('height', '18'); s.setAttribute('viewBox', '0 0 18 18');
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '1.8'); s.setAttribute('stroke-linecap', 'round');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', 'M3 6h12M3 9.5h12M3 13h12');
  s.appendChild(p);
  return s;
}

// Een kleur als 'rgba(r,g,b,a)' — voor de zachte vulling achter een gezicht.
function zacht(hex, alpha){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if(!m) return `rgba(43,45,66,${alpha})`;
  const n = parseInt(m[1], 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
}

// ---------------------------------------------------------------- ritme ----
function opDeze(item, d){
  if(item.datum) return item.datum === datumVan(d);
  if(!item.dagen || !item.dagen.length) return true;
  return item.dagen.includes(DAGEN[d.getDay()]);
}

function zichtbareGroepen(){
  const nu = new Date();
  return config[ritme]
    .map(g => ({ groep:g.groep, tijd:g.tijd, stappen: g.stappen.filter(s => s.label && opDeze(s, nu)) }))
    .filter(g => g.stappen.length);
}

function maakRondje(stap, persoon){
  const sleutel = stapSleutel(stap);
  const b = knop('rondje');
  b.setAttribute('aria-label', `${stap.label} — ${persoon.naam}`);
  const aan = heeftVink(ritme, sleutel, persoon.id);
  b.setAttribute('aria-pressed', aan ? 'true' : 'false');

  const ring = el('div', 'ring');
  const gezicht = el('div', 'gezicht', persoon.emoji);
  gezicht.style.background = zacht(persoon.kleur, .16);
  ring.appendChild(gezicht);
  b.appendChild(ring);
  b.addEventListener('click', () => {
    const nieuw = b.getAttribute('aria-pressed') !== 'true';
    zetVink(ritme, sleutel, persoon.id, nieuw);
    render();
    schrijfVink(ritme, sleutel, persoon.id, nieuw);
  });
  return b;
}

function tekenVoortgang(groepen){
  voortgangEl.innerHTML = '';
  const stappen = groepen.flatMap(g => g.stappen);
  if(!stappen.length || !config.mensen.length){ voortgangEl.hidden = true; return; }
  voortgangEl.hidden = false;
  voortgangEl.classList.toggle('velen', config.mensen.length > 2);

  config.mensen.forEach(persoon => {
    const van = stappen.filter(s => wieDoetMee(s).some(p => p.id === persoon.id));
    const klaar = van.filter(s => heeftVink(ritme, stapSleutel(s), persoon.id)).length;

    const vak = el('div', 'vperson');
    const bol = el('div', 'vbol', persoon.emoji);
    bol.style.background = zacht(persoon.kleur, .16);

    const tekstvak = el('div', 'vtekst');
    const regel = el('div', 'vregel');
    regel.append(el('span', 'vnaam', persoon.naam),
                 el('span', 'vtelling', `${klaar}/${van.length}`));
    const balk = el('div', 'vbalk');
    const vul = el('span');
    vul.style.width = van.length ? Math.round(klaar / van.length * 100) + '%' : '0%';
    vul.style.background = persoon.kleur;
    balk.appendChild(vul);
    tekstvak.append(regel, balk);

    vak.append(bol, tekstvak);
    voortgangEl.appendChild(vak);
  });
}

function tekenRitme(){
  const groepen = zichtbareGroepen();
  tekenVoortgang(groepen);
  groepenEl.innerHTML = '';

  if(!groepen.length){
    const leeg = el('div', 'leegkaart glas', 'Nog geen stappen. Voeg ze toe bij Instellingen.');
    groepenEl.appendChild(leeg);
    return;
  }

  groepen.forEach(groep => {
    if(groep.groep || groep.tijd){
      const kop = el('div', 'groepkop');
      kop.append(el('div', 'groepnaam', groep.groep), el('div', 'groeptijd', groep.tijd));
      groepenEl.appendChild(kop);
    }
    const raster = el('div', 'kaartraster');
    groep.stappen.forEach(stap => {
      const kaart = el('div', 'taakkaart glas');

// Naast de stappen (of eronder op een telefoon) staat wat er die dag verder is:
// 's ochtends vandaag, 's avonds wat er vanavond nog komt en wat morgen wacht.
function ritmeBlokken(){
  const nu = new Date();
  const van = d => itemsVan(d).filter(i => !isAvond(i));
  if(ritme !== 'nacht'){
    return [{ kop:'Vandaag', items: van(nu) }];
  }
  const morgen = new Date(nu);
  morgen.setDate(morgen.getDate() + 1);
  return [
    { kop:'Vanavond', items: itemsVan(nu).filter(isAvond) },
    { kop:'Morgen', items: van(morgen), later:true },
  ];
}

function tekenRitmeAgenda(){
  const blokken = ritmeBlokken().filter(b => b.items.length);
  ritmeagendaEl.innerHTML = '';
  blokken.forEach(b => ritmeagendaEl.appendChild(maakAgendaBlok(b)));
  ritmelijfEl.classList.toggle('met-zij', blokken.length > 0);
}

// ------------------------------------------------------------- overzicht ---
function weekVan(d, weken = 0){
  const begin = new Date(d);
  const verschuiving = (begin.getDay() + 6) % 7;      // maandag als eerste dag
  begin.setDate(begin.getDate() - verschuiving + weken * 7);
  begin.setHours(0, 0, 0, 0);
  return Array.from({ length: 7 }, (_, i) => {
    const dag = new Date(begin);
    dag.setDate(begin.getDate() + i);
    return dag;
  });
}

// De gekozen dag, of anders vandaag zolang die in beeld is; in een andere week
// de maandag.
function overzichtDatum(){
  const week = weekVan(new Date(), weekVerschuiving);
  const gekozen = gekozenDag && week.find(d => datumVan(d) === gekozenDag);
  if(gekozen) return gekozen;
  const vandaagStr = vandaag();
  return week.find(d => datumVan(d) === vandaagStr) || week[0];
}

// Een week verder of terug, op dezelfde weekdag als waar je stond.
function schuifWeek(weken){
  const nieuw = new Date(overzichtDatum());
  nieuw.setDate(nieuw.getDate() + weken * 7);
  weekVerschuiving += weken;
  gekozenDag = datumVan(nieuw);
  toepassen();
}

function weekPijl(richting, titel){
  const b = knop('weekpijl');
  b.setAttribute('aria-label', titel);
  b.title = titel;
  const pijl = svgPijl();
  if(richting < 0) pijl.style.transform = 'rotate(180deg)';
  b.appendChild(pijl);
  b.addEventListener('click', () => schuifWeek(richting));
  return b;
}

function tekenWeekstrip(){
  const nu = new Date();
  const gekozen = overzichtDatum();
  weekstripEl.innerHTML = '';
  weekstripEl.appendChild(weekPijl(-1, 'Vorige week'));
  weekVan(nu, weekVerschuiving).forEach(d => {
    const sleutel = DAGEN[d.getDay()];
    const b = knop('');
    if(datumVan(d) === datumVan(nu)) b.classList.add('vandaag');
    if(datumVan(d) === datumVan(gekozen)) b.classList.add('aan');
    b.append(el('span', 'wletter', DAGLETTERS[sleutel]),
             el('span', 'wdag', String(d.getDate())));
    b.setAttribute('aria-label', datumTekst(d));
    b.addEventListener('click', () => { gekozenDag = datumVan(d); toepassen(); });
    weekstripEl.appendChild(b);
  });
  weekstripEl.appendChild(weekPijl(1, 'Volgende week'));
}

function itemsVan(d){
  const dag = DAGEN[d.getDay()];
  const datum = datumVan(d);
  // Wat er die dag bijzonder is staat bovenaan; daaronder het vaste weekritme.
  const bijzonder = lijstVan(config.events).filter(e => e.datum === datum)
    .map(e => ({ ...e, dagen:[], bijzonder:true }));
  const week = lijstVan(config.overzicht).filter(i => !i.dagen.length || i.dagen.includes(dag));
  return bijzonder.concat(week);
}

// Alleen de gekozen dag; morgen is hier één tik verder in de strip.
function agendaBlokken(){
  const gekozen = overzichtDatum();
  const isVandaag = datumVan(gekozen) === vandaag();
  return [
    { kop:'Overdag', items: itemsVan(gekozen).filter(i => !isAvond(i)) },
    { kop: isVandaag ? 'Vanavond' : "'s Avonds", items: itemsVan(gekozen).filter(isAvond) },
  ].filter(b => b.items.length);
}

function maakAgendaRij(item, opOpenen){
  const rij = opOpenen ? knop('agendarij') : el('div', 'agendarij');
  if(item.bijzonder) rij.classList.add('bijzonder');
  if(opOpenen) rij.addEventListener('click', () => opOpenen(item));
  const tekstvak = el('div', 'agendatekst');
  tekstvak.appendChild(el('div', 'agendanaam', item.tekst));

  const meta = el('div', 'agendameta');
  const gekozen = lijstVan(item.wie).map(id => persoonById(id)).filter(Boolean);
  if(gekozen.length && gekozen.length < config.mensen.length){
    gekozen.forEach(p => {
      const merk = el('span', 'merk');
      merk.style.background = p.kleur;
      merk.append(el('i', '', p.emoji), document.createTextNode(p.naam));
      meta.appendChild(merk);
    });
  }
  const wanneer = tijdTekst(item);
  if(wanneer) meta.appendChild(el('div', 'agendatijd', wanneer));
  if(meta.childNodes.length) tekstvak.appendChild(meta);

  rij.append(el('div', 'agendaicoon', item.icoon), tekstvak);
  return rij;
}

// Eén blok met een kopje en een kaart eronder — zowel naast de stappen als op
// de overzichtpagina. 'later' zet Morgen op een telefoon onder de stappen.
function maakAgendaBlok(blok, opOpenen){
  const vak = document.createElement('section');
  vak.className = 'agendablok' + (blok.later ? ' later' : '');
  vak.appendChild(el('div', 'blokkop', blok.kop));
  const kaart = el('div', 'kaart glas');
  blok.items.forEach((item, i) => {
    if(i) kaart.appendChild(el('div', 'streep'));
    kaart.appendChild(maakAgendaRij(item, item.bijzonder ? opOpenen : null));
  });
  vak.appendChild(kaart);
  return vak;
}

function render(){
  if(pagina === 'ritme') tekenRitme();
  else if(pagina === 'overzicht') tekenOverzicht();
  else tekenInstellingen();
}

function toepassen(){
  document.title = config.titel;
  const isNacht = ritme === 'nacht';
  document.body.classList.toggle('nacht', isNacht && pagina === 'ritme');
  document.querySelector('meta[name="theme-color"]')
    .setAttribute('content', isNacht && pagina === 'ritme' ? '#10122F' : '#FFF6E9');

  if(pagina === 'ritme'){
    paginatitelEl.textContent = isNacht ? 'Avond' : 'Ochtend';
    paginadatumEl.textContent = datumTekst(new Date());
  }else if(pagina === 'overzicht'){
    paginatitelEl.textContent = 'Deze week';
    paginadatumEl.textContent = datumTekst(overzichtDatum());
  }else{
    paginatitelEl.textContent = 'Instellingen';
    paginadatumEl.textContent = config.titel;
  }

  segmentEl.hidden = pagina !== 'ritme';
  $('pg-ritme').hidden = pagina !== 'ritme';
  $('pg-overzicht').hidden = pagina !== 'overzicht';
  $('pg-instellingen').hidden = pagina !== 'instellingen';
  segmentEl.querySelectorAll('button').forEach(b =>
    b.classList.toggle('aan', b.dataset.ritme === ritme));
  tabbalkEl.querySelectorAll('button').forEach(b =>
    b.classList.toggle('aan', b.dataset.pagina === pagina));
  render();
}

function zetRitme(nieuw){ ritme = nieuw; toepassen(); }
function zetPagina(nieuw){
  pagina = nieuw;
  if(nieuw === 'overzicht'){ gekozenDag = null; weekVerschuiving = 0; }
  window.scrollTo(0, 0);
  toepassen();
}

function beginRitme(){

}

// ------------------------------------------------------------- verslepen ---
// De greep verplaatst een regel binnen zijn eigen kaart. Tijdens het slepen
// schuiven de andere regels mee, zodat je ziet waar hij terechtkomt.
function maakSleepbaar(vak, lijst, klaar){
  vak.querySelectorAll('.greep').forEach(greep => {
    greep.addEventListener('pointerdown', e => {
      const rij = greep.closest('.bewerkrij');
      const rijen = [...vak.querySelectorAll('.bewerkrij')];
      const van = rijen.indexOf(rij);
      if(van < 0) return;
      e.preventDefault();
      const hoogtes = rijen.map(r => r.offsetHeight);
      const startY = e.clientY;
      let naar = van;
      rij.classList.add('sleept');

      const beweeg = ev => {
        const dy = ev.clientY - startY;
        rij.style.transform = `translateY(${dy}px)`;
        let n = van;
        if(dy > 0){
          let op = 0;
          for(let i = van + 1; i < rijen.length; i++){
            op += hoogtes[i];
            if(dy > op - hoogtes[i] / 2) n = i;
          }
        }else{
          let op = 0;
          for(let i = van - 1; i >= 0; i--){
            op += hoogtes[i];
            if(-dy > op - hoogtes[i] / 2) n = i;
          }
        }
        if(n === naar) return;
        naar = n;
        rijen.forEach((r, i) => {
          if(i === van) return;
          let ver = 0;
          if(naar > van && i > van && i <= naar) ver = -hoogtes[van];
          if(naar < van && i >= naar && i < van) ver = hoogtes[van];
          r.style.transform = ver ? `translateY(${ver}px)` : '';
        });
      };
      const stop = () => {
        document.removeEventListener('pointermove', beweeg);
        document.removeEventListener('pointerup', stop);
        document.removeEventListener('pointercancel', stop);
        rijen.forEach(r => { r.style.transform = ''; r.classList.remove('sleept'); });
        if(naar !== van) lijst.splice(naar, 0, lijst.splice(van, 1)[0]);
        klaar();
      };
      document.addEventListener('pointermove', beweeg);
      document.addEventListener('pointerup', stop);
      document.addEventListener('pointercancel', stop);
    });
  });
}

// reden in beeld, bijvoorbeeld omdat het opslaan mislukte.
async function sluitFormulier(bewaar){
  if(bewaar && formKlaar && await formKlaar(formGegevens) === false) return;
  formScrimEl.hidden = true;
  formEl.hidden = true;
  formGegevens = null; formTeken = null; formKlaar = null;
  toonFormMelding('');
}

function formKop(tekstje){ return el('div', 'formkop', tekstje); }

function dagenKiezer(gegevens){
  gegevens.dagen = lijstVan(gegevens.dagen);
  const rij = el('div', 'chips dagen glas');
  WEEKDAGEN.forEach(dag => {
    rij.appendChild(chip(dag, gegevens.dagen.includes(dag), () => {
      const i = gegevens.dagen.indexOf(dag);
      if(i >= 0) gegevens.dagen.splice(i, 1); else gegevens.dagen.push(dag);
      tekenFormulier();
    }));
  });
  return rij;
}

// In het bewerkscherm zijn de kinderen die van het concept; op de weekpagina
// die van de inhoud zelf.
function bewerkMensen(){ return concept ? concept.mensen : config.mensen; }

function wieKiezer(gegevens){
  gegevens.wie = lijstVan(gegevens.wie);
  const rij = el('div', 'chips glas');
  rij.appendChild(chip('iedereen', !gegevens.wie.length, () => { gegevens.wie = []; tekenFormulier(); }));
  bewerkMensen().forEach(persoon => {
    const aan = gegevens.wie.includes(persoon.id);

      tekenFormulier();
    }, persoon.kleur));
  });

}


// In het bewerkscherm is de bron het concept; op de weekpagina de inhoud zelf.
function bewerkBron(){ return concept || config; }

// ---------------------------------------------------------------- één ding ---
// Alles in deze app is hetzelfde ding met twee schakelaars: herhaalt het zich of
// geldt het één dag, en is het een taak of iets voor de agenda. Die vier
// combinaties zijn precies de vier plekken waar iets kan staan:
//
//            herhalen             één keer
//   agenda   weekritme            een regel bij Vandaag
//   taak     stap met dagen       stap met een datum
//
// Eén formulier dus, en elk scherm opent het met een andere beginstand.
function dingFormulier(gegevens, opWeg){
  const stuk = document.createDocumentFragment();
  const regel = el('div', 'formregel');
  regel.append(
    emojiKnop(gegevens.icoon, 'Icoon', v => { gegevens.icoon = v; tekenFormulier(); }),
    veld(gegevens.tekst, 'Wat is er', '', v => { gegevens.tekst = v; }),
  );
  stuk.append(formKop('Icoon en naam'), regel);

  const vaak = el('div', 'chips glas');
  [[true, '🔁 herhalen'], [false, '📌 één keer']].forEach(([waarde, label]) => {
    vaak.appendChild(chip(label, Boolean(gegevens.wekelijks) === waarde, () => {
      gegevens.wekelijks = waarde;
      tekenFormulier();
    }));
  });
  stuk.append(formKop('Hoe vaak'), vaak);

  if(gegevens.wekelijks){
    stuk.append(formKop('Op welke dagen'), dagenKiezer(gegevens));
    if(!gegevens.dagen.length) stuk.appendChild(el('div', 'notitie', 'Geen dag gekozen betekent: elke dag.'));
  }else{
    const wanneer = el('div', 'formregel');
    const datum = veld(gegevens.datum, '', 'datum', v => { gegevens.datum = v; });
    datum.type = 'date';
    wanneer.appendChild(datum);
    stuk.append(formKop('Op welke dag'), wanneer);
  }

  const soort = el('div', 'chips glas');
  [[true, '✅ taak'], [false, '🗓️ agenda']].forEach(([waarde, label]) => {
    soort.appendChild(chip(label, Boolean(gegevens.taak) === waarde, () => {
      gegevens.taak = waarde;
      if(waarde && !tekst(gegevens.groep)) gegevens.groep = eersteGroepnaam(bewerkBron(), gegevens.ritme);
      tekenFormulier();
    }));
  });
  stuk.append(formKop('Wat voor iets'), soort);

  if(gegevens.taak){
    const bron = bewerkBron();
    const welk = el('div', 'chips glas');
    [['dag','☀️ ochtend'], ['nacht','🌙 avond']].forEach(([waarde, label]) => {
      welk.appendChild(chip(label, gegevens.ritme === waarde, () => {
        gegevens.ritme = waarde;
        gegevens.groep = eersteGroepnaam(bron, waarde);
        tekenFormulier();
      }));
    });
    stuk.append(formKop('In welk ritme'), welk);

    const kiezer = el('div', 'chips glas');
    lijstVan(bron[gegevens.ritme]).filter(g => tekst(g.groep)).forEach(g =>
      kiezer.appendChild(chip(g.groep, gegevens.groep === g.groep, () => {
        gegevens.groep = g.groep;
        tekenFormulier();
      })));
    stuk.append(formKop('Bij welk onderdeel'), kiezer);
    stuk.appendChild(el('div', 'notitie',
      'Een taak wordt een kaartje tussen de stappen, met een rondje per kind om af te vinken. '
      + 'Een taak heeft geen eigen tijd — die hoort bij het onderdeel waar hij in staat.'));
  }else{
    // De uitleg loopt mee met wat je typt: de tijd bepaalt Overdag of Vanavond.
    const tijdnotitie = el('div', 'notitie', tijduitleg(gegevens));
    stuk.append(formKop('Hoe laat'), tijdregel(gegevens, () => {
      tijdnotitie.textContent = tijduitleg(gegevens);
    }), tijdnotitie);
  }

  stuk.append(formKop('Voor wie'), wieKiezer(gegevens));

  if(opWeg){
    const weg = knop('verwijderknop', 'Verwijderen');
    weg.addEventListener('click', opWeg);
    stuk.appendChild(weg);
  }
  return stuk;
}

function eersteGroepnaam(bron, ritme){
  const groepen = lijstVan(bron[ritme === 'nacht' ? 'nacht' : 'dag']).filter(g => tekst(g.groep));
  return groepen.length ? tekst(groepen[groepen.length - 1].groep) : '';
}

// Waar iets staat, in één beschrijving: 'overzicht' en 'event' wijzen een regel
// aan, 'stap' een kaartje in een onderdeel.
function dingVan(plek){
  const bron = bewerkBron();
  const leeg = { icoon:'📅', tekst:'', wekelijks:true, taak:false, dagen:[], datum: vandaag(),
                 tijd:'', tot:'', wie:[], ritme:'dag', groep: eersteGroepnaam(bron, 'dag') };
  if(!plek) return leeg;
  if(plek.waar === 'stap'){
    const stap = plek.stap;
    return { ...leeg,
      icoon: stap.icoon, tekst: stap.label, taak: true,
      wekelijks: !isDatum(stap.datum),
      dagen: lijstVan(stap.dagen), datum: isDatum(stap.datum) ? stap.datum : leeg.datum,
      wie: lijstVan(stap.wie), ritme: plek.ritme, groep: tekst(plek.groep.groep) };
  }
  const item = plek.item;
  return { ...leeg,
    icoon: item.icoon, tekst: item.tekst, taak: false,
    wekelijks: plek.waar === 'overzicht',
    dagen: lijstVan(item.dagen), datum: isDatum(item.datum) ? item.datum : leeg.datum,
    tijd: tekst(item.tijd), tot: tekst(item.tot), wie: lijstVan(item.wie) };
}

// Geeft terug waar het vandaan kwam, zodat het op dezelfde plek in de lijst
// terug kan; anders springt alles wat je bewerkt naar onderen.
function haalDingWeg(bron, plek){
  if(!plek) return null;
  if(plek.waar === 'stap'){
    let vanaf = null;
    lijstVan(bron[plek.ritme]).forEach(groep => {
      const stappen = lijstVan(groep.stappen);
      const i = stappen.indexOf(plek.stap);
      if(i >= 0){
        vanaf = { waar:'stap', groep, index:i };
        groep.stappen = stappen.filter(x => x !== plek.stap);
      }else{
        groep.stappen = stappen;
      }
    });
    return vanaf;
  }
  if(plek.waar === 'event'){
    const lijst = lijstVan(bron.events);
    const i = lijst.findIndex(e => e.id === plek.item.id);
    bron.events = lijst.filter(e => e.id !== plek.item.id);
    return i >= 0 ? { waar:'event', index:i } : null;
  }
  const lijst = lijstVan(bron.overzicht);
  const i = lijst.indexOf(plek.item);
  bron.overzicht = lijst.filter(x => x !== plek.item);
  return i >= 0 ? { waar:'overzicht', index:i } : null;
}

// Terug op zijn oude plek als het in dezelfde lijst blijft, anders achteraan.
function voegIn(lijst, nieuw, vanaf, zelfdeLijst){
  const uit = lijstVan(lijst);
  if(vanaf && zelfdeLijst) uit.splice(Math.min(vanaf.index, uit.length), 0, nieuw);
  else uit.push(nieuw);
  return uit;
}

function zetDingNeer(bron, g, id, vanaf){
  if(g.taak){
    const groepen = bron[g.ritme] = lijstVan(bron[g.ritme]);
    let doel = groepen.find(x => tekst(x.groep) === tekst(g.groep)) || groepen[groepen.length - 1];
    if(!doel){
      doel = { groep: tekst(g.groep, 'Erbij'), tijd:'', stappen:[] };
      groepen.push(doel);
    }
    doel.stappen = voegIn(doel.stappen, {
      icoon: tekst(g.icoon, '⭐'), label: tekst(g.tekst),
      dagen: g.wekelijks ? dagenVan(g.dagen) : [],
      datum: g.wekelijks ? '' : tekst(g.datum),
      wie: lijstVan(g.wie),
    }, vanaf, vanaf && vanaf.waar === 'stap' && vanaf.groep === doel);
    return;
  }
  if(g.wekelijks){
    bron.overzicht = voegIn(bron.overzicht, {
      icoon: tekst(g.icoon, '📅'), tekst: tekst(g.tekst),
      tijd: tekst(g.tijd), tot: tekst(g.tot),
      dagen: dagenVan(g.dagen), wie: lijstVan(g.wie),
    }, vanaf, vanaf && vanaf.waar === 'overzicht');
    return;
  }
  bron.events = voegIn(bron.events, {
    id: id || nieuwId(),
    icoon: tekst(g.icoon, '🎉'), tekst: tekst(g.tekst),
    tijd: tekst(g.tijd), tot: tekst(g.tot),
    datum: tekst(g.datum), wie: lijstVan(g.wie),
  }, vanaf, vanaf && vanaf.waar === 'event');
}

// Eerst weghalen waar het stond, dan neerzetten waar het nu hoort. Zo is een
// weekregel die een kaartje wordt gewoon één beweging.
function verplaatsDing(bron, plek, g){
  if(!tekst(g.tekst)){
    toonFormMelding('Vul een naam in.');
    return false;
  }
  if(!g.wekelijks && !isDatum(g.datum)){
    toonFormMelding('Vul een datum in, of zet hem op herhalen.');
    return false;
  }
  const id = plek && plek.waar === 'event' ? plek.item.id : nieuwId();
  const vanaf = haalDingWeg(bron, plek);
  zetDingNeer(bron, g, id, vanaf);
  return true;
}

// Openen met een beginstand: welk scherm je ook gebruikt, het is hetzelfde blad.
function openDing(titel, plek, begin, bron, klaar, opWeg){
  openFormulier(titel, { ...dingVan(plek), ...begin }, g => dingFormulier(g, opWeg),
    g => {
      if(verplaatsDing(bron(), plek, g) === false) return false;
      return klaar();
    });
}



function eersteGroepnaam(bron, ritme){
  const groepen = lijstVan(bron[ritme]).filter(g => tekst(g.groep));
  return groepen.length ? tekst(groepen[groepen.length - 1].groep) : '';
}





// De tijd bepaalt of iets bij Overdag of bij Vanavond komt te staan; dat is
// beter uit te leggen dan het te laten zien nadat je hebt bewaard.
function tijduitleg(gegevens){
  const vanaf = (concept ? concept.avondVanaf : config.avondVanaf);
  const uur = uurUitTijd(gegevens.tijd);
  if(uur === null){
    return gegevens.avond
      ? `Zonder tijd blijft dit bij Vanavond staan, zoals het was. Vul een tijd in vanaf ${vanaf}:00 om dat zo te houden.`
      : `Zonder tijd komt dit bij Overdag te staan. Vanaf ${vanaf}:00 gaat het naar Vanavond.`;
  }
  return uur >= vanaf
    ? `Komt bij Vanavond te staan — dat begint om ${vanaf}:00.`
    : `Komt bij Overdag te staan; vanaf ${vanaf}:00 zou het Vanavond zijn.`;
}

// Begin en eind, allebei mag je leeglaten.
function tijdregel(gegevens, opWijzig){
  const rij = el('div', 'formregel');
  rij.append(
    veld(gegevens.tijd, 'van', 'tijd', v => { gegevens.tijd = v; if(opWijzig) opWijzig(); }),
    el('span', 'tijdstreep', '–'),
    veld(gegevens.tot, 'tot', 'tijd', v => { gegevens.tot = v; if(opWijzig) opWijzig(); }),
  );
  return rij;
}



// Vanaf de weekpagina bewerk je buiten het bewerkscherm om, dus gaat de hele
// inhoud in één keer weg.
function bewerkEvent(item){
  const plek = item ? { waar:'event', item } : null;
  const ruw = alsRuweConfig();
  openDing(item ? (item.tekst || 'Iets eenmaligs') : 'Iets eenmaligs', plek,
    item ? {} : { icoon:'🎉', wekelijks:false, taak:false, datum: datumVan(overzichtDatum()) },
    () => ruw,
    () => bewaarInhoud(ruw),
    item ? () => verwijderEvent(item.id) : null);
}

async function verwijderEvent(id){
  const ruw = alsRuweConfig();
  ruw.events = lijstVan(ruw.events).filter(e => e.id !== id);
  if(await bewaarInhoud(ruw) !== false) sluitFormulier(false);
}

async function bewaarInhoud(ruw, meld){
  const zeg = meld || toonFormMelding;
  const nieuw = opgeschoond(ruw);
  try{
    await bewaarConfigOpAfstand(nieuw);
  }catch(err){
    zeg('Opslaan lukte niet (' + err.message + ').');
    return false;
  }
  config = normaliseer(nieuw);
  bewaarLokaalConfig(nieuw);
  toepassen();
  return true;
}

function kindFormulier(gegevens){

    emojiKnop(gegevens.emoji, 'Gezicht', v => { gegevens.emoji = v; tekenFormulier(); }),
