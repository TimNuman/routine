// In het formulier is een kenmerk even een rijtje paren, zodat je de naam van
// het kenmerk net zo goed kunt aanpassen als de inhoud.
function kenmerkParen(gegevens){
  if(!Array.isArray(gegevens.kenmerkParen)){
    gegevens.kenmerkParen = Object.entries(kenmerkenVan(gegevens.kenmerken))
      .map(([sleutel, waarde]) => ({ sleutel, waarde }));
  }
  return gegevens.kenmerkParen;
}

function uitParen(paren){
  const uit = {};
  lijstVan(paren).forEach(paar => {
    const sleutel = tekst(paar && paar.sleutel), waarde = tekst(paar && paar.waarde);
    if(sleutel && waarde) uit[sleutel] = waarde;
  });
  return uit;
}

// ------------------------------------------------------------- assistent ---
// School, voetbal, judo en de bso sturen berichten; die wil je niet overtikken.
// Plak er een in en er komt een lijstje uit dat je met een tik overneemt.
// Weet de uitlezer iets niet — welk kind in 1-2B zit bijvoorbeeld — dan vraagt
// hij ernaar, en het antwoord blijft als kenmerk bij het kind staan, zodat het
// de volgende keer vanzelf goed gaat.
const assiEl = $('assistent');
const assiScrimEl = $('assiScrim');
const assiInhoudEl = $('assiinhoud');
const assiMeldingEl = $('assimelding');
const assiKnopEl = $('assiKnop');
const assiTitelEl = $('assititel');
const MAX_VRAGEN = 2;           // daarna raadt hij liever dan nog eens te vragen
let assi = null;

function toonAssiMelding(bericht){
  assiMeldingEl.textContent = bericht || '';
  assiMeldingEl.hidden = !bericht;
}

function openAssistent(){
  assi = { stap:'plakken', bericht:'', ronde:0, vragen:0, vraag:null,
           antwoord:{}, items:[], keuze:[] };
  toonAssiMelding('');
  assiScrimEl.hidden = false;
  assiEl.hidden = false;
  tekenAssistent();
}

function sluitAssistent(){
  assiScrimEl.hidden = true;
  assiEl.hidden = true;
  assi = null;
  toonAssiMelding('');
}

function tekenAssistent(){
  if(!assi) return;
  assiInhoudEl.innerHTML = '';
  assiKnopEl.disabled = false;
  if(assi.stap === 'vraag') return tekenAssiVraag();
  if(assi.stap === 'voorstellen') return tekenAssiVoorstellen();

  if(assi.stap === 'bezig'){
    assiTitelEl.textContent = 'Even lezen';
    assiInhoudEl.appendChild(el('div', 'bezigvak', 'Even kijken wat erin staat…'));
    assiKnopEl.textContent = 'Even lezen…';
    assiKnopEl.disabled = true;
    return;
  }
  if(assi.stap === 'niets'){
    assiTitelEl.textContent = 'Niets gevonden';
    assiInhoudEl.appendChild(el('div', 'bezigvak',
      'Hier kon ik niets uithalen dat in de app hoort. Probeer het wat concreter, of plak er meer bij.'));
    assiKnopEl.textContent = 'Opnieuw proberen';
    return;
  }

  assiTitelEl.textContent = 'Typ of plak iets';
  const vak = document.createElement('textarea');
  vak.className = 'plakvak';
  vak.placeholder = 'Plak een mail of appje, of typ het gewoon:\n\niedere dinsdag om 18:00 tennis Emma';
  vak.value = assi.bericht;
  vak.addEventListener('input', () => { assi.bericht = vak.value; });
  assiInhoudEl.append(formKop('De tekst'), vak);
  assiInhoudEl.appendChild(el('div', 'notitie',
    'Wat elke week terugkomt gaat naar het weekritme, wat één dag geldt naar Eenmalig. '
    + 'Er wordt ook meegedacht: bij een verjaardag hoort een cadeautje op tijd. '
    + 'Alleen wat je hier typt gaat mee, plus de voornamen van de kinderen.'));
  assiKnopEl.textContent = 'Lees uit';
}

function tekenAssiVraag(){
  const v = assi.vraag;
  assiTitelEl.textContent = 'Even iets vragen';
  assiInhoudEl.append(formKop('Vraag'), el('div', 'notitie', v.vraag));
  config.mensen.forEach(persoon => {
    const gekozen = lijstVan(assi.antwoord[persoon.id]);
    const vak = el('div', 'vraagkind');
    const kop = el('div', 'vraagnaam');
    kop.append(el('i', '', persoon.emoji), document.createTextNode(persoon.naam));
    const rij = el('div', 'chips glas');
    v.opties.forEach(optie => {
      rij.appendChild(chip(optie, gekozen.includes(optie), () => {
        const i = gekozen.indexOf(optie);
        if(i >= 0) gekozen.splice(i, 1);
        else if(v.meerkeuze) gekozen.push(optie);
        else gekozen.splice(0, gekozen.length, optie);
        assi.antwoord[persoon.id] = gekozen;
        tekenAssistent();
      }, persoon.kleur));
    });
    const geen = chip('geen van deze', !gekozen.length,
      () => { assi.antwoord[persoon.id] = []; tekenAssistent(); });
    geen.classList.add('stil');
    rij.appendChild(geen);
    vak.append(kop, rij);
    assiInhoudEl.appendChild(vak);
  });
  assiInhoudEl.appendChild(el('div', 'notitie',
    'Wat je kiest blijft bij het kind staan, dus dit hoeft maar één keer.'));
  assiKnopEl.textContent = 'Ga verder';
}

function tekenAssiVoorstellen(){
  assiTitelEl.textContent = 'Dit haalde ik eruit';
  const kaart = el('div', 'vondstlijst glas');
  assi.items.forEach((item, i) => {
    const aan = Boolean(assi.keuze[i]);
    const rij = el('div', 'vondst' + (aan ? ' aan' : ''));
    const tekstvak = el('div', 'vondsttekst');
    tekstvak.appendChild(el('div', 'vondstnaam', item.tekst));
    const wanneer = item.wekelijks
      ? (dagenTekst(item.dagen) || 'elke dag')
      : langeDatum(item.datum);
    const meta = [wanneer, tijdTekst(item), assiWieTekst(item.wie), assiSoortTekst(item)]
      .filter(Boolean).join(' · ');
    if(meta) tekstvak.appendChild(el('div', 'vondstmeta', meta));
    if(tekst(item.bron)) tekstvak.appendChild(el('div', 'vondstbron', '„' + tekst(item.bron) + '”'));
    const vink = knop('vinkknop');
    vink.setAttribute('aria-label', aan ? 'Niet overnemen' : 'Wel overnemen');
    vink.appendChild(el('div', 'vinkvak', aan ? '✓' : ''));
    vink.addEventListener('click', () => { assi.keuze[i] = !assi.keuze[i]; tekenAssistent(); });

    const vlak = knop('vondstvlak');
    vlak.append(el('div', 'vondsticoon', item.icoon), tekstvak);
    const pijl = el('div', 'vondstpijl');
    pijl.appendChild(svgPijl());
    vlak.appendChild(pijl);
    vlak.addEventListener('click', () => bewerkVoorstel(i));

    rij.append(vink, vlak);
    kaart.appendChild(rij);
  });
  assiInhoudEl.append(formKop('Voorstellen'), kaart);
  assiInhoudEl.appendChild(el('div', 'notitie',
    'Tik het vinkje weg wat je niet wilt, en de regel zelf om hem aan te passen. '
    + 'Wat aangevinkt blijft staan gaat in één keer de app in.'));
  const aantal = assi.keuze.filter(Boolean).length;
  assiKnopEl.textContent = aantal === 1 ? 'Zet er 1 in de app' : `Zet er ${aantal} in de app`;
  assiKnopEl.disabled = !aantal;
}

// Een voorstel is nog niets; je kunt het hier nog helemaal omgooien — ook van
// eenmalig naar herhalend, of van agenda naar taak.
function bewerkVoorstel(i){
  const item = assi.items[i];
  openFormulier(item.tekst || 'Voorstel', {
    ...item,
    groep: tekst(item.groep) || eersteGroepnaam(config, item.ritme),
  }, g => dingFormulier(g, null), g => {
    if(!tekst(g.tekst)){
      toonFormMelding('Vul een naam in.');
      return false;
    }
    if(!g.wekelijks && !isDatum(g.datum)){
      toonFormMelding('Vul een datum in, of zet hem op herhalen.');
      return false;
    }
    assi.items[i] = { ...g, bron: tekst(item.bron) };
    assi.keuze[i] = true;
    tekenAssistent();
  });
}

function assiWieTekst(wie){
  const namen = lijstVan(wie).map(id => persoonById(id)).filter(Boolean).map(p => p.naam);
  return namen.length ? namen.join(' en ') : 'iedereen';
}

function assiSoortTekst(item){
  if(item.taak){
    return '✅ ' + (item.ritme === 'nacht' ? '🌙 ' : '☀️ ') + tekst(item.groep, 'ritme');
  }
  return item.wekelijks ? 'elke week' : '';
}

async function assiVerder(){
  if(!assi) return;
  if(assi.stap === 'niets'){ assi.stap = 'plakken'; return tekenAssistent(); }
  if(assi.stap === 'plakken'){
    if(!tekst(assi.bericht)) return toonAssiMelding('Plak eerst een bericht.');
    return await leesUit();
  }
  if(assi.stap === 'vraag'){
    if(await bewaarAntwoorden() === false) return;
    return await leesUit();
  }
  if(assi.stap === 'voorstellen'){
    const gekozen = assi.items.filter((_, i) => assi.keuze[i]);
    if(!gekozen.length) return toonAssiMelding('Kies er minstens één.');
    if(await zetVoorstellenIn(gekozen) !== false) sluitAssistent();
  }
}

async function leesUit(){
  toonAssiMelding('');
  assi.stap = 'bezig';
  tekenAssistent();
  let uit;
  try{
    uit = await vraagAssistent({
      tekst: assi.bericht,
      vandaag: vandaag(),
      ronde: assi.ronde + 1,
      kinderen: config.mensen.map(p => ({ id:p.id, naam:p.naam, kenmerken:p.kenmerken })),
    });
  }catch(err){
    if(!assi) return;
    assi.stap = 'plakken';
    tekenAssistent();
    return toonAssiMelding(err.vanServer
      ? err.message
      : 'Het uitlezen lukte niet (' + err.message + ').');
  }
  if(!assi) return;
  assi.ronde += 1;
  const soort = tekst(uit && uit.type);
  const opties = lijstVan(uit && uit.opties).map(o => tekst(o)).filter(Boolean);
  if(soort === 'vraag' && opties.length && assi.vragen < MAX_VRAGEN){
    assi.vragen += 1;
    assi.vraag = {
      sleutel: tekst(uit.sleutel, 'kenmerk'),
      vraag: tekst(uit.vraag, 'Waar hoort dit bij?'),
      opties,
      meerkeuze: Boolean(uit.meerkeuze),
    };
    assi.antwoord = {};
    assi.stap = 'vraag';
  }else{
    assi.items = lijstVan(uit && uit.items).map(schoonVoorstel).filter(Boolean);
    assi.keuze = assi.items.map(() => true);
    assi.stap = assi.items.length ? 'voorstellen' : 'niets';
  }
  tekenAssistent();
}

// Wat er terugkomt is van buiten: alleen wat we snappen komt erdoor.
const SOORTEN = ['bijzonderheid', 'stap', 'weekritme'];

// Wat er terugkomt is van buiten. Het wordt hier meteen hetzelfde ding als de
// rest van de app kent: wekelijks of niet, taak of niet.
function schoonVoorstel(ruw){
  const soort = SOORTEN.includes(tekst(ruw && ruw.soort)) ? tekst(ruw.soort) : 'bijzonderheid';
  const bekend = new Set(config.mensen.map(p => p.id));
  const datum = isDatum(ruw && ruw.datum) ? tekst(ruw.datum) : '';
  const uit = {
    icoon: tekst(ruw && ruw.icoon, soort === 'stap' ? '⭐' : '🎉'),
    tekst: tekst(ruw && (ruw.tekst || ruw.label)),
    wekelijks: soort === 'weekritme',
    taak: soort === 'stap',
    tijd: tekst(ruw && ruw.tijd),
    tot: tekst(ruw && ruw.tot),
    datum,
    dagen: dagenVan(ruw && ruw.dagen),
    wie: lijstVan(ruw && ruw.wie).map(String).filter(id => bekend.has(id)),
    bron: tekst(ruw && ruw.bron).slice(0, 200),
    ritme: tekst(ruw && ruw.ritme) === 'nacht' ? 'nacht' : 'dag',
    groep: tekst(ruw && ruw.groep),
  };
  if(!uit.tekst) return null;
  // Wat elke week terugkomt heeft dagen in plaats van een datum; leeg betekent
  // daar elke dag, dus dat mag.
  return uit.wekelijks || uit.datum ? uit : null;
}

// Het antwoord op een vraag is een kenmerk van het kind en gaat meteen mee de
// database in — dan hoeft het de volgende keer niet nog eens gevraagd.
async function bewaarAntwoorden(){
  const sleutel = tekst(assi.vraag.sleutel, 'kenmerk');
  const ruw = alsRuweConfig();
  let iets = false;
  lijstVan(ruw.mensen).forEach(persoon => {
    const gekozen = lijstVan(assi.antwoord[persoon.id]).map(x => tekst(x)).filter(Boolean);
    persoon.kenmerken = kenmerkenVan(persoon.kenmerken);
    if(gekozen.length){ persoon.kenmerken[sleutel] = gekozen.join(', '); iets = true; }
    else delete persoon.kenmerken[sleutel];
  });
  return iets ? await bewaarInhoud(ruw, toonAssiMelding) : true;
}

async function zetVoorstellenIn(items){
  const ruw = alsRuweConfig();
  // Hetzelfde bericht twee keer plakken hoort niets dubbels op te leveren.
  items.forEach(item => { if(!alBekend(ruw, item)) zetDingNeer(ruw, item, '', null); });
  return await bewaarInhoud(ruw, toonAssiMelding);
}

function dingSleutel(item, taak){
  return [tekst(taak ? item.label : item.tekst).toLowerCase(),
          tekst(item.datum), dagenVan(item.dagen).join('+'),
          lijstVan(item.wie).join('+')].join('|');
}

function alBekend(bron, g){
  const sleutel = dingSleutel(g, g.taak);
  if(g.taak){
    return lijstVan(bron[g.ritme]).some(groep =>
      lijstVan(groep.stappen).some(stap => dingSleutel(stap, true) === sleutel));
  }
  const lijst = g.wekelijks ? bron.overzicht : bron.events;
  return lijstVan(lijst).some(item => dingSleutel(item, false) === sleutel);
}

// Staat er een uitlezer in routine.json, dan gaat het bericht daarheen. Zo niet,
// dan doet de namaak-assistent hieronder het werk, zodat de schermen ook zonder
// server te proberen zijn.
async function vraagAssistent(lading){
  if(!assistentUrl) return nepAssistent(lading);
  const kopjes = { 'Content-Type': 'application/json' };
  if(assistentSleutel) kopjes['X-Routine-Sleutel'] = assistentSleutel;
  const res = await fetch(assistentUrl, { method:'POST', headers: kopjes, body: JSON.stringify(lading) });
  const uit = await res.json().catch(() => null);
  if(!res.ok){
    // Zegt de uitlezer zelf wat er mis is, dan is dat de melding — er hoeft
    // geen 'het lukte niet' omheen.
    const err = new Error(tekst(uit && uit.fout, 'HTTP ' + res.status));
    err.vanServer = Boolean(uit && uit.fout);
    throw err;
  }
  return uit || { type:'niets' };
}

// --------------------------------------------------------- namaak-assistent ---
// Kent maar een handvol patronen: een datum, een groep als 1-2B, en een paar
// woorden. Genoeg om de hele lus te lopen; het echte uitlezen komt van de
// uitlezer achter `assistent` in routine.json.
const NEP_ICONEN = [
  [/verkeer|fiets|step/, '🚲'],
  [/zwem/, '🏊'],
  [/voetbal|wedstrijd|toernooi/, '⚽'],
  [/judo|karate/, '🥋'],
  [/gym|sportdag|sport/, '🤸'],
  [/verjaardag|trakt|feest/, '🎉'],
  [/foto/, '📷'],
  [/dokter|tandarts|prik|ggd|luizen/, '🩺'],
  [/excursie|museum|uitje|schoolreis|bus/, '🚌'],
  [/voorstelling|optreden|musical/, '🎭'],
  [/rugzak|tas|spullen|lunch|drinken/, '🎒'],
  [/school|juf|meester|groep|ouderavond|rapport/, '🏫'],
];

// Los van elkaar gehouden: hier de dingen die mee moeten, daar de namen van
// wat er te doen is. Als tekst bewaard, want ze worden allebei twee keer
// gebruikt — één keer zoekend, één keer toetsend.
const NEP_DINGEN = '\\b(fiets|step|zwemspullen|zwemtas|gymspullen|gymkleding|gymschoenen|'
  + 'laarzen|regenjas|regenlaarzen|bal|rugzak|tas|lunch|drinken|knuffel|boek|'
  + 'verkleedkleren|helm|gympen|zwemdiploma|kaartje)\\b';
const NEP_NAMEN = new RegExp('\\b(verkeersles|zwemles|gymles|schoolreis|schoolkamp|kamp|'
  + 'excursie|schoolfoto|schoolfotograaf|fotograaf|ouderavond|rapportgesprek|studiedag|'
  + 'sportdag|koningsspelen|voorstelling|musical|toernooi|wedstrijd|training|examen|'
  + 'luizencontrole|juffendag|meesterdag|playbackshow|kerstdiner|paasontbijt|inloopochtend)\\b', 'i');

function nepIcoon(zin, terugval){
  const laag = String(zin || '').toLowerCase();
  const paar = NEP_ICONEN.find(([regel]) => regel.test(laag));
  return paar ? paar[1] : terugval;
}

function nepZinnen(bericht){
  return String(bericht || '').replace(/([.!?:])\s+/g, '$1\n').split(/\n+/)
    .map(z => z.trim()).filter(Boolean);
}

function nepStempel(jaar, maand, dag){
  return `${jaar}-${String(maand + 1).padStart(2, '0')}-${String(dag).padStart(2, '0')}`;
}

// '4 september' of '4 september 2026', en ook '4 of vrijdag 11 september' —
// dan noemt één zin er twee. Zonder jaartal is het de eerstvolgende keer.
function nepDatums(zin, nu){
  const uit = [];
  const maanden = new RegExp(`\\b(${MAANDEN.join('|')})\\b(?:\\s+(\\d{4}))?`, 'gi');
  let m, vanaf = 0;
  while((m = maanden.exec(zin))){
    const maand = MAANDEN.indexOf(m[1].toLowerCase());
    const jaar = m[2] ? Number(m[2]) : Number(nu.slice(0, 4));
    const dagen = nepDagnummers(zin.slice(vanaf, m.index));
    vanaf = maanden.lastIndex;
    dagen.forEach(dag => {
      let stempel = nepStempel(jaar, maand, dag);
      if(!m[2] && stempel < nu) stempel = nepStempel(jaar + 1, maand, dag);
      if(!uit.includes(stempel)) uit.push(stempel);
    });
  }
  return uit;
}

// De dagnummers die vlak voor een maandnaam staan. Weekdagen en 'of' en 'en'
// mogen ertussen; bij het eerste andere woord houdt de rij op.
function nepDagnummers(stuk){
  const uit = [];
  const woorden = stuk.toLowerCase().trim().split(/\s+/);
  for(let i = woorden.length - 1; i >= 0; i--){
    if(/\d\s*-\s*\d/.test(woorden[i])) break;        // '1-2' is een groep, geen dag
    const woord = woorden[i].replace(/[^a-z0-9]/g, '');
    const getal = /^(\d{1,2})(?:e|de|ste)?$/.exec(woord);
    if(getal){
      const dag = Number(getal[1]);
      if(dag < 1 || dag > 31) break;
      uit.unshift(dag);
      continue;
    }
    if(!woord || woord === 'of' || woord === 'en' || DAGNAMEN.includes(woord)) continue;
    break;
  }
  return uit;
}

// 'groep 1-2 B en D' levert 1-2B en 1-2D op.
function nepGroepen(zin){
  const uit = [];
  const regel = /(\d\s*-\s*\d|\d)\s*([A-H])\b((?:\s*(?:,|\ben\b|\bof\b|\/)\s*[A-H]\b)*)/g;
  let m;
  while((m = regel.exec(zin))){
    const basis = m[1].replace(/\s+/g, '');
    [m[2]].concat((m[3] || '').match(/[A-H]\b/g) || []).forEach(letter => {
      const groep = basis + letter;
      if(!uit.includes(groep)) uit.push(groep);
    });
  }
  return uit;
}

function nepWaarden(kind){
  return Object.values(kenmerkenVan(kind && kind.kenmerken))
    .flatMap(waarde => String(waarde).split(/\s*,\s*/)).map(w => w.trim()).filter(Boolean);
}

// Een woord als 'verkeerslessen' of 'ouderavond' is de naam van wat er speelt;
// weekdagen tellen niet mee, want die eindigen ook op -dag.
function nepNaam(bericht){
  const bekend = NEP_NAMEN.exec(String(bericht));
  if(bekend) return bekend[1].charAt(0).toUpperCase() + bekend[1].slice(1).toLowerCase();
  const woorden = String(bericht)
    .match(/\b[A-Za-z]{4,}(?:les|lessen|dag|avond|reis|tocht|feest|show|gesprek|uitje|toernooi|wedstrijd|training|controle|optreden)\b/g) || [];
  const woord = woorden.find(w => !DAGNAMEN.includes(w.toLowerCase())
    && !/^(vandaag|middag|namiddag|ochtend|morgen|overdag|weekdag|werkdag)$/i.test(w));
  if(woord){
    const enkel = woord.replace(/lessen$/i, 'les');
    return enkel.charAt(0).toUpperCase() + enkel.slice(1).toLowerCase();
  }
  const eerste = (nepZinnen(bericht)[0] || 'Uit een bericht')
    .replace(/^(onderwerp|betreft|subject)\s*:?\s*/i, '');
  return eerste.slice(0, 40);
}

function nepDingen(zin){
  return (String(zin).match(new RegExp(NEP_DINGEN, 'gi')) || []).map(w => w.toLowerCase());
}

// 'Neem een rugzak mee' telt net zo goed als 'meegeven'; een kale 'mee' alleen
// als er ook iets in de zin staat dat je mee kúnt nemen.
function nepMeeZin(zin){
  if(/mee(?:geven|nemen|brengen|genomen|gebracht|gegeven)|mee te nemen|denk\s+aan/i.test(zin)) return true;
  return /\bmee\b/i.test(zin) && nepDingen(zin).length > 0;
}

// 'Deze mag 's morgens worden meegenomen' zegt niet wát; dan kijken we naar de
// rest van het bericht, want daar staat de fiets of de step wel.
function nepMeeNemen(zin, bericht){
  const gevonden = nepDingen(zin).length ? nepDingen(zin) : nepDingen(bericht);
  const uniek = gevonden.filter((w, i) => gevonden.indexOf(w) === i);
  if(!uniek.length) return 'Spullen mee';
  const woorden = uniek.join(' of ');
  return woorden.charAt(0).toUpperCase() + woorden.slice(1) + ' mee';
}

const NEP_VULWOORDEN = new Set(['elke','iedere','elk','ieder','wekelijks','altijd','om','op',
  'van','tot','uur','en','de','het','een','is','zijn','gaat','naar','met','heeft','in','bij',
  'voor','ook','dan','er','we','ik','moet','moeten','s','avonds','ochtends','middags','dag']);

// Wat er overblijft als je de dag, de tijd, de namen en de vulwoorden weghaalt,
// is meestal waar het over gaat: 'iedere dinsdag om 18:00 tennis Emma' → tennis.
function nepLosseNaam(bericht, kinderen){
  const namen = new Set(lijstVan(kinderen).map(k => tekst(k.naam).toLowerCase()));
  const woorden = String(bericht).replace(/\d{1,2}\s*[:.]\s*\d{2}/g, ' ')
    .split(/[^A-Za-zÀ-ÿ]+/).filter(Boolean)
    .filter(w => {
      const laag = w.toLowerCase();
      return !DAGNAMEN.includes(laag) && !namen.has(laag) && !NEP_VULWOORDEN.has(laag);
    });
  if(!woorden.length) return '';
  const zin = woorden.join(' ');
  return zin.charAt(0).toUpperCase() + zin.slice(1);
}

// Een getypte regel zonder datum maar met een weekdag erin hoort bij het
// weekritme. De echte uitlezer doet dit beter; dit is genoeg om het te proberen.
function nepWeek(bericht, kinderen){
  const laag = String(bericht).toLowerCase();
  const dagen = DAGNAMEN.map((naam, i) => laag.includes(naam) ? DAGEN[i] : null).filter(Boolean);
  if(!dagen.length) return null;
  const naam = nepLosseNaam(bericht, kinderen);
  if(!naam) return null;
  const tijden = (String(bericht).match(/\d{1,2}\s*[:.]\s*\d{2}/g) || [])
    .map(t => t.replace(/\s+/g, '').replace('.', ':'));
  return {
    soort: 'weekritme',
    icoon: nepIcoon(bericht, '📅'),
    tekst: naam,
    dagen,
    tijd: tijden[0] || '',
    tot: tijden[1] || '',
    wie: lijstVan(kinderen)
      .filter(k => tekst(k.naam) && laag.includes(tekst(k.naam).toLowerCase()))
      .map(k => k.id),
    bron: String(bericht).trim().slice(0, 120),
  };
}

function nepAssistent(lading){
  const nu = tekst(lading.vandaag, vandaag());
  const bericht = tekst(lading.tekst);
  const kinderen = lijstVan(lading.kinderen);
  const regels = nepZinnen(bericht)
    .map(zin => ({ zin, datums: nepDatums(zin, nu), groepen: nepGroepen(zin) }));

  let bruikbaar = regels.filter(r => r.datums.length);
  if(!bruikbaar.length){
    const week = nepWeek(bericht, kinderen);
    return week ? { type:'voorstellen', items:[week] } : { type:'niets' };
  }
  // 'Op vrijdag 4 of vrijdag 11 september' zegt nog niet wie wanneer moet. Staan
  // er zinnen bij die één dag noemen, dan is dit de inleiding en telt hij niet.
  const enkel = bruikbaar.filter(r => r.datums.length === 1);
  if(enkel.length) bruikbaar = enkel;

  const alleGroepen = [];
  bruikbaar.forEach(r => r.groepen.forEach(g => { if(!alleGroepen.includes(g)) alleGroepen.push(g); }));
  const kent = kinderen.some(kind => nepWaarden(kind).some(w => alleGroepen.includes(w)));

  if(alleGroepen.length && !kent && Number(lading.ronde) < 2){
    return {
      type: 'vraag',
      sleutel: 'schoolgroep',
      vraag: `Dit bericht gaat over ${alleGroepen.join(', ')}. Wie zit waarin?`,
      opties: alleGroepen,
      meerkeuze: false,
    };
  }

  // Zegt een deel van de zinnen bij welke groep een dag hoort, dan zijn de
  // zinnen zonder groep de inleiding — die gaan er ook af.
  const metGroep = bruikbaar.filter(r => r.groepen.length);
  if(metGroep.length) bruikbaar = metGroep;

  const naam = nepNaam(bericht);
  const icoon = nepIcoon(bericht, '📅');
  const items = [];
  const gezien = new Set();
  // Twee zinnen over dezelfde dag leveren één voorstel op, geen twee.
  const erbij = item => {
    const sleutel = [item.soort, item.tekst, item.datum, item.wie.join('+')].join('|');
    if(gezien.has(sleutel)) return;
    gezien.add(sleutel);
    items.push(item);
  };

  bruikbaar.forEach(regel => {
    const wie = regel.groepen.length
      ? kinderen.filter(kind => nepWaarden(kind).some(w => regel.groepen.includes(w))).map(k => k.id)
      : [];
    // Weten we de groepen wél, en zit er niemand van ons in, dan gaat die dag
    // niet over dit gezin.
    if(regel.groepen.length && !wie.length && kent) return;
    erbij({ soort:'bijzonderheid', icoon, tekst: naam, datum: regel.datums[0], wie, bron: regel.zin });
  });

  const mee = regels.find(r => nepMeeZin(r.zin));
  if(mee){
    const label = nepMeeNemen(mee.zin, bericht);
    items.slice().forEach(v => erbij({
      soort:'stap', ritme:'dag', groep:'Weggaan',
      icoon: nepIcoon(label, nepIcoon(mee.zin, '🎒')), tekst: label,
      datum: v.datum, wie: v.wie, bron: mee.zin,
    }));
  }
  return items.length ? { type:'voorstellen', items } : { type:'niets' };
}

// ------------------------------------------------------------ regels in de lijst
function dagenTekst(dagen){
  const d = lijstVan(dagen);
  if(!d.length || d.length >= WEEKDAGEN.length) return '';
  return WEEKDAGEN.filter(x => d.includes(x)).join(', ');
}

function wieVoorRij(wie){
  const mensen = bewerkMensen();
  const gekozen = lijstVan(wie).map(id => mensen.find(p => p.id === id)).filter(Boolean);
  return gekozen.length && gekozen.length < mensen.length ? gekozen : [];
}

function maakBewerkRij(opties){
  const rij = el('div', 'bewerkrij' + (opties.tweeregels ? ' tweeregels' : ''));
  rij.appendChild(minKnop(opties.wegTitel, opties.opWeg));

  const vlak = knop('rijknopvlak');
  vlak.append(
    el('div', 'emojiknop', opties.icoon),
    el('div', 'rijlabel' + (opties.label ? '' : ' leeg'), opties.label || opties.leeg),
  );
  const meta = el('div', 'rijmeta');
  if(opties.tijd) meta.appendChild(el('div', 'rijdagen', opties.tijd));
  const dagen = dagenTekst(opties.dagen);
  if(dagen) meta.appendChild(el('div', 'rijdagen', dagen));
  if(opties.extra) meta.appendChild(el('div', 'rijdagen', opties.extra));
  const wie = wieVoorRij(opties.wie);
  if(wie.length){
    const vak = el('div', 'rijwie');
    wie.forEach(p => {
      const bol = el('span', '', p.emoji);
      bol.style.background = zacht(p.kleur, .22);
      vak.appendChild(bol);
    });
    meta.appendChild(vak);
  }
  if(opties.kleur){
    const bol = el('div', 'rijkleur');
    bol.style.background = opties.kleur;
    meta.appendChild(bol);
  }
  if(meta.childNodes.length) vlak.appendChild(meta);
  vlak.addEventListener('click', opties.opOpenen);

  // Zonder greep in een lijst die je niet zelf ordent; anders belooft hij iets
  // wat er niet gebeurt.
  rij.appendChild(vlak);
  if(!opties.geenGreep) rij.appendChild(greepKnop());
  return rij;
}

function velRitme(soort){
  const stuk = document.createDocumentFragment();

  const segment = el('div', 'segment glas');
  segment.style.marginTop = '0';
  [['dag','Ochtend'], ['nacht','Avond']].forEach(([waarde, label]) => {
    const b = knop(waarde === soort ? 'aan' : '', label);
    b.addEventListener('click', () => { velSoort = waarde; tekenVel(); });
    segment.appendChild(b);
  });
  stuk.appendChild(segment);

  concept[soort].forEach((groep, gi) => {
    const kaart = el('div', 'bewerkkaart glas');
    const regel = el('div', 'groepregel');
    regel.append(
      minKnop('Groep verwijderen', () => { concept[soort].splice(gi, 1); tekenVel(); }),
      veld(groep.groep, 'Groep', '', v => { groep.groep = v; }),
      veld(groep.tijd, 'tijd', 'tijd', v => { groep.tijd = v; }),
    );
    kaart.appendChild(regel);

    // Een stap met een datum hoort maar op één plek thuis: bij Eenmalig.
    const vast = groep.stappen.filter(stap => !isDatum(stap.datum));
    const eenmalig = groep.stappen.length - vast.length;
    const rijenvak = el('div');
    vast.forEach((stap) => {
      const si = groep.stappen.indexOf(stap);
      rijenvak.appendChild(maakBewerkRij({
        icoon: stap.icoon,
        label: stap.label,
        leeg: 'Naamloze stap',
        tijd: kortDatum(stap.datum),
        dagen: stap.dagen,
        wie: stap.wie,
        wegTitel: 'Stap verwijderen',
        opWeg: () => { groep.stappen.splice(si, 1); tekenVel(); },
        opOpenen: () => openDing(stap.label || 'Stap',
          { waar:'stap', ritme:soort, groep, stap }, {}, () => concept, tekenVel),
      }));
    });
    kaart.appendChild(rijenvak);
    maakSleepbaar(rijenvak, groep.stappen, tekenVel);

    if(eenmalig){
      kaart.appendChild(el('div', 'kaartnoot', eenmalig === 1
        ? 'Hier staat ook één ding voor één dag; dat bewerk je bij Eenmalig.'
        : `Hier staan ook ${eenmalig} dingen voor één dag; die bewerk je bij Eenmalig.`));
    }

    kaart.appendChild(toevoegRij('Stap toevoegen', () => openDing('Nieuwe stap', null,
      { icoon:'⭐', taak:true, ritme:soort, groep: tekst(groep.groep) },
      () => concept, tekenVel)));
    stuk.appendChild(kaart);
  });

  const erbij = knop('kaartknop glas');
  erbij.append(el('span', 'plusknop', '+'), document.createTextNode('Groep toevoegen'));
  erbij.addEventListener('click', () => {
    concept[soort].push({ groep:'Nieuwe groep', tijd:'', stappen:[] });
    tekenVel();
  });
  stuk.appendChild(erbij);
  return stuk;
}

function velKinderen(){
  const stuk = document.createDocumentFragment();
  const kaart = el('div', 'bewerkkaart glas');
  const rijenvak = el('div');

  concept.mensen.forEach((persoon, i) => {
    rijenvak.appendChild(maakBewerkRij({
      icoon: persoon.emoji,
      label: persoon.naam,
      leeg: 'Naamloos',
      kleur: persoon.kleur,
      wegTitel: 'Kind verwijderen',
      opWeg: () => {
        if(concept.mensen.length <= 1) return toonMelding('Er moet minstens één kind overblijven.');
        // Anders wijst een stap naar iemand die er niet meer is.
        losmaken(persoon.id);
        concept.mensen.splice(i, 1);
        toonMelding('');
        tekenVel();
      },
      opOpenen: () => openFormulier(persoon.naam || 'Kind', persoon, kindFormulier, nieuw => {
        Object.assign(persoon, {
          naam: nieuw.naam, emoji: tekst(nieuw.emoji, '🙂'),
          kleur: tekst(nieuw.kleur, persoon.kleur),
          kenmerken: uitParen(nieuw.kenmerkParen),
        });
        tekenVel();
      }),
    }));
  });

  kaart.appendChild(rijenvak);
  maakSleepbaar(rijenvak, concept.mensen, tekenVel);
  kaart.appendChild(toevoegRij('Kind toevoegen', () => {
    const kind = {
      id: nieuwId(), naam:'', emoji:'🙂',
      kleur: KLEUREN[concept.mensen.length % KLEUREN.length],
      kenmerken: {},
    };
    openFormulier('Nieuw kind', kind, kindFormulier, nieuw => {
      if(!tekst(nieuw.naam)) return;
      concept.mensen.push({ ...kind, naam: nieuw.naam, emoji: nieuw.emoji, kleur: nieuw.kleur,
        kenmerken: uitParen(nieuw.kenmerkParen) });
      tekenVel();
    });
  }));
  stuk.appendChild(kaart);

  stuk.appendChild(el('div', 'notitie',
    'Iedereen hier krijgt een eigen rondje bij elke stap. Namen wijzigen mag: '
    + 'de vinkjes blijven bij de juiste persoon.'));
  return stuk;
}

function losmaken(id){
  ['dag','nacht'].forEach(r => lijstVan(concept[r]).forEach(g =>
    lijstVan(g.stappen).forEach(s => { s.wie = lijstVan(s.wie).filter(x => x !== id); })));
  [concept.overzicht, concept.events].forEach(lijst => lijstVan(lijst).forEach(item => {
    item.wie = lijstVan(item.wie).filter(x => x !== id);
  }));
}

function velOverzicht(){
  const stuk = document.createDocumentFragment();
  const items = concept.overzicht = lijstVan(concept.overzicht);

  const kaart = el('div', 'bewerkkaart glas');
  const rijenvak = el('div');
  items.forEach((item, i) => {
    rijenvak.appendChild(maakBewerkRij({
      icoon: item.icoon,
      label: item.tekst,
      leeg: 'Naamloos',
      tijd: (naAvond(item, concept.avondVanaf) ? '🌙 ' : '') + tijdTekst(item),
      dagen: item.dagen,
      wie: item.wie,
      // Een tijdvak, de dagen én wie het betreft passen niet naast de naam.
      tweeregels: true,
      wegTitel: 'Verwijderen',
      opWeg: () => { items.splice(i, 1); tekenVel(); },
      opOpenen: () => openDing(item.tekst || 'Item',
        { waar:'overzicht', item }, {}, () => concept, tekenVel),
    }));
  });
  kaart.appendChild(rijenvak);
  maakSleepbaar(rijenvak, items, tekenVel);

  kaart.appendChild(toevoegRij('Item toevoegen', () => openDing('Nieuw item', null,
    { icoon:'📅', wekelijks:true, taak:false }, () => concept, tekenVel)));
  stuk.appendChild(kaart);
  return stuk;
}

// Alles wat maar één dag geldt, ongeacht waar het staat: een bijzonderheid bij
// Deze week, en een stap die één ochtend meedoet. Op datum bij elkaar, want zo
// kijk je ernaar — niet per lijst waar het toevallig in bewaard wordt.
function eenmaligeDingen(bron){
  const uit = lijstVan(bron.events)
    .filter(item => isDatum(item.datum))
    .map(item => ({ soort:'event', datum:item.datum, item }));
  ['dag','nacht'].forEach(ritme => lijstVan(bron[ritme]).forEach(groep =>
    lijstVan(groep.stappen).forEach(stap => {
      if(isDatum(stap.datum)) uit.push({ soort:'stap', datum:stap.datum, ritme, groep, stap });
    })));
  return uit.sort((a, b) => a.datum.localeCompare(b.datum)
    || tekst(a.item && a.item.tijd).localeCompare(tekst(b.item && b.item.tijd)));
}

function eenmaligTekst(){
  const aantal = eenmaligeDingen(config).length;
  if(!aantal) return 'niets op een datum';
  return aantal === 1 ? 'één ding op een datum' : aantal + ' dingen op een datum';
}



function eenmaligeRij(ding){
  const isEvent = ding.soort === 'event';
  const bron = isEvent ? ding.item : ding.stap;
  const plek = isEvent
    ? { waar:'event', item: ding.item }
    : { waar:'stap', ritme: ding.ritme, groep: ding.groep, stap: ding.stap };
  return maakBewerkRij({
    icoon: bron.icoon,
    label: isEvent ? bron.tekst : bron.label,
    leeg: 'Naamloos',
    tijd: kortDatum(ding.datum),
    extra: isEvent
      ? tijdTekst(bron)
      : '✅ ' + (ding.ritme === 'dag' ? '☀️ ' : '🌙 ') + tekst(ding.groep.groep, 'ritme'),
    wie: bron.wie,
    tweeregels: true,
    geenGreep: true,
    wegTitel: 'Verwijderen',
    opWeg: () => { haalDingWeg(concept, plek); tekenVel(); },
    opOpenen: () => openDing((isEvent ? bron.tekst : bron.label) || 'Iets eenmaligs',
      plek, {}, () => concept, tekenVel),
  });
}

function velEenmalig(){
  const stuk = document.createDocumentFragment();
  const dingen = eenmaligeDingen(concept);

  if(dingen.length){
    const kaart = el('div', 'bewerkkaart glas');
    dingen.forEach(ding => kaart.appendChild(eenmaligeRij(ding)));
    stuk.appendChild(kaart);
  }else{
    stuk.appendChild(el('div', 'leegkaart glas', 'Er staat niets op een datum.'));
  }

  const erbij = knop('kaartknop glas');
  erbij.append(el('span', 'plusknop', '+'), document.createTextNode('Iets eenmaligs toevoegen'));
  erbij.addEventListener('click', () => openDing('Iets eenmaligs', null,
    { icoon:'🎉', wekelijks:false, taak:false }, () => concept, tekenVel));
  stuk.appendChild(erbij);

  stuk.appendChild(el('div', 'notitie',
    'Alles wat maar één dag geldt staat hier, en alleen hier. Een taak wordt die dag een kaartje '
    + 'tussen de stappen, in het onderdeel dat je kiest; agenda is een regel bij Vandaag en Deze '
    + 'week. Wat geweest is verdwijnt vanzelf bij het eerstvolgende bewaren.'));
  return stuk;
}


function velAlgemeen(){
  const stuk = document.createDocumentFragment();
  const kaart = el('div', 'bewerkkaart glas');

  const rij1 = el('div', 'bewerkrij');
  rij1.append(el('div', 'tegel', '🏡'), veld(concept.titel, 'Naam van de app', '', v => { concept.titel = v; }));
  kaart.appendChild(rij1);

  const rij2 = el('div', 'bewerkrij');
  const uur = veld(String(concept.avondVanaf), '15', 'getal', v => { concept.avondVanaf = v; });
  uur.type = 'number'; uur.min = '0'; uur.max = '23';
  rij2.append(el('div', 'tegel', '🌙'), el('div', 'taaknaam', 'Avond begint om'), uur);
  kaart.appendChild(rij2);

  stuk.appendChild(kaart);
  stuk.appendChild(el('div', 'notitie',
    'Open je de app na dit uur, dan staat het avondritme meteen klaar.'));
  return stuk;
}

function tekenVel(){
  const hoogte = velEl.scrollTop;
  veltitelEl.textContent = VELTITELS[velSoort] || 'Bewerken';
  velinhoudEl.innerHTML = '';
  if(velSoort === 'kinderen') velinhoudEl.appendChild(velKinderen());
  else if(velSoort === 'overzicht') velinhoudEl.appendChild(velOverzicht());
  else if(velSoort === 'eenmalig') velinhoudEl.appendChild(velEenmalig());
  else if(velSoort === 'algemeen') velinhoudEl.appendChild(velAlgemeen());
  else velinhoudEl.appendChild(velRitme(velSoort));
  velEl.scrollTop = hoogte;
}

function openVel(soort){
  concept = alsRuweConfig();
  ['dag','nacht'].forEach(r => concept[r].forEach(g => g.stappen.forEach(s => {
    s.dagen = lijstVan(s.dagen); s.wie = lijstVan(s.wie);
  })));
  concept.overzicht = lijstVan(concept.overzicht);
  velSoort = soort;
  toonMelding('');
  scrimEl.hidden = false;
  velEl.hidden = false;
  document.body.style.overflow = 'hidden';
  tekenVel();
  velEl.scrollTop = 0;
}

function sluitVel(){
  sluitFormulier(false);
  scrimEl.hidden = true;
  velEl.hidden = true;
  document.body.style.overflow = '';
  concept = null;
}

function schoneGroepen(lijst){
  return lijstVan(lijst).map(g => ({
    groep: tekst(g.groep),
    tijd: tekst(g.tijd),
    stappen: lijstVan(g.stappen).filter(s => tekst(s.label)).map(s => {
      const uit = { icoon: tekst(s.icoon, '⭐'), label: tekst(s.label) };
      if(isDatum(s.datum)) uit.datum = tekst(s.datum);
      const dagen = dagenVan(s.dagen);
      if(dagen.length && !uit.datum) uit.dagen = dagen;
      const wie = lijstVan(s.wie);
      if(wie.length) uit.wie = wie;
      return uit;
    }),
  })).filter(g => g.stappen.length || tekst(g.groep));
}

// Eén lijst met items die zelf hun dagen kennen; lege regels vallen weg.
function schoonOverzicht(bron, vanaf){
  return lijstVan(bron).filter(item => tekst(item && item.tekst)).map(item => {
    const uit = { icoon: tekst(item.icoon, '📅'), tekst: tekst(item.tekst) };
    if(tekst(item.tijd)) uit.tijd = tekst(item.tijd);
    if(tekst(item.tot)) uit.tot = tekst(item.tot);
    const dagen = dagenVan(item.dagen);
    if(dagen.length && dagen.length < WEEKDAGEN.length) uit.dagen = dagen;
    const wie = lijstVan(item.wie);
    if(wie.length) uit.wie = wie;
    if(naAvond(item, vanaf)) uit.avond = true;
    return uit;
  });
}

// Wat geweest is ruimt zichzelf op: een bijzonderheid van gisteren gaat er bij
// het eerstvolgende bewaren uit.
function schoonEvents(bron){
  const grens = vandaag();
  return lijstVan(bron)
    .filter(e => tekst(e && e.tekst) && /^\d{4}-\d{2}-\d{2}$/.test(tekst(e && e.datum)))
    .filter(e => tekst(e.datum) >= grens)
    .map(e => {
      const uit = {
        id: tekst(e.id) || nieuwId(),
        icoon: tekst(e.icoon, '🎉'),
        tekst: tekst(e.tekst),
        datum: tekst(e.datum),
      };
      if(tekst(e.tijd)) uit.tijd = tekst(e.tijd);
      if(tekst(e.tot)) uit.tot = tekst(e.tot);
      const wie = lijstVan(e.wie);
      if(wie.length) uit.wie = wie;
      return uit;
    });
}

function opgeschoond(c){
  return {
    titel: tekst(c.titel, STANDAARD.titel),
    avondVanaf: uurOf(c.avondVanaf, STANDAARD.avondVanaf),
    mensen: lijstVan(c.mensen).map((p, i) => ({
      id: tekst(p.id, nieuwId()),
      naam: tekst(p.naam, 'Naamloos'),
      emoji: tekst(p.emoji, '🙂'),
      kleur: tekst(p.kleur, KLEUREN[i % KLEUREN.length]),
      kenmerken: kenmerkenVan(p.kenmerken),
    })),
    dag: schoneGroepen(c.dag),
    nacht: schoneGroepen(c.nacht),
    overzicht: schoonOverzicht(c.overzicht, uurOf(c.avondVanaf, STANDAARD.avondVanaf)),
    events: schoonEvents(c.events),
  };
}

async function bewaarVel(){
  const nieuw = opgeschoond(concept);
  if(!nieuw.mensen.length) return toonMelding('Er moet minstens één kind zijn.');
  if(!aantalStappen(maakGroepen(nieuw.dag)) && !aantalStappen(maakGroepen(nieuw.nacht))){
    return toonMelding('Er moet minstens één stap overblijven.');
  }
  try{
    await bewaarConfigOpAfstand(nieuw);
  }catch(err){
    return toonMelding('Opslaan lukte niet (' + err.message + ').');
  }
  config = normaliseer(nieuw);
  bewaarLokaalConfig(nieuw);
  sluitVel();
  toepassen();
}

// ------------------------------------------------------------- bijwerken ---
// iOS bewaart index.html hardnekkig zodra de pagina op het beginscherm staat;
// een gewone herlaad krijgt dan opnieuw dezelfde bewaarde versie. Daarom draagt
// elke uitgave zijn commit-nummer bij zich en staat datzelfde nummer in
// versie.txt ernaast.
function herlaad(){
  const url = new URL(location.href);
  url.searchParams.set('v', Date.now().toString(36));
  location.replace(url);
}

async function nieuwerBeschikbaar(){
  if(VERSIE.startsWith('__')) return null;
  try{
    const res = await fetch('versie.txt', { cache:'no-store' });
    if(!res.ok) return null;
    const daar = (await res.text()).trim();
    return daar && daar !== VERSIE ? daar : null;
  }catch(err){ return null; }
}

async function haalNieuwsteBinnen(){
  if(!velEl.hidden) return;          // niet herladen terwijl iemand zit te bewerken
  const nieuw = await nieuwerBeschikbaar();
  if(!nieuw) return;
  try{
    if(sessionStorage.getItem('geprobeerd') === nieuw) return;
    sessionStorage.setItem('geprobeerd', nieuw);
  }catch(err){}
  herlaad();
}

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') haalNieuwsteBinnen();
});

// In de app-weergave op iOS is er geen browserbalk en dus ook geen
// trek-om-te-verversen. Daarom hier zelf, en alleen als de pagina echt als app
// draait — in een tabblad doet de browser dit al.
const alsApp = window.navigator.standalone === true ||
  window.matchMedia('(display-mode: standalone)').matches;

if(alsApp){
  const trekEl = $('trek');
  const DREMPEL = 70;
  let begin = null, afstand = 0, bezig = false;

  const toon = y => {
    afstand = y;
    trekEl.style.transform = `translateY(${y - 48}px) rotate(${Math.round(y * 4)}deg)`;
    trekEl.style.opacity = Math.min(y / DREMPEL, 1);
  };
  const terug = () => {
    trekEl.classList.add('terug');
    toon(0);
    setTimeout(() => trekEl.classList.remove('terug'), 300);
  };

  document.addEventListener('touchstart', e => {
    begin = (!bezig && velEl.hidden && kiezerEl.hidden && window.scrollY <= 0 && e.touches.length === 1)
      ? e.touches[0].clientY : null;
    afstand = 0;
  }, { passive:true });

  document.addEventListener('touchmove', e => {
    if(begin === null) return;
    const gesleept = e.touches[0].clientY - begin;
    toon(gesleept > 0 ? Math.min(gesleept * 0.5, 95) : 0);
  }, { passive:true });

  document.addEventListener('touchend', () => {
    if(begin === null) return;
    begin = null;
    if(afstand < DREMPEL) return terug();
    bezig = true;
    trekEl.classList.add('bezig');
    toon(DREMPEL);
    herlaad();
  }, { passive:true });
}

// ------------------------------------------------------------- aansluiten ---
segmentEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) zetRitme(b.dataset.ritme);
});

tabbalkEl.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(b) zetPagina(b.dataset.pagina);
});

$('opnieuwKnop').addEventListener('click', () => {
  done[ritme] = new Map();
  render();
  wisRitme(ritme);
});

$('velAf').addEventListener('click', sluitVel);
$('velGereed').addEventListener('click', bewaarVel);
$('formAf').addEventListener('click', () => sluitFormulier(false));
$('formGereed').addEventListener('click', () => sluitFormulier(true));
formScrimEl.addEventListener('click', () => sluitFormulier(false));
$('assiAf').addEventListener('click', sluitAssistent);
$('assiKnop').addEventListener('click', assiVerder);
assiScrimEl.addEventListener('click', sluitAssistent);
$('kiezerGereed').addEventListener('click', () => sluitKiezer(true));
kiesScrimEl.addEventListener('click', () => sluitKiezer(false));

async function laden(){
  let ruw = null;
  try{
    const res = await fetch('routine.json', { cache:'no-cache' });
    if(res.ok) ruw = await res.json();
  }catch(err){ console.warn('routine.json niet geladen:', err); }
  assistentUrl = tekst(ruw && ruw.assistent);
  assistentSleutel = tekst(ruw && ruw.assistentSleutel);
  // De laatst bekende inhoud staat lokaal en schildert meteen; de database
  // corrigeert zodra die antwoordt.
  config = normaliseer(laadLokaalConfig() || ruw || STANDAARD);
}

ritme = beginRitme();
toepassen();
laden().then(() => {
  ritme = beginRitme();
  toepassen();
  return startOpslag();
}).then(haalNieuwsteBinnen);
</script>
